            x-parameter-type: "analyzerStructure"
            type: "object"
            additionalProperties: false
            properties:
              timeframe:
                title: "Timeframe"
                description: "By default, the general timeframe for queries is the\
                  \ last 2 hours from now."
                default: {}
                x-parameter-type: "timeframe"
                type: "object"
                additionalProperties: false
                properties:
                  startTime:
                    title: "Start time"
                    description: "Supports absolute or relative timestamps. Specify\
                      \ an absolute time in the ISO 8601 (yyyy-MM-ddTHH:mm:ssZ) format\
                      \ or use a relative time such as 'now-2h'."
                    type: "string"
                    format: "dt-date-time"
                    examples:
                    - "2023-04-10T12:00:00Z"
                    default: "now-2h"
                  endTime:
                    title: "End time"
                    type: "string"
                    format: "dt-date-time"
                    examples:
                    - "2023-04-12T12:00:00Z"
                    default: "now"
                required:
                - "startTime"
                examples:
                - startTime: "2023-04-10T12:00Z"
                - startTime: "2023-04-10T12:00Z"
                  endTime: "2023-04-12T12:00Z"
              resolveDimensionalQueryData:
                title: "Resolve data"
                description: "Include output query results in analysis result."
                default: false
                x-parameter-type: "boolean"
                type: "boolean"
              logVerbosity:
                title: "Log verbosity"
                description: "Controls the level of log details in analysis result."
                default: "WARNING"
                x-parameter-type: "enumeration"
                type: "string"
                anyOf:
                - title: "Tracing"
                  description: "Tracing"
                  enum:
                  - "TRACING"
                - title: "Info"
                  description: "Info"
                  enum:
                  - "INFO"
                - title: "Warning"
                  description: "Warning"
                  enum:
                  - "WARNING"
                - title: "Severe"
                  description: "Severe"
                  enum:
                  - "SEVERE"
          timeSeriesData:
            title: "Time series data"
            description: "Time series data or query to analyze. Supports the Dynatrace\
              \ Query Language (DQL)."
            x-parameter-type: "timeseriesQuery"
            type: "string"
          coverageProbability:
            title: "Coverage probability"
            description: "The forecast's targeted coverage probability. Defines how\
              \ many of the observations (in percent) lie within the prediction interval."
            default: 0.9
            x-parameter-type: "double"
            type: "number"
            minimum: 0.0
            maximum: 1.0
          forecastHorizon:
            title: "Data points to predict"
            description: "Total steps the time series is forecasted. More steps generally\
              \ results in less reliable forecasts and longer analyzer runtimes."
            default: 100
            x-parameter-type: "integer"
            type: "integer"
            minimum: 1
            maximum: 600
          nPaths:
            title: "Number of paths"
            description: "Total simulated paths. As the forecasting algorithm uses\
              \ a simulation-based approach, more paths generally result in more accurate\
              \ forecasts but can increase analyzer runtimes."
            default: 200
            x-parameter-type: "integer"
            type: "integer"
            minimum: 0
            maximum: 1000
          applyZeroLowerBoundHeuristic:
            title: "Apply zero lower bound heuristic"
            description: "Apply a lower bound of zero."
            default: false
            x-parameter-type: "boolean"
            type: "boolean"
          useModelCache:
            title: "Trained model is stored"
            description: "If true, the trained model is stored in and loaded from\
