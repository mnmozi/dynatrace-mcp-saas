openapi: "3.0.4"
info:
  title: "Davis AI - Predictive and Causal"
  description: "This API allows you to interact with Davis® predictive and causal\
    \ AI for customized AI/ML analysis.\n\nRefer to the [service documentation](https://dt-url.net/platform-services-davis-analyzer-service)\
    \ to get familiar with the key concepts.\n"
  x-service-category: "Davis AI"
  x-summary: "Explore our Davis AI – Predictive and Causal API."
  version: "1.7.1"
servers:
- url: "https://asn8731h.sprint.apps.dynatracelabs.com/platform/davis/analyzers/v1"
  x-api-gateway-url: "/platform/davis/analyzers/v1"
tags:
- name: "Analyzers"
paths:
  /analyzers:
    get:
      security:
      - ssoAuth:
        - "davis:analyzers:read"
      - ssoBearerAuth: []
      tags:
      - "Analyzers"
      summary: "Query all available analyzer definitions."
      description: "**Required scope:** davis:analyzers:read<br/><br/>The analyzer\
        \ definition contains meta-information about an analyzer, including its input\
        \ and output structure:\n* The `input` definition specifies which fields the\
        \ analyzer accepts, some of which may be required.\n* The `output` definition\
        \ specifies how the returned analyzer result is structured.\n"
      operationId: "queryAnalyzers"
      parameters:
      - $ref: "#/components/parameters/PageKey"
      - $ref: "#/components/parameters/PageSize"
      - $ref: "#/components/parameters/Filter"
      - $ref: "#/components/parameters/AddFields"
      responses:
        "200":
          description: "All available analyzer definitions."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerQueryResult"
        "403":
          description: "Insufficient permissions."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "4XX":
          description: "Client error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "5XX":
          description: "Internal server error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
  /analyzers/{analyzer-name}:
    get:
      security:
      - ssoAuth:
        - "davis:analyzers:read"
      - ssoBearerAuth: []
      tags:
      - "Analyzers"
      summary: "Get the analyzer definition for an analyzer."
      description: "**Required scope:** davis:analyzers:read<br/><br/>All available\
        \ meta-information for the analyzer is returned.\n"
      operationId: "getAnalyzer"
      parameters:
      - $ref: "#/components/parameters/AnalyzerName"
      responses:
        "200":
          description: "The definition of the requested analyzer."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerDefinitionDetails"
        "400":
          description: "Invalid or malformed request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "403":
          description: "Insufficient permissions."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "404":
          description: "No analyzer available with the requested name."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "4XX":
          description: "Client error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "5XX":
          description: "Internal server error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
  /analyzers/{analyzer-name}/documentation:
    get:
      security:
      - ssoAuth:
        - "davis:analyzers:read"
      - ssoBearerAuth: []
      tags:
      - "Analyzers"
      summary: "Get the documentation for an analyzer."
      description: "**Required scope:** davis:analyzers:read<br/><br/>A documentation\
        \ may provide further information and context for a given analyzer.\nNot all\
        \ analyzers provide documentation.\n\nThe documentation is returned as Markdown.\n"
      operationId: "getAnalyzerDocumentation"
      parameters:
      - $ref: "#/components/parameters/AnalyzerName"
      responses:
        "200":
          description: "The documentation of the requested analyzer."
          content:
            text/markdown; charset=utf-8:
              schema:
                type: "string"
                format: "binary"
        "403":
          description: "Insufficient permissions."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "400":
          description: "Invalid or malformed request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "404":
          description: "No analyzer available with the requested name."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "4XX":
          description: "Client error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "5XX":
          description: "Internal server error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
  /analyzers/{analyzer-name}/json-schema/input:
    get:
      security:
      - ssoAuth:
        - "davis:analyzers:read"
      - ssoBearerAuth: []
      tags:
      - "Analyzers"
      summary: "Get the JSON schema for an analyzer input."
      description: "**Required scope:** davis:analyzers:read<br/><br/>The [JSON schema](https://json-schema.org/)\
        \ defines a standardized declaration of the input structure,\nproviding well-defined\
        \ input documentation that is both human- and machine-readable.\n"
      operationId: "getJsonSchemaForInput"
      parameters:
      - $ref: "#/components/parameters/AnalyzerName"
      - $ref: "#/components/parameters/JsonSchemaConfig"
      responses:
        "200":
          description: "The [JSON input schema](https://json-schema.org/) of the requested\
            \ analyzer."
          content:
            application/schema+json:
              schema:
                type: "object"
              examples:
                GenericForecastAnalyzer:
                  $ref: "#/components/examples/GenericForecastAnalyzerInputSchema"
        "400":
          description: "Invalid or malformed request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "403":
          description: "Insufficient permissions."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "404":
          description: "No analyzer available with the requested name."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "4XX":
          description: "Client error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "5XX":
          description: "Internal server error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
  /analyzers/{analyzer-name}/json-schema/result:
    get:
      security:
      - ssoAuth:
        - "davis:analyzers:read"
      - ssoBearerAuth: []
      tags:
      - "Analyzers"
      summary: "Get the JSON schema for an analyzer result."
      description: "**Required scope:** davis:analyzers:read<br/><br/>The [JSON schema](https://json-schema.org/)\
        \ defines a standardized declaration of the output structure,\nproviding well-defined\
        \ output documentation that is both human- and machine-readable.\n"
      operationId: "getJsonSchemaForResult"
      parameters:
      - $ref: "#/components/parameters/AnalyzerName"
      - $ref: "#/components/parameters/JsonSchemaConfig"
      responses:
        "200":
          description: "The [JSON result schema](https://json-schema.org/) of the\
            \ requested analyzer."
          content:
            application/schema+json:
              schema:
                type: "object"
              examples:
                GenericForecastAnalyzer:
                  $ref: "#/components/examples/GenericForecastAnalyzerResultSchema"
        "400":
          description: "Invalid or malformed request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "403":
          description: "Insufficient permissions."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "404":
          description: "No analyzer available with the requested name."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "4XX":
          description: "Client error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "5XX":
          description: "Internal server error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
  /analyzers/{analyzer-name}:execute:
    post:
      security:
      - ssoAuth:
        - "davis:analyzers:execute"
      - ssoBearerAuth: []
      tags:
      - "Analyzers"
      summary: "Execute an analyzer with the given input."
      description: "**Required scope:** davis:analyzers:execute<br/><br/>The analyzer\
        \ execution is started asynchronously.\nIf the result is not available after\
        \ the specified timeout, a request token is returned\nto poll for the result.\
        \ Otherwise, the final result is directly available and no request token is\
        \ returned.\n\nDepending on the chosen analyzer and the analyzer input, additional\
        \ scopes might be required, e.g.\n`storage:buckets:read` and `storage:metrics:read`\
        \ to enable the analyzer to read time series data from Grail™.\n"
      operationId: "executeAnalyzer"
      parameters:
      - $ref: "#/components/parameters/AnalyzerName"
      - $ref: "#/components/parameters/TimeoutSeconds"
      - $ref: "#/components/parameters/EnablePreview"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzerInput"
            examples:
              GenericForecastAnalyzer:
                value:
                  timeSeriesData:
                    expression: "timeseries avg(dt.host.cpu.usage)"
                  forecastHorizon: 10
        required: true
      responses:
        "200":
          description: "The final analyzer result and execution status."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerExecuteResult"
              examples:
                GenericForecastAnalyzer:
                  $ref: "#/components/examples/GenericForecastAnalyzerFullResponse"
        "202":
          description: "The current analyzer execution status and a request token\
            \ and time-to-live (TTL) to continue polling the result with."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerExecuteResult"
              examples:
                GenericForecastAnalyzer:
                  $ref: "#/components/examples/GenericForecastAnalyzerStillRunningResponse"
        "400":
          description: "Invalid or malformed request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "403":
          description: "Insufficient permissions."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "404":
          description: "No analyzer available with the requested name."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "4XX":
          description: "Client error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "5XX":
          description: "Internal server error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
  /analyzers/{analyzer-name}:poll:
    get:
      security:
      - ssoAuth:
        - "davis:analyzers:execute"
      - ssoBearerAuth: []
      tags:
      - "Analyzers"
      summary: "Poll for the result of a started analyzer execution."
      description: "**Required scope:** davis:analyzers:execute<br/><br/>Use the request\
        \ token returned when starting an analyzer execution to poll for a result.\n\
        \nThe `executionStatus` of the result indicates if the analyzer execution\
        \ is already completed.\nWhile the status is `RUNNING`, wait and poll for\
        \ the result again in subsequent calls.\n"
      operationId: "pollAnalyzerExecution"
      parameters:
      - $ref: "#/components/parameters/AnalyzerName"
      - $ref: "#/components/parameters/RequestToken"
      - $ref: "#/components/parameters/TimeoutSeconds"
      responses:
        "200":
          description: "The current analyzer execution status and an optional partial\
            \ result."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerPollResult"
              examples:
                GenericForecastAnalyzer (completed):
                  $ref: "#/components/examples/GenericForecastAnalyzerFullResponse"
                GenericForecastAnalyzer (running):
                  $ref: "#/components/examples/GenericForecastAnalyzerStillRunningResponse"
        "400":
          description: "Invalid or malformed request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "403":
          description: "Insufficient permissions."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "404":
          description: "No analyzer available with the requested name."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "410":
          description: "The analyzer result with the request token has already been\
            \ consumed or its time-to-live (TTL) has been reached. The result is not\
            \ available anymore."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "4XX":
          description: "Client error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "5XX":
          description: "Internal server error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
  /analyzers/{analyzer-name}:cancel:
    post:
      security:
      - ssoAuth:
        - "davis:analyzers:execute"
      - ssoBearerAuth: []
      tags:
      - "Analyzers"
      summary: "Stop a started analyzer execution."
      description: "**Required scope:** davis:analyzers:execute<br/><br/>Use the request\
        \ token that was returned when starting an analyzer execution to cancel it.\n"
      operationId: "cancelAnalyzerExecution"
      parameters:
      - $ref: "#/components/parameters/AnalyzerName"
      - $ref: "#/components/parameters/RequestToken"
      responses:
        "200":
          description: "The current analyzer execution status and an optional partial\
            \ result."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerCancelResult"
              examples:
                GenericForecastAnalyzer (completed):
                  $ref: "#/components/examples/GenericForecastAnalyzerFullResponse"
                GenericForecastAnalyzer (running):
                  $ref: "#/components/examples/GenericForecastAnalyzerStillRunningResponse"
        "202":
          description: "The cancel request was accepted and is being processed."
        "400":
          description: "Invalid or malformed request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "403":
          description: "Insufficient permissions."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "404":
          description: "No analyzer available with the requested name."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "410":
          description: "The analyzer result with the request token has already been\
            \ consumed or its time-to-live (TTL) has been reached. The result is not\
            \ available anymore."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "4XX":
          description: "Client error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "5XX":
          description: "Internal server error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
  /analyzers/{analyzer-name}:validate:
    post:
      security:
      - ssoAuth:
        - "davis:analyzers:execute"
      - ssoBearerAuth: []
      tags:
      - "Analyzers"
      summary: "Validate the provided input for an analyzer execution."
      description: "**Required scope:** davis:analyzers:execute<br/><br/>Provide the\
        \ same input that is planned to be used for an analyzer execution to have\
        \ it validated without\nexecuting the analyzer.\n"
      operationId: "validateAnalyzerExecution"
      parameters:
      - $ref: "#/components/parameters/AnalyzerName"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzerInput"
        required: true
      responses:
        "200":
          description: "The validation result for the requested analyzer execution."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerValidationResult"
        "400":
          description: "No analyzer available with the requested name."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "403":
          description: "Insufficient permissions."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "404":
          description: "Not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "4XX":
          description: "Client error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
        "5XX":
          description: "Internal server error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerErrorEnvelope"
components:
  parameters:
    PageKey:
      name: "page-key"
      in: "query"
      required: false
      description: "The cursor for the page of results. Find it in the `nextPageKey`\
        \ field of the previous response.\n\nIf the `page-key` parameter is used,\
        \ no other query parameters must be provided.\n\nIf not provided, the first\
        \ page is always returned.\n"
      schema:
        type: "string"
    PageSize:
      name: "page-size"
      in: "query"
      required: false
      description: "The amount of returned analyzer definitions in a single response\
        \ payload.\nBy default, 50 is used. The maximum is 200.\n"
      schema:
        type: "integer"
        format: "int64"
        minimum: 1
        maximum: 200
      example: 50
    Filter:
      name: "filter"
      in: "query"
      required: false
      description: "Use the `filter` parameter to only fetch a subset of analyzer\
        \ definitions.\n\nWhen using the operators `=`and `!=`, filtering is **case\
        \ sensitive**.\n\nThe following operators are supported:\n* `=`\n* `!=`\n\
        * `contains`\n* `starts-with`\n* `ends-with`\n* `and`\n* `or`\n\nParenthesis\
        \ and the `not` operator are currently not supported.\n\nThe following fields\
        \ are valid filtering parameters:\n* `baseAnalyzer`\n* `description`\n* `displayName`\n\
        * `labels`\n* `name`\n* `type`\n\nAny other field will result in a HTTP 400\
        \ response.\n"
      schema:
        type: "string"
        minimum: 1
      example: "name contains 'statistic'"
    AddFields:
      name: "add-fields"
      in: "query"
      required: false
      description: "Specify which meta-information to fetch in addition to the default\
        \ fields `name`, `displayName` and `description`.\n\nValid values are:\n*\
        \ `analyzerCall`\n* `baseAnalyzer`\n* `category`\n* `input`\n* `labels`\n\
        * `output`\n* `type`\n\nAny other field will result in a HTTP 400 response.\n"
      schema:
        type: "string"
        minimum: 1
      example: "baseAnalyzer, type, input"
    AnalyzerName:
      name: "analyzer-name"
      in: "path"
      description: "The name of the analyzer."
      required: true
      schema:
        type: "string"
      examples:
        GenericForecastAnalyzer:
          value: "dt.statistics.GenericForecastAnalyzer"
    JsonSchemaConfig:
      name: "config"
      in: "query"
      description: "The configuration for the JSON schema generation."
      required: false
      schema:
        $ref: "#/components/schemas/JsonSchemaConfig"
    TimeoutSeconds:
      name: "timeout-seconds"
      in: "query"
      description: "The amount of seconds to wait for the response to be returned.\n\
        \nThe timeout controls how long the client is willing to wait, while the analyzer\
        \ execution continues\nrunning until it has finished or is cancelled.\n"
      required: false
      schema:
        type: "integer"
        default: 2
        maximum: 300
    EnablePreview:
      name: "enable-preview"
      in: "query"
      description: "Indicates if analyzer results should preview already created outputs\n\
        while the analyzer is still running.\n\nSet to false if only the final result\
        \ is needed.\n"
      required: false
      schema:
        type: "boolean"
        default: true
    RequestToken:
      name: "request-token"
      in: "query"
      description: "The request token is returned when starting a long-running analyzer\
        \ execution.\nIt can be used to do follow-up operations like polling and cancelling.\n"
      required: true
      schema:
        type: "string"
      example: "RHluYXRyYWNlMjAyMw=="
  securitySchemes:
    ssoAuth:
      type: "oauth2"
      description: "This API uses OAuth 2.0 with the client credentials flow."
      flows:
        clientCredentials:
          tokenUrl: "https://sso-sprint.dynatracelabs.com/sso/oauth2/token"
          scopes:
            davis:analyzers:read: "View analyzer definitions"
            davis:analyzers:execute: "Execute analyzers"
    ssoBearerAuth:
      type: "http"
      scheme: "bearer"
      description: "The value can be either an OAuth2 access token or a platform token.</br>\
        \ For further information about platform tokens see <a href=\"https://dt-url.net/platform-tokens\"\
        \ target=\"_blank\">Platform tokens - Dynatrace Docs</a>."
  schemas:
    AnalyzerGeneralParameters:
      type: "object"
      description: "Parameters that are present in all analyzer input parameter definitions."
      properties:
        timeframe:
          $ref: "#/components/schemas/Timeframe"
        resolveDimensionalQueryData:
          type: "boolean"
          default: false
        logVerbosity:
          allOf:
          - $ref: "#/components/schemas/AnalyzerExecutionLogLevel"
          default: "WARNING"
    AnalyzerError:
      type: "object"
      description: "The error that is returned for unsuccessful responses."
      properties:
        code:
          type: "integer"
          description: "The HTTP status code of the error."
          format: "int32"
          example: 400
        message:
          type: "string"
        details:
          $ref: "#/components/schemas/AnalyzerErrorDetails"
      required:
      - "code"
      - "message"
    AnalyzerErrorEnvelope:
      type: "object"
      properties:
        error:
          $ref: "#/components/schemas/AnalyzerError"
    AnalyzerErrorDetails:
      type: "object"
      properties:
        constraintViolations:
          type: "array"
          items:
            $ref: "#/components/schemas/ConstraintViolation"
    ConstraintViolation:
      type: "object"
      description: "A constraint violation indicating why an error has occurred."
      allOf:
      - $ref: "#/components/schemas/AnalyzerExecutionLog"
    AnalyzerValidationResult:
      type: "object"
      description: "The result of the dry-execution of the analyzer."
      properties:
        valid:
          description: "Whether the analyzer can be successfully executed with the\
            \ given input data."
          type: "boolean"
        details:
          $ref: "#/components/schemas/AnalyzerErrorDetails"
      required:
      - "valid"
    AnalyzerData:
      type: "object"
      description: "The map of actual data matching the input and output definition\
        \ of the analyzer."
      additionalProperties: true
      example:
        $ref: "#/components/examples/AnalyzerData"
    Timeframe:
      type: "object"
      properties:
        startTime:
          type: "string"
          description: "Specify the start time in either absolute or relative format.\n\
            For absolute format, use the ISO 8601 format (yyyy-MM-ddTHH:mm:ssZ).\n\
            For relative format, use 'now' for the current time or apply an offset\
            \ with the available units: 's' for seconds, 'm' for minutes, 'h' for\
            \ hours, and 'd' for days.\nFor example, use 'now-2h' or '-2h' for a relative\
            \ offset of 2 hours.\n"
          example: "2023-04-10T12:10:04.123Z"
        endTime:
          type: "string"
          description: "Specify the end time in either absolute or relative format.\n\
            For absolute format, use the ISO 8601 format (yyyy-MM-ddTHH:mm:ssZ).\n\
            For relative format, use 'now' for the current time or apply an offset\
            \ with the available units: 's' for seconds, 'm' for minutes, 'h' for\
            \ hours, and 'd' for days.\nFor example, use 'now-2h' or '-2h' for a relative\
            \ offset of 2 hours. If not specified, defaults to now.\n"
          example: "2023-04-12T12:10:04.123Z"
      required:
      - "startTime"
    DimensionQuery:
      description: "A query for dimensional data such as timeseries, entities, or\
        \ logs."
      oneOf:
      - type: "string"
        example: "timeseries avg(dt.host.cpu.usage)"
      - type: "object"
