        localLocationOutageCountThreshold: "3"
        localOutages: "true"
      properties:
        globalConsecutiveOutageCountThreshold:
          type: "integer"
          format: "int32"
          description: "Number of consecutive failures for all locations."
        globalOutages:
          type: "boolean"
          description: "Generate a problem and send an alert when the monitor is unavailable\
            \ at all configured locations."
        localConsecutiveOutageCountThreshold:
          type: "integer"
          format: "int32"
          description: "Number of consecutive failures."
        localLocationOutageCountThreshold:
          type: "integer"
          format: "int32"
          description: "Number of failing locations."
        localOutages:
          type: "boolean"
          description: "Generate a problem and send an alert when the monitor is unavailable\
            \ for one or more consecutive runs at any location."
