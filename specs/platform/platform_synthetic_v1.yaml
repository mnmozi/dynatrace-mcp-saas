          type: "boolean"
          description: "Only Browser Monitor property. If set to true, execution retry\
            \ will take place in case the monitor fails."
      required:
      - "globalOutages"
      - "localOutages"
    SyntheticMonitorPerformanceThresholdDto:
      type: "object"
      description: "The performance threshold rule."
      properties:
        aggregation:
          type: "string"
          default: "AVG"
          description: "Aggregation type"
          enum:
          - "AVG"
          - "MAX"
          - "MIN"
        dealertingSamples:
          type: "integer"
          format: "int32"
          description: "Number of most recent non-violating request executions that\
            \ closes the problem."
          minimum: 1
        samples:
          type: "integer"
          format: "int32"
          description: "Number of request executions in analyzed sliding window (sliding\
            \ window size)."
          minimum: 1
        stepIndex:
          type: "integer"
          format: "int32"
          description: "Specify the step's index to which a threshold applies. If\
            \ threshold is monitor-level, no index is needed."
          minimum: 0
        threshold:
          type: "number"
          format: "double"
          description: "Notify if monitor request takes longer than *X* time units\
            \ to execute. For network availability monitors the time unit is milliseconds,\
            \ for browser and HTTP monitors - seconds."
          exclusiveMinimum: true
          minimum: 0.0
        type:
          type: "string"
          description: "Type of performance threshold"
          enum:
          - "STEP"
          - "MONITOR"
        violatingSamples:
          type: "integer"
          format: "int32"
          description: "Number of violating request executions in analyzed sliding\
            \ window."
          minimum: 1
      required:
      - "threshold"
