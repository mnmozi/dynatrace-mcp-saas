      properties:
        city:
          type: "string"
          description: "The city of the location."
        countryCode:
          type: "string"
          description: "The country code of the location. \n\n To fetch the list of\
            \ available country codes, use the [GET all countries](https://dt-url.net/37030go)\
            \ request."
