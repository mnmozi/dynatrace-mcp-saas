        type:
          type: "string"
          description: "Constraint type. Allowed values depend on monitor type and\
            \ step/request context. HTTP monitor step constraints: HTTP_STATUSES,\
            \ HTTP_RESPONSE_PATTERN, HTTP_RESPONSE_REGEX. Network availability monitor(MULTI_PROTOCOL)\
            \ step constraints: SUCCESS_RATE_PERCENT. Network availability monitor(MULTI_PROTOCOL)\
            \ request configuration constraints are request-type specific, for example\
            \ ICMP_SUCCESS_RATE_PERCENT (ICMP) and DNS_STATUS_CODE (DNS)."
          example: "ICMP_SUCCESS_RATE_PERCENT"
      required:
      - "properties"
      - "type"
