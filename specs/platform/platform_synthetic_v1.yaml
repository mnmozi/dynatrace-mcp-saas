        locationId:
          type: "string"
          description: "The location identifier."
      required:
      - "cause"
      - "details"
      - "entityId"
      - "executionId"
    SyntheticPrivateLocationUpdate:
      type: "object"
      allOf:
      - $ref: "#/components/schemas/SyntheticLocationUpdate"
      - type: "object"
        properties:
          autoUpdateChromium:
            type: "boolean"
            description: "Non-containerized location property. Auto upgrade of Chromium\
              \ is enabled (`true`) or disabled (`false`)."
          availabilityLocationOutage:
            type: "boolean"
            description: "Alerting for location outage is enabled (`true`) or disabled\
              \ (`false`). Supported only for private Synthetic locations."
          availabilityNodeOutage:
            type: "boolean"
            description: "Alerting for node outage is enabled (`true`) or disabled\
              \ (`false`). \\n\\n If enabled, the outage of *any* node in the location\
              \ triggers an alert. Supported only for private Synthetic locations."
          availabilityNotificationsEnabled:
            type: "boolean"
            description: "Notifications for location and node outage are enabled (`true`)\
              \ or disabled (`false`). Supported only for private Synthetic locations."
          browserExecutionSupported:
            type: "boolean"
            description: "Containerized location property. Boolean value describes\
              \ if browser monitors will be executed on this location:\n\n* `false`:\
              \ Browser monitor executions disabled.\n* `true`: Browser monitor executions\
              \ enabled."
          city:
            type: "string"
            description: "The city of the location."
          countryCode:
            type: "string"
            description: "The country code of the location. \n\n To fetch the list\
              \ of available country codes, use the [GET all countries](https://dt-url.net/37030go)\
              \ request."
          deploymentType:
            type: "string"
            description: "The deployment type of the location: \n\n* `STANDARD`: The\
              \ location is deployed on Windows or Linux.\n* `KUBERNETES`: The location\
              \ is deployed on Kubernetes."
            enum:
            - "KUBERNETES"
            - "OPENSHIFT"
            - "STANDARD"
            - "UNKNOWN"
          fipsMode:
            type: "string"
            description: "Containerized location property indicating whether FIPS\
              \ mode is enabled on this location:\n\n* `DISABLED`: FIPS is not enabled\
              \ on the location.\n* `ENABLED`: FIPS is enabled on the location.\n\
              * `ENABLED_WITH_CORPORATE_PROXY`: FIPS with corporate proxy is enabled\
              \ on this location.\nDefault: DISABLED"
            enum:
            - "DISABLED"
            - "ENABLED"
            - "ENABLED_WITH_CORPORATE_PROXY"
          latitude:
            type: "number"
            format: "double"
            description: "The latitude of the location in `DDD.dddd` format."
          locationNodeOutageDelayInMinutes:
            type: "integer"
            format: "int32"
            description: "Alert if location or node outage lasts longer than *X* minutes.\
              \ \\n\\n Only applicable when `availabilityLocationOutage` or `availabilityNodeOutage`\
              \ is set to `true`. Supported only for private Synthetic locations."
            maximum: 5
            minimum: 1
          longitude:
            type: "number"
            format: "double"
            description: "The longitude of the location in `DDD.dddd` format."
          maxActiveGateCount:
            type: "integer"
            format: "int32"
            description: "Containerized location property. The maximum number of ActiveGates\
              \ deployed for the location (required for a Kubernetes location)."
            maximum: 100
            minimum: 1
          minActiveGateCount:
            type: "integer"
            format: "int32"
            description: "Containerized location property. The minimum number of ActiveGates\
              \ deployed for the location (required for a Kubernetes location)."
            maximum: 100
            minimum: 1
          namExecutionSupported:
            type: "boolean"
            description: "Containerized location property. Boolean value describes\
              \ if icmp monitors will be executed on this location:\n\n* `false`:\
              \ Icmp monitor executions disabled.\n* `true`: Icmp monitor executions\
              \ enabled."
          name:
            type: "string"
            description: "The name of the location."
          nodeSize:
            type: "string"
            description: "Containerized location property. The size of a containerized\
              \ node deployed for the location (required for a Kubernetes location).\
              \ Accepted values: \n\n* `XS`: extra small\n* `S`: small\n* `M`: medium\n\
              The node size `L` is not supported in containerized locations."
            enum:
            - "M"
            - "S"
            - "UNSUPPORTED"
            - "XS"
          nodes:
            type: "array"
            description: "A list of synthetic nodes belonging to the location. \n\n\
              \ You can retrieve the list of available nodes with the [GET all nodes](https://dt-url.net/miy3rpl)\
              \ call."
            items:
              type: "string"
          regionCode:
            type: "string"
            description: "The region code of the location. \n\n To fetch the list\
              \ of available region codes, use the [GET regions of the country](https://dt-url.net/az230x0)\
              \ request."
          status:
            type: "string"
            description: "The status of the location: \n\n* `ENABLED`: The location\
              \ is displayed as active in the UI. You can assign monitors to the location.\
              \ \n* `DISABLED`: The location is displayed as inactive in the UI. You\
              \ can't assign monitors to the location. Monitors already assigned to\
              \ the location will stay there and will be executed from the location.\
              \ \n* `HIDDEN`: The location is not displayed in the UI. You can't assign\
              \ monitors to the location. You can only set location as `HIDDEN` when\
              \ no monitor is assigned to it."
            enum:
            - "DISABLED"
            - "ENABLED"
            - "HIDDEN"
          useNewKubernetesVersion:
            type: "boolean"
            description: "Containerized location property. Boolean value describes\
              \ which kubernetes version will be used:\n\n* `false`: Version 1.23+\
              \ that is older than 1.26\n* `true`: Version 1.26+."
      description: "Configuration of a private synthetic location"
      required:
      - "latitude"
      - "longitude"
      - "name"
      - "type"
    SyntheticPublicLocationUpdate:
      type: "object"
      allOf:
      - $ref: "#/components/schemas/SyntheticLocationUpdate"
      - type: "object"
        properties:
          status:
            type: "string"
            description: "The status of the location: \n\n* `ENABLED`: The location\
              \ is displayed as active in the UI. You can assign monitors to the location.\
              \ \n* `DISABLED`: The location is displayed as inactive in the UI. You\
              \ can't assign monitors to the location. Monitors already assigned to\
              \ the location will stay there and will be executed from the location.\
              \ \n* `HIDDEN`: The location is not displayed in the UI. You can't assign\
              \ monitors to the location. You can only set location as `HIDDEN` when\
              \ no monitor is assigned to it."
            enum:
            - "DISABLED"
            - "ENABLED"
            - "HIDDEN"
      description: "The update of a public Synthetic location."
      required:
      - "status"
      - "type"
    SyntheticPublicLocationsStatus:
      type: "object"
      description: "The status of public synthetic locations."
      properties:
        publicLocationsEnabled:
          type: "boolean"
          description: "Synthetic monitors can (`true`) or can't (`false`) run on\
            \ public synthetic locations."
      required:
      - "publicLocationsEnabled"
    SyntheticTagWithSourceDto:
      type: "object"
      description: "The tag with source of a monitored entity."
      example:
        key: "sample key"
        value: "sample value"
      properties:
        context:
          type: "string"
          description: "The origin of the tag, such as AWS or Cloud Foundry. \n\n\
            Custom tags use the `CONTEXTLESS` value."
        key:
          type: "string"
          description: "The key of the tag."
        source:
          type: "string"
          description: "The source of the tag, such as USER, RULE_BASED or AUTO."
          enum:
          - "AUTO"
          - "RULE_BASED"
          - "USER"
        value:
          type: "string"
          description: "The value of the tag."
      required:
      - "key"
    TargetDto:
      type: "object"
      description: "Target of Browser Monitor step."
      example:
        locators:
        - type: "CSS"
          value: "<img>[id='logoIcon']"
        - type: "CSS"
          value: "<a>[id='externalSite']"
        window: "ruxitWin[0]"
      properties:
        locators:
          type: "array"
          description: "List of locators."
          items:
            $ref: "#/components/schemas/LocatorDto"
        window:
          type: "string"
          description: "Target window."
      required:
      - "locators"
      - "window"
    TestDeviceDto:
      type: "object"
      description: "Test device of a Browser Monitor."
      properties:
        height:
          type: "integer"
          format: "int32"
          description: "Device height in px."
          minimum: 0
        mobile:
          type: "boolean"
          description: "Device is mobile. If not defined in request, it will be set\
            \ to false by default."
        name:
          type: "string"
          description: "Device name."
        touchEnabled:
          type: "boolean"
          description: "Device is touch enabled. If not defined in request, it will\
            \ be set to false by default."
        width:
          type: "integer"
          format: "int32"
          description: "Device width in px."
          minimum: 0
      required:
      - "height"
      - "name"
      - "width"
    TimeWaitConditionDto:
      type: "object"
      allOf:
      - $ref: "#/components/schemas/BaseWaitConditionDto"
      - type: "object"
        properties:
          milliseconds:
            type: "integer"
            format: "int32"
            description: "Wait time in milliseconds."
            minimum: 0
      description: "Time wait condition for Browser Monitor step."
      example:
        milliseconds: 10
        waitFor: "TIME"
      required:
      - "milliseconds"
      - "type"
    TimeoutSettingsDto:
      type: "object"
      description: "Timeout settings of a Browser Monitor."
      properties:
        temporaryActionLimit:
          type: "integer"
          format: "int32"
          description: "Cascading setTimeout calls number limit. If not defined in\
            \ request, it will be set to 1 by default."
        temporaryActionTotalTimeout:
          type: "integer"
          format: "int32"
          description: "No additional timeout actions will be created once this time\
            \ limit is reached. Value must be higher than 0 ms. If not defined in\
            \ request, it will be set to 100 by default."
    ValidationRuleDto:
      type: "object"
      description: "Validation rule of Browser Monitor step."
      example:
        failIfFound: false
        matchingPattern: "some text to match"
        regex: false
        target:
          locators:
          - type: "CSS"
            value: "<img>[id='logoIcon']"
          - type: "CSS"
            value: "<a>[id='externalSite']"
          window: "ruxitWin[0]"
        type: "TEXT_MATCH"
      properties:
        failIfFound:
          type: "boolean"
          description: "Boolean value, true if we should fail on found pattern. If\
            \ not defined in request, it will be set to false by default."
        matchingPattern:
          type: "string"
          description: "Text pattern that should match on the website."
        regex:
          type: "boolean"
          description: "Boolean value, true if the \"matchingPattern\" value is a\
            \ regex. If not defined in request, it will be set to false by default."
        target:
          $ref: "#/components/schemas/TargetDto"
        type:
          type: "string"
          description: "Type of validation."
          enum:
          - "TEXT_MATCH"
          - "CONTENT_MATCH"
          - "ELEMENT_MATCH"
      required:
      - "failIfFound"
      - "matchingPattern"
      - "type"
    ValidationWaitConditionDto:
      type: "object"
      allOf:
      - $ref: "#/components/schemas/BaseWaitConditionDto"
      - type: "object"
        properties:
          timeoutInMilliseconds:
            type: "integer"
            format: "int32"
            description: "Validation timeout in milliseconds."
            minimum: 0
          validationRule:
            $ref: "#/components/schemas/ValidationRuleDto"
      description: "Validation wait condition for Browser Monitor step."
      example:
        timeoutInMilliseconds: 10
        validation:
          failIfFound: false
          match: "some text to match"
          regex: false
          target:
            locators:
            - type: "CSS"
              value: "<img>[id='logoIcon']"
            - type: "CSS"
              value: "<a>[id='externalSite']"
            window: "ruxitWin[0]"
          type: "TEXT_MATCH"
        waitFor: "TIME"
      required:
      - "timeoutInMilliseconds"
      - "type"
      - "validationRule"
    VisuallyCompleteOptionsDto:
      type: "object"
      description: "Visually Complete Options of a Browser Monitor."
      properties:
        excludedElements:
          type: "array"
          description: "Query CSS selectors to specify mutation nodes (elements that\
            \ change) to ignore in Visually complete and Speed index calculation. "
          items:
            type: "string"
            description: "Query CSS selectors to specify mutation nodes (elements\
              \ that change) to ignore in Visually complete and Speed index calculation. "
        excludedUrls:
          type: "array"
          description: "Use regular expressions to define URLs for images and iFrames\
            \ to exclude from detection by the Visually complete module. "
          items:
            type: "string"
            description: "Use regular expressions to define URLs for images and iFrames\
              \ to exclude from detection by the Visually complete module. "
        imageSizeThreshold:
          type: "integer"
          format: "int32"
          description: "Use this setting to define the minimum visible area per element\
            \ (in pixels) for an element to be counted towards Visually complete and\
            \ Speed index. If not defined in request, it will be set to 50 by default."
        inactivityTimeout:
          type: "integer"
          format: "int32"
          description: "The time the Visually complete module waits for inactivity\
            \ and no further mutations on the page after the load action. If not defined\
            \ in request, it will be set to 1000 by default."
        mutationTimeout:
          type: "integer"
          format: "int32"
          description: "The time the Visually complete module waits after an XHR or\
            \ custom action closes to start the calculation. If not defined in request,\
            \ it will be set to 50 by default."
  securitySchemes:
    ssoAuth:
      description: "Dynatrace OAuth\n\n A Bearer token is passed in the **Authorization**\
        \ header in the following format: `Authorization: Bearer abcdefjhij1234567890`."
      flows:
        clientCredentials:
          scopes:
            synthetic:environment-configuration:read: "Defines access boundaries to\
              \ read set of synthetic related parameters defined for whole tenant"
            synthetic:environment-configuration:write: "Defines access boundaries\
              \ to update set of synthetic related parameters defined for whole tenant"
            synthetic:locations:read: "Defines access boundaries for reading synthetic\
              \ locations"
            synthetic:locations:write: "Defines access boundaries for creating locations"
            synthetic:monitors:execute: "Defines access boundaries for scheduling\
              \ on-demand executions"
            synthetic:monitors:read: "Defines access boundaries for reading synthetic\
              \ monitor definitions"
            synthetic:monitors:write: "Defines access boundaries for creating synthetic\
              \ monitors"
          tokenUrl: "https://sso-sprint.dynatracelabs.com/sso/oauth2/token"
      type: "oauth2"
    ssoBearerAuth:
      type: "http"
      scheme: "bearer"
      description: "The value can be either an OAuth2 access token or a platform token.</br>\
        \ For further information about platform tokens see <a href=\"https://dt-url.net/platform-tokens\"\
        \ target=\"_blank\">Platform tokens - Dynatrace Docs</a>."
