    UiTableColumnItemCustomization:
      type: "object"
      description: "Customization for UI table column items"
      properties:
        displayName:
          type: "string"
          description: "The display name of this item."
          example: "Active"
        icon:
          type: "string"
          description: "The icon of this item."
          example: "CRITICAL"
        value:
          type: "string"
          description: "The value of this item."
          example: "ACTIVE"
      required:
      - "value"
    UiTableCustomization:
      type: "object"
      description: "Customization for UI tables"
      properties:
        columns:
          type: "array"
          description: "A list of columns for the UI table"
          items:
            $ref: "#/components/schemas/UiTableColumnCustomization"
        emptyState:
          $ref: "#/components/schemas/UiEmptyStateCustomization"
    UiTabsCustomization:
      type: "object"
      description: "UI customization for tabs"
      properties:
        groups:
          type: "array"
          description: "A list of groups"
          items:
            $ref: "#/components/schemas/UiTabGroupCustomization"
    UploadResponseAssetInfo:
      type: "object"
      description: "Information about extension assets included"
      properties:
        assetType:
          type: "string"
        count:
          type: "integer"
          format: "int32"
  securitySchemes:
    ssoAuth:
      description: "Dynatrace OAuth\n\n A Bearer token is passed in the **Authorization**\
        \ header in the following format: `Authorization: Bearer abcdefjhij1234567890`."
      flows:
        clientCredentials:
          scopes:
            extensions:configuration.actions:write: "Actions for extension monitoring\
              \ configuration"
            extensions:configurations:read: "Read extension monitoring configurations"
            extensions:configurations:write: "Write extension monitoring configurations"
            extensions:definitions:read: "Read extensions definition"
            extensions:definitions:write: "Write extensions definition"
            extensions:discovery.jmx:read: "Read discovered JMX metrics via extensions"
            extensions:discovery.pmi:read: "Read discovered PMI metrics via extensions"
          tokenUrl: "https://sso-sprint.dynatracelabs.com/sso/oauth2/token"
      type: "oauth2"
    ssoBearerAuth:
      type: "http"
      scheme: "bearer"
      description: "The value can be either an OAuth2 access token or a platform token.</br>\
        \ For further information about platform tokens see <a href=\"https://dt-url.net/platform-tokens\"\
        \ target=\"_blank\">Platform tokens - Dynatrace Docs</a>."
tags:
- name: "Discovery"
- name: "Extensions"
- name: "Schemas"
