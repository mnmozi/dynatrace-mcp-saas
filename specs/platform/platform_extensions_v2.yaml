openapi: "3.0.1"
info:
  description: "Documentation of Extensions 2.0 API."
  title: "Extensions 2.0"
  version: "2.0.0"
servers:
- url: "https://asn8731h.sprint.apps.dynatracelabs.com/platform/extensions/v2"
  x-api-gateway-url: "/platform/extensions/v2"
paths:
  /discovery/jmx/processes:
    get:
      operationId: "listJmxProcesses"
      parameters:
      - description: "The filter parameter, as explained [here](https://dt-url.net/platform-services-filtering).\n\
          \nFiltering is supported on the following field:\n* `hostId` - the ID of\
          \ the host the process is running on, in the form `HOST-XXXXXXXXXXXXXXXX`.\n\
          \nIf the parameter is omitted, all processes are returned.\n\nExample: `hostId\
          \ = 'HOST-1234ABCD5678EFAB'`\n"
        in: "query"
        name: "filter"
        schema:
          type: "string"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JavaProcessContainerList"
          description: "Success."
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Client error."
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Server error."
      security:
      - ssoAuth:
        - "extensions:discovery.jmx:read"
      - ssoBearerAuth: []
      summary: "Lists all Java processes discovered in the environment that are available\
        \ for JMX metric collection. | maturity=EARLY_ADOPTER"
      tags:
      - "Discovery"
      x-maturity: "EARLY_ADOPTER"
      description: "**Required scope:** extensions:discovery.jmx:read"
  /discovery/jmx/processes/{process-id}:
    get:
      operationId: "getJmxProcess"
      parameters:
      - description: "Id of the Java process discovered in the environment for JMX\
          \ metric collection."
        in: "path"
        name: "process-id"
        required: true
        schema:
          type: "string"
      - description: "The filter parameter, as explained [here](https://dt-url.net/platform-services-filtering).\n\
          \nFiltering is supported on the following field:\n* `hostId` - the ID of\
          \ the host the process is running on, in the form `HOST-XXXXXXXXXXXXXXXX`.\n\
          \nIf the parameter is omitted, all processes are returned.\n\nExample: `hostId\
          \ = 'HOST-1234ABCD5678EFAB'`\n"
        in: "query"
        name: "filter"
        schema:
          type: "string"
      responses:
        "200":
          content:
            application/json:
              example:
                jdk.management:
                  com.sun.management.internal.VirtualThreadSchedulerImpls$VirtualThreadSchedulerImpl:
                  - properties:
                      type: "VirtualThreadScheduler"
                    metrics:
                    - name: "Parallelism"
                      numeric: true
                    - name: "PoolSize"
                      numeric: true
                    - name: "MountedVirtualThreadCount"
                      numeric: true
                    - name: "QueuedVirtualThreadCount"
                      numeric: true
                    - name: "ObjectName"
                      numeric: false
                    fullPath: "jdk.management:type=VirtualThreadScheduler"
                java.util.logging:
                  sun.management.ManagementFactoryHelper$PlatformLoggingImpl:
                  - properties:
                      type: "Logging"
                    metrics:
                    - name: "ObjectName"
                      numeric: false
                    fullPath: "java.util.logging:type=Logging"
              schema:
                $ref: "#/components/schemas/JavaProcessDetails"
          description: "Success."
        "404":
          content:
            application/json:
              example:
                error:
                  code: 404
                  message: "Agent returned error code: JMX_NOT_YET_READY"
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Failed. Agent data isn't yet available. Try again in a few\
            \ seconds."
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Client error."
        "504":
          content:
            application/json:
              example:
                error:
                  code: 504
                  message: "JMX Metric Browsing request timed out after N ms"
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Failed. Agent communication timeout."
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Server error."
      security:
      - ssoAuth:
        - "extensions:discovery.jmx:read"
      - ssoBearerAuth: []
      summary: "Retrieves details of a specified Java process discovered in the environment\
        \ for JMX metric collection. | maturity=EARLY_ADOPTER"
      tags:
      - "Discovery"
      x-maturity: "EARLY_ADOPTER"
      description: "**Required scope:** extensions:discovery.jmx:read"
  /discovery/pmi/processes:
    get:
      operationId: "listPmiProcesses"
      parameters:
      - description: "The filter parameter, as explained [here](https://dt-url.net/platform-services-filtering).\n\
          \nFiltering is supported on the following field:\n* `hostId` - the ID of\
          \ the host the process is running on, in the form `HOST-XXXXXXXXXXXXXXXX`.\n\
          \nIf the parameter is omitted, all processes are returned.\n\nExample: `hostId\
          \ = 'HOST-1234ABCD5678EFAB'`\n"
        in: "query"
        name: "filter"
        schema:
          type: "string"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JavaProcessContainerList"
          description: "Success."
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Client error."
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Server error."
      security:
      - ssoAuth:
        - "extensions:discovery.pmi:read"
      - ssoBearerAuth: []
      summary: "Lists all Java processes discovered in the environment that are available\
        \ for PMI metric collection. | maturity=EARLY_ADOPTER"
      tags:
      - "Discovery"
      x-maturity: "EARLY_ADOPTER"
      description: "**Required scope:** extensions:discovery.pmi:read"
  /discovery/pmi/processes/{process-id}:
    get:
      operationId: "getPmiProcess"
      parameters:
      - description: "Id of the Java process discovered in the environment for PMI\
          \ metric collection."
        in: "path"
        name: "process-id"
        required: true
        schema:
          type: "string"
      - description: "The filter parameter, as explained [here](https://dt-url.net/platform-services-filtering).\n\
          \nFiltering is supported on the following field:\n* `hostId` - the ID of\
          \ the host the process is running on, in the form `HOST-XXXXXXXXXXXXXXXX`.\n\
          \nIf the parameter is omitted, all processes are returned.\n\nExample: `hostId\
          \ = 'HOST-1234ABCD5678EFAB'`\n"
        in: "query"
        name: "filter"
        schema:
          type: "string"
      responses:
        "200":
          content:
            application/json:
              example:
                WebSphere:
                  statistics:
                  - name: "requestCount"
                    type: "CountStatistic"
                  - name: "responseTime"
                    type: "TimeStatistic"
                  modules:
                  - "server1/applications/MyApp"
                  - "server1/applications/OtherApp"
              schema:
                $ref: "#/components/schemas/PmiProcessDetails"
          description: "Success."
        "404":
          content:
            application/json:
              example:
                error:
                  code: 404
                  message: "Pmi process information is not yet available from agent:\
                    \ 12345678901234567"
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Failed. Agent data isn't yet available. Try again in a few\
            \ seconds."
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Client error."
        "504":
          content:
            application/json:
              example:
                error:
                  code: 504
                  message: "PMI Metric Browsing request timed out after N ms"
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Failed. Agent communication timeout."
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Server error."
      security:
      - ssoAuth:
        - "extensions:discovery.pmi:read"
      - ssoBearerAuth: []
      summary: "Retrieves details of a specified Java process discovered in the environment\
        \ for PMI metric collection. | maturity=EARLY_ADOPTER"
      tags:
      - "Discovery"
      x-maturity: "EARLY_ADOPTER"
      description: "**Required scope:** extensions:discovery.pmi:read"
  /extensions:
    get:
      operationId: "listExtensions"
      parameters:
      - description: "The amount of extensions in a single response payload. \n\n\
          The maximal allowed page size is 100. \n\nIf not set, 20 is used."
        in: "query"
        name: "page-size"
        schema:
          type: "integer"
          format: "int64"
      - description: "The cursor for the next page of results. You can find it in\
          \ the **next-page-key** field of the previous response. \n\nThe first page\
          \ is always returned if you don't specify the **page-key** query parameter.\
          \ \n\nWhen the **page-key** is set to obtain subsequent pages, you must\
          \ omit all other query parameters. "
        in: "query"
        name: "page-key"
        schema:
          type: "string"
      - description: "The filter parameter, as explained [here](https://dt-url.net/platform-services-filtering).\n\
          \nFiltering is supported on the following fields:\n* `name`\n* `markedForDeletion`\n\
          \nThis filter supports all type operators as well as logical operators 'AND'\
          \ and 'OR'.\n'NOT' operator and parentheses aren't supported.\n"
        in: "query"
        name: "filter"
        schema:
          type: "string"
      - description: "Comma separated list of additional fields to include in the\
          \ response.\nAvailable fields:\n* `activeVersion` - includes the active\
          \ version of the Extension 2.0 in the environment.\n* `keywords` - includes\
          \ the keywords of the Extension 2.0.\n* `markedForDeletion` - includes the\
          \ markedForDeletion flag of the Extension 2.0 in the environment, which\
          \ indicates that the extension is being deleted and cannot be updated or\
          \ installed until the deletion process is completed.\n"
        in: "query"
        name: "add-fields"
        schema:
          type: "string"
          example: "keywords,activeVersion,markedForDeletion"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionInfoList"
          description: "Success."
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Client error."
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Server error."
      security:
      - ssoAuth:
        - "extensions:definitions:read"
      - ssoBearerAuth: []
      summary: "Lists all Extensions 2.0 available in the environment."
      tags:
      - "Extensions"
      description: "**Required scope:** extensions:definitions:read"
    post:
      operationId: "uploadExtension"
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: "string"
              format: "binary"
        description: "Extension 2.0 zip file to upload."
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionUploadResponse"
          description: "Success. Extension 2.0 has been uploaded."
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Failed. The input file is invalid."
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Upload isn't possible yet. Try again in a few seconds."
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Client error."
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Server error."
      security:
      - ssoAuth:
        - "extensions:definitions:write"
      - ssoBearerAuth: []
      summary: "Uploads a new Extension 2.0."
      tags:
      - "Extensions"
      description: "**Required scope:** extensions:definitions:write"
  /extensions/{extension-name}:
    get:
      operationId: "listExtensionVersions"
      parameters:
      - description: "The amount of extensions in a single response payload. \n\n\
          The maximal allowed page size is 100. \n\nIf not set, 20 is used."
        in: "query"
        name: "page-size"
        schema:
          type: "integer"
          format: "int64"
      - description: "The cursor for the next page of results. You can find it in\
          \ the **next-page-key** field of the previous response. \n\nThe first page\
          \ is always returned if you don't specify the **page-key** query parameter.\
          \ \n\nWhen the **page-key** is set to obtain subsequent pages, you must\
          \ omit all other query parameters. "
        in: "query"
        name: "page-key"
        schema:
          type: "string"
      - description: "The name of the requested Extension 2.0."
        in: "path"
        name: "extension-name"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionList"
          description: "Success."
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Client error."
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Server error."
      security:
      - ssoAuth:
        - "extensions:definitions:read"
      - ssoBearerAuth: []
      summary: "Lists all versions of an Extension 2.0."
      tags:
      - "Extensions"
      description: "**Required scope:** extensions:definitions:read"
    post:
      operationId: "installExtension"
      parameters:
      - description: "The name of the requested Extension 2.0."
        in: "path"
        name: "extension-name"
        required: true
        schema:
          type: "string"
      - description: "The version of Extension 2.0 to install. If not specified, the\
          \ recommended version from the Dynatrace Hub shall be installed."
        in: "query"
        name: "version"
        schema:
          type: "string"
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredExtensionResult"
          description: "Accepted. The extension version is installed and active. If\
            \ the requested version was already the active environment configuration,\
            \ this is an idempotent no-op (no backend state changes)."
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Client error."
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Server error."
      security:
      - ssoAuth:
        - "extensions:definitions:write"
      - ssoBearerAuth: []
      summary: "Installs an Extension 2.0 from the Hub."
      tags:
      - "Extensions"
      description: "**Required scope:** extensions:definitions:write"
  /extensions/{extension-name}/environment-configuration:
    delete:
      operationId: "deleteExtensionEnvironmentConfiguration"
      parameters:
      - description: "The name of the requested Extension 2.0."
        in: "path"
        name: "extension-name"
        required: true
        schema:
          type: "string"
      responses:
        "204":
          description: "Success. Environment configuration deactivated. Response doesn't\
            \ have a body."
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Client error."
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Server error."
      security:
      - ssoAuth:
        - "extensions:definitions:write"
      - ssoBearerAuth: []
      summary: "Deactivates the environment configuration for Extension 2.0."
      tags:
      - "Extensions"
      description: "**Required scope:** extensions:definitions:write"
    get:
      operationId: "getActiveExtensionEnvironmentConfiguration"
      parameters:
      - description: "The name of the requested Extension 2.0."
        in: "path"
        name: "extension-name"
        required: true
        schema:
          type: "string"
      - description: "Comma separated list of additional fields to include in the\
          \ response.\nAvailable fields:\n* `assets` - includes assets of the Extension\
          \ 2.0 in the environment.\n* `status` - includes installation status of\
          \ assets of the Extension 2.0 in the environment.\n* `errors` - includes\
          \ installation errors of assets of the Extension 2.0 in the environment.\n"
        in: "query"
        name: "add-fields"
        schema:
          type: "string"
          example: "assets,status,errors"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentConfiguration"
          description: "Success."
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Client error."
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Server error."
      security:
      - ssoAuth:
        - "extensions:definitions:read"
      - ssoBearerAuth: []
      summary: "Retrieves the active environment configuration version for Extension\
        \ 2.0."
      tags:
      - "Extensions"
      description: "**Required scope:** extensions:definitions:read"
    post:
      operationId: "activateExtensionEnvironmentConfiguration"
      parameters:
      - description: "The name of the requested Extension 2.0."
        in: "path"
        name: "extension-name"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtensionEnvironmentConfigurationVersion"
        description: "The version of the requested environment configuration."
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionEnvironmentConfigurationVersion"
          description: "Success. Environment configuration created. If the requested\
            \ version was already active, this is an idempotent no-op (no backend\
            \ state changes)."
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Client error."
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Server error."
      security:
      - ssoAuth:
        - "extensions:definitions:write"
      - ssoBearerAuth: []
      summary: "Activates the environment configuration for a specified version of\
        \ Extension 2.0."
      tags:
      - "Extensions"
      description: "**Required scope:** extensions:definitions:write"
    put:
      operationId: "updateExtensionEnvironmentConfiguration"
      parameters:
      - description: "The name of the requested Extension 2.0."
        in: "path"
        name: "extension-name"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtensionEnvironmentConfigurationVersion"
        description: "The version of the requested environment configuration."
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionEnvironmentConfigurationVersion"
          description: "Success. Environment configuration updated."
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Client error."
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Server error."
      security:
      - ssoAuth:
        - "extensions:definitions:write"
      - ssoBearerAuth: []
      summary: "Updates the active environment configuration version for Extension\
        \ 2.0."
      tags:
      - "Extensions"
      description: "**Required scope:** extensions:definitions:write"
  /extensions/{extension-name}/environment-configuration/alert-templates/{alert-template-id}:
    get:
      operationId: "getAlertTemplate"
      parameters:
      - description: "The name of the requested Extension 2.0."
        in: "path"
        name: "extension-name"
        required: true
        schema:
          type: "string"
      - description: "ID of the requested asset."
        in: "path"
        name: "alert-template-id"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertTemplate"
          description: "Success."
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Client error."
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Server error."
      security:
      - ssoAuth:
        - "extensions:definitions:read"
      - ssoBearerAuth: []
      summary: "Retrieves the alert template for a specified asset of the active environment\
        \ configuration for Extension 2.0."
      tags:
      - "Extensions"
      description: "**Required scope:** extensions:definitions:read"
  /extensions/{extension-name}/monitoring-configurations:
    get:
      operationId: "listExtensionMonitoringConfigurations"
      parameters:
      - description: "The amount of monitoring configurations in a single response\
          \ payload. \n\nThe maximal allowed page size is 500. \n\nIf not set, 20\
          \ is used."
        in: "query"
        name: "page-size"
        schema:
          type: "integer"
          format: "int64"
      - description: "The cursor for the next page of results. You can find it in\
          \ the **next-page-key** field of the previous response. \n\nThe first page\
          \ is always returned if you don't specify the **page-key** query parameter.\
          \ \n\nWhen the **page-key** is set to obtain subsequent pages, you must\
          \ omit all other query parameters. "
        in: "query"
        name: "page-key"
        schema:
          type: "string"
      - description: "The name of the requested Extension 2.0."
        in: "path"
        name: "extension-name"
        required: true
        schema:
          type: "string"
      - description: "The filter parameter, as explained [here](https://dt-url.net/platform-services-filtering).\n\
          \nFiltering is supported on the following fields:\n* `version`\n* `active`\
          \ or `enabled` (both keywords are supported and interchangeable)\n* `description`\n\
          * `activationContext`\n\n"
        in: "query"
        name: "filter"
        schema:
          type: "string"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionMonitoringConfigurationList"
          description: "Success."
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Client error."
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Server error."
      security:
      - ssoAuth:
        - "extensions:configurations:read"
      - ssoBearerAuth: []
      summary: "Lists all monitoring configurations for Extension 2.0."
      tags:
      - "Extensions"
      description: "**Required scope:** extensions:configurations:read"
    post:
      operationId: "createExtensionMonitoringConfiguration"
      parameters:
      - description: "The name of the requested Extension 2.0."
        in: "path"
        name: "extension-name"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonitoringConfiguration"
        description: "JSON body of the request, containing monitoring configuration\
          \ parameters. Monitoring configuration scope cannot be updated."
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringConfigurationResponse"
          description: "Created."
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Client error."
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Server error."
      security:
      - ssoAuth:
        - "extensions:configurations:write"
      - ssoBearerAuth: []
      summary: "Creates a new monitoring configuration for Extension 2.0."
      tags:
      - "Extensions"
      description: "**Required scope:** extensions:configurations:write"
  /extensions/{extension-name}/monitoring-configurations/statuses:
    get:
      operationId: "getExtensionMonitoringConfigurationStatuses"
      parameters:
      - description: "The name of the requested Extension 2.0."
        in: "path"
        name: "extension-name"
        required: true
        schema:
          type: "string"
      responses:
