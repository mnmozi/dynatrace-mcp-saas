          items:
            $ref: "#/components/schemas/AuditLogEntry"
        nextPageKey:
          type: "string"
          description: "The cursor for the next page of results. Has the value of\
            \ `null` on the last page. \n\nUse it in the **nextPageKey** query parameter\
            \ to obtain subsequent pages of the result."
          example: "AQAAABQBAAAABQ=="
        pageSize:
          type: "integer"
          format: "int32"
          description: "The number of entries per page."
        totalCount:
          type: "integer"
          format: "int64"
          description: "The total number of entries in the result."
      required:
      - "totalCount"
    AuditLogEntry:
      type: "object"
      description: "An entry of the audit log."
      example:
        category: "CONFIG"
        entityId: "MOBILE_RUM: MOBILE_APPLICATION-752C223D59734CD2"
        environmentId: "prod-env-13"
        eventType: "UPDATE"
        logId: "197425568800060000"
        patch:
        - oldValue: 20000
          op: "replace"
          path: "/refreshTimeIntervalMillis"
          value: 30000
        success: true
        timestamp: 1974255688445
        user: "test.user@company.com"
        userOrigin: "webui (192.168.0.2)"
        userType: "USER_NAME"
      properties:
        category:
          type: "string"
          description: "The category of the recorded operation."
          enum:
          - "ACTIVEGATE_TOKEN"
          - "BUILD_UNIT_V2"
          - "CONFIG"
          - "MANUAL_TAGGING_SERVICE"
          - "TENANT_LIFECYCLE"
          - "TOKEN"
          - "WEB_UI"
          readOnly: true
        dt.settings.key:
          type: "string"
          description: "The key of the affected object of a setting for entries of\
            \ category `CONFIG`."
          readOnly: true
        dt.settings.object_id:
          type: "string"
          description: "The ID of the affected object of a setting for entries of\
            \ category `CONFIG`."
          readOnly: true
        dt.settings.object_summary:
          type: "string"
          description: "The value summary for entries of category `CONFIG`."
          readOnly: true
        dt.settings.schema_id:
          type: "string"
          description: "The schema ID or config ID for entries of category `CONFIG`."
          readOnly: true
        dt.settings.scope_id:
          type: "string"
          description: "The persistence scope for entries of category `CONFIG`, e.g.\
            \ an ME identifier."
          example: "environment"
          readOnly: true
        dt.settings.scope_name:
          type: "string"
          description: "The display name of the scope for entries of category `CONFIG`."
          readOnly: true
        entityId:
          type: "string"
          description: "The ID of an entity from the **category**. \n\nFor example,\
            \ it can be config ID for the `CONFIG` category or token ID for the `TOKEN`\
            \ category."
          readOnly: true
        environmentId:
          type: "string"
          description: "The ID of the Dynatrace environment where the recorded operation\
            \ occurred."
          readOnly: true
        eventType:
          type: "string"
          description: "The type of the recorded operation.\n\n* `LOGIN` -> A user\
            \ logged in\n* `LOGOUT` -> A user logged out\n* `CREATE` -> An object\
            \ was created\n* `UPDATE` -> An object was updated\n* `DELETE` -> An object\
            \ was deleted\n* `REVOKE` -> An Active Gate token was revoked\n* `TAG_ADD`\
            \ -> A manual tag was added\n* `TAG_REMOVE` -> A manual tag was removed\n\
            * `TAG_UPDATE` -> A manual tag was updated\n* `REMOTE_CONFIGURATION_MANAGEMENT`\
            \ -> A Remote Configuration Management related operation occurred\n"
          enum:
          - "CREATE"
          - "DELETE"
          - "LOGIN"
          - "LOGOUT"
          - "REORDER"
          - "REVOKE"
          - "TAG_ADD"
          - "TAG_REMOVE"
          - "TAG_UPDATE"
          - "UPDATE"
          readOnly: true
        logId:
          type: "string"
          description: "The ID of the log entry."
          maxLength: 19
          minLength: 0
          readOnly: true
        message:
          type: "string"
          description: "The logged message."
          readOnly: true
        patch:
          anyOf:
          - $ref: "#/components/schemas/AnyValue"
          description: "The patch of the recorded operation as the JSON representation.\
            \ \n\nThe format is an enhanced RFC 6902. The patch also carries the previous\
            \ value in the **oldValue** field."
          readOnly: true
        success:
          type: "boolean"
          description: "The recorded operation is successful (`true`) or failed (`false`)."
          readOnly: true
        timestamp:
          type: "integer"
          format: "int64"
          description: "The timestamp of the record creation, in UTC milliseconds."
          readOnly: true
        user:
          type: "string"
          description: "The ID of the user who performed the recorded operation."
          readOnly: true
        userOrigin:
          type: "string"
          description: "The origin and the IP address of the **user**."
          readOnly: true
        userType:
          type: "string"
          description: "The type of the authentication of the **user**.\n\n* `USER_NAME`\
            \ -> User was logged in the UI\n* `TOKEN_HASH` ->  URL Token or DevOps\
            \ Token, the hash of the token is logged\n* `SERVICE_NAME` -> No authenticated\
            \ user at all, this action was performed by a system service automatically\n\
            * `PUBLIC_TOKEN_IDENTIFIER` -> API Token, the public token id is logged\n"
          enum:
          - "PUBLIC_TOKEN_IDENTIFIER"
          - "SERVICE_NAME"
          - "TOKEN_HASH"
          - "USER_NAME"
          readOnly: true
      required:
      - "category"
      - "environmentId"
      - "eventType"
      - "logId"
      - "success"
      - "timestamp"
      - "user"
      - "userType"
