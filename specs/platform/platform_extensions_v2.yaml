components:
  schemas:
    ActiveGateGroupInfo:
      type: "object"
      description: "Metadata for each ActiveGate group."
      properties:
        activeGates:
          type: "array"
          description: "ActiveGates in group."
          items:
            $ref: "#/components/schemas/ActiveGateInfo"
        availableActiveGates:
          type: "integer"
          format: "int32"
          description: "Number of ActiveGates in group available for extension."
        groupName:
          type: "string"
          description: "ActiveGate group name."
      required:
      - "activeGates"
      - "availableActiveGates"
      - "groupName"
    ActiveGateGroupInfoList:
      type: "object"
      description: "ActiveGate groups metadata for extensions."
      properties:
        items:
          type: "array"
          description: "Metadata for each ActiveGate group."
          items:
            $ref: "#/components/schemas/ActiveGateGroupInfo"
          uniqueItems: true
      required:
      - "items"
    ActiveGateInfo:
      type: "object"
      description: "ActiveGates in group."
      properties:
        errors:
          type: "array"
          description: "List of errors if Extension can't be run on the ActiveGate"
          items:
            type: "string"
            description: "List of errors if Extension can't be run on the ActiveGate"
        id:
          type: "string"
          description: "ActiveGate ID."
      required:
      - "errors"
      - "id"
    AlertTemplate:
      type: "object"
      properties:
        templateJson:
          type: "string"
    AnyValue:
      anyOf:
      - type: "string"
      - type: "number"
      - type: "integer"
      - type: "boolean"
      - type: "array"
      - type: "object"
      description: "A schema representing an arbitrary value type."
    AssetInfo:
      type: "object"
      description: "Metadata for an extension asset."
      properties:
        assetSchemaDetails:
          $ref: "#/components/schemas/AssetSchemaDetails"
        displayName:
          type: "string"
          description: "User-friendly name of the asset."
        id:
          type: "string"
          description: "ID of the asset. Identifies the asset in REST API and/or UI\
            \ (where applicable)."
        type:
          type: "string"
          description: "The type of the asset."
          enum:
          - "ALERT"
          - "ALERT_TEMPLATE"
          - "AWS_SERVICE"
          - "CUSTOM_CARDS"
          - "DASHBOARD"
          - "DECLARATIVE_PROCESSES"
          - "DOCUMENT_DASHBOARD"
          - "DOCUMENT_SCREEN"
          - "DQL_LOG_METRIC"
          - "DQL_LOG_PROCESSING_RULE"
          - "GENERIC_RELATIONSHIP"
          - "GENERIC_TYPE"
          - "LIST_SCREEN_FILTERS"
          - "LIST_SCREEN_INJECTIONS"
          - "LIST_SCREEN_LAYOUT"
          - "LOG_EVENT"
          - "LOG_METRIC"
          - "LOG_PROCESSING_RULE"
          - "LQL_LOG_METRIC"
          - "LQL_LOG_PROCESSING_RULE"
          - "METRIC_METADATA"
          - "METRIC_QUERY"
          - "OPEN_PIPELINE"
          - "PROCESS_GROUPING_RULES"
          - "SCREEN_ACTIONS"
          - "SCREEN_CHART_GROUPS"
          - "SCREEN_DQL_TABLE"
          - "SCREEN_ENTITIES_LISTS"
          - "SCREEN_EVENTS_CARDS"
          - "SCREEN_FILTERS"
          - "SCREEN_HEALTH_CARDS"
          - "SCREEN_INJECTIONS"
