      summary: "List all projects. The list can be server side sorted for lastModifiedAt"
      operationId: "listProjects"
      tags:
      - "Projects"
      parameters:
      - $ref: "#/components/parameters/pageParam"
      - $ref: "#/components/parameters/pageSizeParam"
      - $ref: "#/components/parameters/sort"
      - $ref: "#/components/parameters/addFieldsParamListProject"
      security:
      - ssoAuth:
        - "feature-management:projects:read"
      - ssoBearerAuth: []
      responses:
        "200":
          description: "A paged array of projects"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/InternalServerError"
      description: "**Required scope:** feature-management:projects:read"
    post:
      summary: "Create a new project"
      operationId: "createProject"
      tags:
      - "Projects"
      security:
      - ssoAuth:
        - "feature-management:projects:write"
      - ssoBearerAuth: []
      requestBody:
        required: true
        description: "The project to create."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: "The project is successfully created."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetails"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/InternalServerError"
