      description: "Request body for updating the display order for release stages\
        \ in a project."
      required:
      - "items"
      properties:
        items:
          type: "array"
          description: "The list of release stages with updated display order. The\
            \ display order will be updated for the release stages based on the provided\
            \ order in the list."
          items:
            type: "object"
            required:
            - "key"
            - "displayOrder"
            - "version"
            properties:
              key:
                $ref: "#/components/schemas/ReleaseStageKey"
              displayOrder:
                type: "integer"
                description: "The display order of the release stage in the project\
                  \ within a given environment type. If multiple release stages have\
                  \ the same order, they will be sorted alphabetically by name (a-z)."
                default: 0
                minimum: 0
                maximum: 100
              version:
                $ref: "#/components/schemas/OptimisticLockingVersion"
    ReleaseStageDetails:
      type: "object"
      description: "Response body for release stage operations."
      allOf:
      - $ref: "#/components/schemas/ReleaseStageCreate"
      properties:
        modificationInfo:
          $ref: "#/components/schemas/ModificationInfo"
        resourceContext:
          $ref: "#/components/schemas/ResourceContext"
        version:
          $ref: "#/components/schemas/OptimisticLockingVersion"
    ReleaseStageList:
      required:
      - "items"
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/ReleaseStageDetails"
        pagination:
          $ref: "#/components/schemas/Pagination"
        resourceContext:
          $ref: "#/components/schemas/ResourceContext"
    ReleaseStageType:
      type: "string"
      enum:
      - "DEVELOPMENT"
      - "STAGING"
      - "PRODUCTION"
    SdkKeyType:
      type: "string"
      description: "The type of SDK key."
      enum:
      - "web"
      - "server"
      - "mobile"
    SDKKeyDetails:
      type: "object"
      description: "SDK key entity details."
      required:
      - "sdkKey"
      - "type"
      properties:
        sdkKey:
          $ref: "#/components/schemas/SdkKey"
        type:
          $ref: "#/components/schemas/SdkKeyType"
        modificationInfo:
          $ref: "#/components/schemas/ModificationInfo"
        version:
          $ref: "#/components/schemas/OptimisticLockingVersion"
    SdkKeyCreate:
      type: "object"
      description: "Request body for creating an SDK key."
      required:
      - "type"
      properties:
        type:
          $ref: "#/components/schemas/SdkKeyType"
    SDKKeyList:
      type: "object"
      description: "List of SDK key entities grouped by type."
      required:
      - "web"
      - "mobile"
      - "server"
      properties:
        web:
          type: "array"
          items:
            $ref: "#/components/schemas/SDKKeyDetails"
        mobile:
          type: "array"
          items:
            $ref: "#/components/schemas/SDKKeyDetails"
        server:
          type: "array"
          items:
            $ref: "#/components/schemas/SDKKeyDetails"
    VariantDistribution:
      type: "object"
      description: "The distribution of a specific variant to serve."
      required:
      - "variantKey"
      - "percentage"
      properties:
        variantKey:
          $ref: "#/components/schemas/VariantKey"
        percentage:
          type: "number"
          description: "The percentage of users to serve this variant to. The total\
            \ percentage across all variants in a distribution must equal 100."
    StringOperators:
      type: "string"
      enum:
      - "IS"
      - "IS_NOT"
      - "CONTAINS"
      - "DOES_NOT_CONTAIN"
      - "STARTS_WITH"
      - "ENDS_WITH"
      - "EXISTS"
      - "DOES_NOT_EXIST"
    NumberOperators:
      type: "string"
      enum:
      - "IS"
      - "IS_NOT"
      - "GREATER_THAN"
      - "GREATER_THAN_OR_EQUAL"
      - "LESS_THAN"
      - "LESS_THAN_OR_EQUAL"
      - "EXISTS"
      - "DOES_NOT_EXIST"
    BooleanOperators:
      type: "string"
      enum:
      - "IS"
      - "IS_NOT"
      - "EXISTS"
      - "DOES_NOT_EXIST"
    DateTimeOperators:
      type: "string"
      description: "Operators for date-time context attributes. `BETWEEN` matches\
        \ when the attribute is within the range given by exactly two values [from,\
        \ to].\n"
      enum:
      - "BEFORE"
      - "AFTER"
      - "BETWEEN"
      - "EXISTS"
      - "DOES_NOT_EXIST"
    SemverOperators:
      type: "string"
      description: "Operators for semantic-version context attributes. `MATCHES_MAJOR`\
        \ (`^`) matches versions compatible within the same major version; `MATCHES_MINOR`\
        \ (`~`) matches versions compatible within the same minor version.\n"
      enum:
      - "IS"
      - "IS_NOT"
      - "GREATER_THAN"
      - "GREATER_THAN_OR_EQUAL"
      - "LESS_THAN"
      - "LESS_THAN_OR_EQUAL"
      - "MATCHES_MAJOR"
      - "MATCHES_MINOR"
      - "EXISTS"
      - "DOES_NOT_EXIST"
    TargetingCondition:
      type: "object"
      description: "Base schema for all targeting condition rule types."
      required:
      - "valueType"
      properties:
        valueType:
          type: "string"
      discriminator:
        propertyName: "valueType"
        mapping:
          STRING: "#/components/schemas/StringTargetingRule"
          NUMBER: "#/components/schemas/NumberTargetingRule"
          BOOLEAN: "#/components/schemas/BooleanTargetingRule"
          DATE_TIME: "#/components/schemas/DateTimeTargetingRule"
          SEM_VER: "#/components/schemas/SemverTargetingRule"
    StringTargetingRule:
      allOf:
      - $ref: "#/components/schemas/TargetingCondition"
      - type: "object"
        description: "A targeting rule for string context attributes."
        required:
        - "contextKey"
        - "operator"
        - "values"
        properties:
          contextKey:
            type: "string"
          operator:
            $ref: "#/components/schemas/StringOperators"
          values:
            type: "array"
            maxItems: 5000
            items:
              type: "string"
    NumberTargetingRule:
      allOf:
      - $ref: "#/components/schemas/TargetingCondition"
      - type: "object"
        description: "A targeting rule for numeric context attributes."
        required:
        - "contextKey"
        - "operator"
        - "values"
        properties:
          contextKey:
            type: "string"
          operator:
            $ref: "#/components/schemas/NumberOperators"
          values:
            type: "array"
            maxItems: 5000
            items:
              type: "number"
    BooleanTargetingRule:
      allOf:
      - $ref: "#/components/schemas/TargetingCondition"
      - type: "object"
        description: "A targeting rule for boolean context attributes."
        required:
        - "contextKey"
        - "operator"
        - "values"
        properties:
          contextKey:
            type: "string"
          operator:
            $ref: "#/components/schemas/BooleanOperators"
          values:
            type: "array"
            maxItems: 5000
            items:
              type: "boolean"
    DateTimeTargetingRule:
      allOf:
      - $ref: "#/components/schemas/TargetingCondition"
      - type: "object"
        description: "A targeting rule for date-time context attributes. Values are\
          \ epoch seconds (Unix timestamps). `BETWEEN` requires exactly two values\
          \ [from, to].\n"
        required:
        - "contextKey"
        - "operator"
        - "values"
        properties:
          contextKey:
            type: "string"
          operator:
            $ref: "#/components/schemas/DateTimeOperators"
          values:
            type: "array"
            maxItems: 5000
            items:
              type: "string"
              format: "int64"
              description: "Epoch seconds (Unix timestamp)."
              example: "1770326383"
    SemverTargetingRule:
      allOf:
      - $ref: "#/components/schemas/TargetingCondition"
      - type: "object"
        description: "A targeting rule for semantic-version context attributes."
        required:
        - "contextKey"
        - "operator"
        - "values"
        properties:
          contextKey:
            type: "string"
          operator:
            $ref: "#/components/schemas/SemverOperators"
          values:
            type: "array"
            maxItems: 5000
            items:
              type: "string"
              description: "A semantic version string (SemVer 2.0.0). The operator\
                \ (e.g. MATCHES_MAJOR, MATCHES_MINOR) is carried separately, so the\
                \ value itself is a plain version without a range prefix."
              pattern: "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\\
                d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\\
                +([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?$"
              example: "1.2.3"
    TargetingRule:
      type: "object"
      description: "A generic targeting rule."
      properties:
        id:
          type: "string"
          description: "Service generated unique identifier for the targeting rule."
        name:
          type: "string"
          description: "Optional human-readable name for the targeting rule."
        serve:
          type: "array"
          items:
            $ref: "#/components/schemas/VariantDistribution"
        conditions:
          type: "array"
          items:
            oneOf:
            - $ref: "#/components/schemas/BooleanTargetingRule"
            - $ref: "#/components/schemas/DateTimeTargetingRule"
            - $ref: "#/components/schemas/NumberTargetingRule"
            - $ref: "#/components/schemas/SemverTargetingRule"
            - $ref: "#/components/schemas/StringTargetingRule"
    Targeting:
      type: "object"
      description: "Targeting conditions for a feature flag."
      properties:
        rules:
          type: "array"
          items:
            $ref: "#/components/schemas/TargetingRule"
    FeatureReleaseStageTargetingUpdate:
      type: "object"
      description: "Request body for updating feature release stage targeting."
      required:
      - "version"
      - "enabled"
      - "targeting"
      properties:
        enabled:
          type: "boolean"
          default: false
        targeting:
          $ref: "#/components/schemas/Targeting"
        version:
          $ref: "#/components/schemas/OptimisticLockingVersion"
    FeatureReleaseStageTargetingDetails:
      type: "object"
      description: "Response body for feature release stage targeting."
      required:
      - "projectKey"
      - "featureKey"
      - "releaseStageKey"
      properties:
        projectKey:
          allOf:
          - $ref: "#/components/schemas/ProjectKey"
          description: "The key of the project where the feature release stage targeting\
            \ is defined"
        featureKey:
          allOf:
          - $ref: "#/components/schemas/FeatureKey"
          description: "The key of the feature where the feature release stage targeting\
            \ is defined"
        releaseStageKey:
          allOf:
          - $ref: "#/components/schemas/ReleaseStageKey"
          description: "The key of the release stage where the feature release stage\
            \ targeting is defined"
        enabled:
          type: "boolean"
          default: false
        targeting:
          $ref: "#/components/schemas/Targeting"
        version:
          $ref: "#/components/schemas/OptimisticLockingVersion"
        modificationInfo:
          $ref: "#/components/schemas/ModificationInfo"
        resourceContext:
          $ref: "#/components/schemas/ResourceContext"
    FeatureReleaseStageTargetingList:
      type: "object"
      required:
      - "items"
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/FeatureReleaseStageTargetingDetails"
        pagination:
          $ref: "#/components/schemas/Pagination"
        resourceContext:
          $ref: "#/components/schemas/ResourceContext"
    Page:
      description: "The index of the page to return. The first page will be returned\
        \ if this parameters isn't specified."
      type: "integer"
      default: 1
      minimum: 1
      example: 1
    PageSize:
      description: "The number of resources to return in a single request. 20 by default."
      type: "integer"
      default: 20
      minimum: 1
      maximum: 1000
      example: 2
    Pagination:
      type: "object"
      readOnly: true
      properties:
        page:
          $ref: "#/components/schemas/Page"
        pageSize:
          $ref: "#/components/schemas/PageSize"
        totalCount:
          type: "number"
          minimum: 0
          example: 100
    OptimisticLockingVersion:
      type: "integer"
      readOnly: true
      example: 1
      description: "The optimistic locking version for this entity"
    ResourceContext:
      type: "object"
      readOnly: true
      description: "Describes the operations the authenticated caller is permitted\
        \ to perform on this resource or collection. Only operations that are actually\
        \ allowed for the caller are included—the absence of an operation means the\
        \ corresponding action is forbidden. `read` is always present when a resource\
        \ is returned. On collection responses, `delete` is never present (collections\
        \ can't be deleted); `write` indicates the caller may create new items in\
        \ the collection.\n"
      properties:
        operations:
          type: "array"
          description: "Set of permitted operations for the caller on this resource\
            \ or collection."
          items:
            type: "string"
            enum:
            - "write"
            - "delete"
    ModificationInfo:
      type: "object"
      readOnly: true
      properties:
        createdBy:
          type: "string"
        createdTime:
          type: "string"
          format: "date-time"
        lastModifiedBy:
          type: "string"
        lastModifiedTime:
          type: "string"
          format: "date-time"
      required:
      - "createdBy"
      - "createdTime"
      - "lastModifiedBy"
      - "lastModifiedTime"
      example:
        createdBy: "123e4567-e89b-12d3-a456-426614174000"
        createdTime: "2022-05-25T10:24:04.202Z"
        lastModifiedBy: "123e4567-e89b-12d3-a456-426614174000"
        lastModifiedTime: "2022-05-25T10:24:04.202Z"
    ErrorEnvelope:
      type: "object"
      required:
      - "code"
      - "message"
      properties:
        code:
          type: "integer"
          format: "int32"
        message:
          type: "string"
        details:
          $ref: "#/components/schemas/ErrorDetails"
    ErrorDetails:
      properties:
        traceId:
          type: "string"
        constraintViolations:
          type: "array"
          items:
            $ref: "#/components/schemas/ConstraintViolation"
        missingScopes:
          type: "array"
          items:
            type: "string"
        flagdValidationErrors:
          type: "array"
          items:
            $ref: "#/components/schemas/FlagdValidationError"
    ConstraintViolation:
      type: "object"
      required:
      - "message"
      properties:
        message:
          type: "string"
        path:
          type: "string"
    FlagdValidationError:
      type: "object"
      required:
      - "path"
      - "errorCode"
      properties:
        path:
          type: "string"
        message:
          type: "string"
        errorCode:
          $ref: "#/components/schemas/FlagdValidationErrorCodes"
    FlagdValidationErrorCodes:
      type: "string"
      enum:
      - "CONDITIONS_MUST_BE_ARRAY"
      - "RULES_MUST_BE_ARRAY"
      - "INVALID_PERCENTAGE_SUM"
      - "INVALID_SERVE"
      - "UNKNOWN_VARIANT_KEY"
      - "UNKNOWN_CONTEXT_ATTRIBUTE_KEY"
      - "UNKNOWN_OPERATOR"
      - "CONDITION_MISSING_CONTEXT_KEY"
      - "CONTEXT_ATTRIBUTE_TYPE_MISMATCH"
      - "MISSING_OPERATOR"
      - "MISSING_VALUES"
      - "INVALID_VALUES_ELEMENT_TYPE"
      - "TOO_MANY_VALUES"
      - "INVALID_VALUE_COUNT"
      - "JSON_PARSE_ERROR"
      - "JSON_SCHEMA_VIOLATION"
  responses:
    BadRequestError:
