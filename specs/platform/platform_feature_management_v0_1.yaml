openapi: "3.0.4"
info:
  version: "0.1.56"
  title: "Feature Management API"
  x-service-category: "Feature Management"
  x-summary: "Provide functionality for Feature Management."
  description: "Feature Management - Endpoints to Manage your Features within Dynatrace"
servers:
- url: "https://asn8731h.sprint.apps.dynatracelabs.com/platform/feature-management/v0.1"
  x-api-gateway-url: "/platform/feature-management/v0.1"
tags:
- name: "Projects"
  description: "Operations for managing projects"
- name: "Context Attribute"
  description: "Operations for managing context attributes"
- name: "Release Stages"
  description: "Operations for managing release stages"
- name: "SDK Keys"
  description: "Operations for managing SDK keys per release stage"
- name: "Features"
  description: "Operations for managing features and variants"
- name: "Feature Release Stage Targeting"
  description: "Operations for managing feature release stage targeting"
- name: "Flags"
  description: "Operations for managing feature flags"
paths:
  /projects:
