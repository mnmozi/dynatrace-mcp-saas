        description:
          $ref: "#/components/schemas/Description"
        type:
          $ref: "#/components/schemas/ReleaseStageType"
        guarded:
          type: "boolean"
          default: false
          description: "Whether the release stage is guarded and feature release stage\
            \ targeting needs an approval to be applied."
        displayOrder:
          type: "integer"
          description: "The order of the release stage in the project within a given\
            \ environment type. If multiple release stages have the same order, they\
            \ will be sorted alphabetically by name (a-z)."
          default: 0
          minimum: 0
          maximum: 100
    ReleaseStageUpdate:
      type: "object"
      description: "Request body for updating a release stage. The key is specified\
        \ in the path parameter."
      required:
      - "name"
      - "type"
      - "version"
      properties:
        name:
          allOf:
          - $ref: "#/components/schemas/ResourceName"
          description: "The name of the release stage."
        description:
          $ref: "#/components/schemas/Description"
        type:
          $ref: "#/components/schemas/ReleaseStageType"
        guarded:
          type: "boolean"
          default: false
          description: "Whether the release stage is guarded and feature release stage\
            \ targeting needs an approval to be applied."
        displayOrder:
          type: "integer"
          description: "The display order of the release stage in the project within\
            \ a given environment type. If multiple release stages have the same order,\
            \ they will be sorted alphabetically by name (a-z)."
          default: 0
          minimum: 0
          maximum: 100
        version:
          $ref: "#/components/schemas/OptimisticLockingVersion"
    ReleaseStageReorder:
