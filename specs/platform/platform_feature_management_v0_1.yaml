  securitySchemes:
    ssoAuth:
      type: "oauth2"
      description: "This API uses OAuth 2.0."
      flows:
        clientCredentials:
          tokenUrl: "https://sso-sprint.dynatracelabs.com/sso/oauth2/token"
          scopes:
            feature-management:projects:write: "create and update projects"
            feature-management:projects:read: "read projects"
            feature-management:projects:delete: "delete projects"
            feature-management:release-stages:write: "create and update release-stages"
            feature-management:release-stages:delete: "delete release-stages"
            feature-management:features:write: "create and update features"
            feature-management:features:read: "read features"
            feature-management:features:delete: "delete features"
            feature-management:release-stage-targetings:write: "create and update\
              \ feature release stage targeting"
            feature-management:release-stage-targetings:read: "read feature release\
              \ stage targeting"
            feature-management:context-attributes:write: "create and update contexts"
            feature-management:context-attributes:delete: "delete contexts"
            feature-management:context-attributes:read: "read contexts"
            feature-management:sdk-keys:write: "generate new sdk keys"
            feature-management:sdk-keys:delete: "invalidate sdk keys"
            feature-management:sdk-keys:read: "read sdk keys"
    ssoBearerAuth:
