  schemas:
    ResourceName:
      type: "string"
      description: "A resource name following the pattern: 2-256 characters total."
      pattern: "^.{2,256}$"
      example: "My Resource Name"
    ProjectKey:
      type: "string"
      format: "project-key"
      description: "The key of a project, unique within a tenant."
      pattern: "standard-key-pattern"
      example: "my-project"
    FeatureKey:
      type: "string"
      format: "feature-key"
      description: "The key of a feature, unique within a project."
      pattern: "standard-key-pattern"
      example: "my-feature"
    FlagKey:
      type: "string"
      format: "flag-key"
      description: "The key of a flag, unique within a feature."
      pattern: "standard-key-pattern"
      example: "my-flag"
    ReleaseStageKey:
      type: "string"
      format: "release-stage-key"
      description: "The key of a release stage, unique within a project."
      pattern: "standard-key-pattern"
      example: "my-release-stage"
    SdkKey:
      type: "string"
      format: "sdk-key"
      description: "The SDK key. Follows the pattern: `{token}.{platform}_{geo}_{publicRandom}.{secret}_{sha1}`.\n\
        - token: `dt` plus a 2-digit format version (e.g. `dt01`). - platform: one\
        \ of `web`, `mobile`, `server`. - geo: one of `us`, `eu`, `oc`, `ap`. - publicRandom:\
        \ 10 alphanumeric characters of entropy (`[a-zA-Z0-9]{10}`), safe to log.\
        \ - secret: 32 lowercase hex chars (UUIDv4 stripped of hyphens). - sha1: first\
        \ 10 hex chars of SHA-1 over the preceding segments. Length is bounded\n \
        \ below at 10 but intentionally open above so the format can grow without\
        \ re-issuing keys.\n\nThe first two dot-delimited parts (`{token}.{platform}_{geo}_{publicRandom}`)\
        \ form the public, log-safe identifier. The third part (`{secret}_{sha1}`)\
        \ is private and must never appear in logs, telemetry, or support bundles.\n"
      pattern: "^dt[0-9]{2}\\.(web|mobile|server)_[a-z]{2}_[a-zA-Z0-9]{10,}\\.[a-f0-9]{32,}_[a-f0-9]{10,}$"
      example: "dt01.server_us_ab3xy9kp2q.03ee0ef7cd4244bfb8b71fea8f783f53_d4f8a9c12a"
    ContextAttributeKey:
      type: "string"
      format: "context-attribute-key"
      description: "The key of a context attribute, unique within a project."
      pattern: "context-attribute-key-pattern"
      example: "my-context-attribute"
    ContextAttributeContextKey:
      type: "string"
      format: "context-key"
      description: "The context key of a context attribute, used to reference the\
        \ attribute from code. Must be between 1 and 256 characters with no leading\
        \ or trailing whitespace.\n"
      pattern: "^(?!\\s)(?!.*\\s$).{1,256}$"
      example: "my.Context_Attribute-1"
    VariantKey:
      type: "string"
      format: "variant-key"
      description: "The key of a variant, unique within a feature."
      pattern: "standard-key-pattern"
      example: "my-variant"
    Description:
      type: "string"
      description: "A description of the resource, up to 2048 characters."
      maxLength: 2048
      example: "This is a description of the resource."
    ProjectCreate:
      type: "object"
      description: "Request body for creating a new project."
      required:
      - "key"
      - "name"
      properties:
        key:
          $ref: "#/components/schemas/ProjectKey"
        name:
          allOf:
          - $ref: "#/components/schemas/ResourceName"
          description: "The name of the project."
        description:
          $ref: "#/components/schemas/Description"
        owner:
          type: "string"
          example: "Project Owner"
        maintainers:
          type: "array"
          example:
          - "Maintainer 1"
          - "Maintainer 2"
          items:
            type: "string"
    ProjectUpdate:
      type: "object"
      description: "Request body for updating a project. The key is specified in the\
        \ path parameter."
      required:
      - "version"
      properties:
        name:
          allOf:
          - $ref: "#/components/schemas/ResourceName"
          description: "The name of the project."
