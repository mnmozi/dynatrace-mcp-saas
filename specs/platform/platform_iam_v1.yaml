          \ used together with Offset-based Pagination! Max length: 2000"
        schema:
          maxLength: 2000
          minLength: 0
          type: "string"
          nullable: true
      - name: "page"
        in: "query"
        description: "Offset-based Pagination - page. Default value: 1. Page number\
          \ to return. Offset-based Pagination can't be used with Cursor-based Pagination!"
        schema:
          type: "integer"
          format: "int64"
          nullable: true
      - name: "pageSize"
        in: "query"
        description: "Pagination - page size. Default value: 1000. Minimum value:\
          \ 1. Maximum value: 1000"
        schema:
          maximum: 1000
          minimum: 1
          type: "integer"
          format: "int64"
          nullable: true
      responses:
        "401":
          description: "Authorization header is missing or is incorrect."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicExceptionMessage"
        "403":
          description: "Execution user is not allowed to perform the action."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicExceptionMessage"
        "429":
          description: "Too many requests have been sent - requests are throttled"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicExceptionThrottlingMessage"
        "200":
          description: "Active service users from the organizational level filtered\
