      - name: "page-key"
        in: "query"
        description: "Cursor-based Pagination - page-key. Cursor to the next page,\
          \ includes page number and filtering values. Implicit filtering values will\
          \ be overwritten by page-key property. Cursor-based Pagination can't be\
          \ used together with Offset-based Pagination! Max length: 2000"
