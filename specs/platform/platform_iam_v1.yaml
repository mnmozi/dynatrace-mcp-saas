        \ will be all of the groups meeting any of the filtering criteria.\nAuthorization\
        \ is based on an assignment of the calling user to the account associated\
        \ with the 'level-type' and 'level-id' For environment 'level-type' user has\
        \ to be assigned to account to which the environment is assigned, user does\
        \ not need any permissions in such environment"
