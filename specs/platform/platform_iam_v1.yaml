  /organizational-levels/accounts/{account-uuid}/wif/trust-policies/{trust-policy-uuid}/mappings:
    get:
      tags:
      - "WIF Service User Mappings"
      summary: "List WIF service user mappings"
      operationId: "list"
      parameters:
      - name: "account-uuid"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "trust-policy-uuid"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "pageNumber"
        in: "query"
        schema:
          type: "integer"
          format: "int32"
          default: 1
      - name: "pageSize"
        in: "query"
        schema:
          type: "integer"
          format: "int32"
          default: 100
      responses:
        "200":
          description: "List of service user mappings"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestWifServiceUserMappingList"
      security:
      - ssoBearerAuth: []
    post:
      tags:
      - "WIF Service User Mappings"
      summary: "Create a WIF service user mapping"
      operationId: "create"
      parameters:
      - name: "account-uuid"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "trust-policy-uuid"
        in: "path"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestWifServiceUserMappingForm"
        required: true
      responses:
        "201":
          description: "Service user mapping created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestWifServiceUserMapping"
      security:
      - ssoBearerAuth: []
