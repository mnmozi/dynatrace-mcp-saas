        "404":
          description: "Calling user is not assigned to the requested account or requested\
            \ environment is not assigned to account that user is assigned to or the\
            \ 'level-id' does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicExceptionMessage"
      security:
      - ssoAuth:
        - "iam:users:read"
      - ssoBearerAuth: []
  /organizational-levels/{level-type}/{level-id}/service-users:
    get:
      tags:
      - "Users and Groups"
      summary: "Get active service users from organizational level which are usable\
        \ by the execution user"
      description: "**Required scope:** iam:service-users:use<br/><br/>Environment-level\
        \ queries are executed in account context because there is no direct link\
        \ between environments and service users."
      operationId: "getAvailableServiceUsers"
      parameters:
