openapi: "3.0.1"
info:
  title: "Identity and Access Management"
  description: "Identity and Access Management configuration. \nAllows viewing users\
    \ within the platform and their access capabilities."
  version: "1.0.1"
  x-summary: "Identity and Access Management configuration. Allows viewing users within\
    \ the platform and their access capabilities."
  x-service-category: "Identity and Access Management"
servers:
- url: "https://asn8731h.sprint.apps.dynatracelabs.com/platform/iam/v1"
  x-api-gateway-url: "/platform/iam/v1"
security:
- ssoAuth: []
tags:
- name: "Users and Groups"
  description: "Allows to search through users and groups."
- name: "WIF Service User Mappings"
  description: "Workload Identity Federation service user mapping management"
- name: "WIF Trust Policies"
  description: "Workload Identity Federation trust policy management"
paths:
  /organizational-levels/{level-type}/{level-id}/users/{uuid}:
    get:
      tags:
      - "Users and Groups"
      summary: "Get active user from organizational level"
      description: "**Required scope:** iam:users:read<br/><br/>Authorization is based\
        \ on an assignment of the calling user to the account associated with the\
        \ 'level-type' and 'level-id' For environment 'level-type' user has to be\
        \ assigned to account to which the environment is assigned, user does not\
        \ need any permissions in such environment"
      operationId: "getActiveUserFromOrganizationalLevel"
      parameters:
      - name: "level-type"
        in: "path"
        description: "Allowed values: account, environment"
        required: true
        schema:
          maxLength: 100
          minLength: 0
          type: "string"
      - name: "level-id"
        in: "path"
        description: "Identifier of 'level-type'. Max allowed length is 36. For account\
          \ use its UUID. For environment 'level-type' user has to be assigned to\
          \ account to which the environment is assigned, user does not need any permissions\
          \ in such environment"
        required: true
        schema:
          maxLength: 36
          minLength: 0
          type: "string"
      - name: "uuid"
        in: "path"
        description: "User UUID"
        required: true
        schema:
          maxLength: 36
          minLength: 0
          type: "string"
      responses:
        "401":
          description: "Authorization header is missing or is incorrect."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicExceptionMessage"
        "403":
          description: "Execution user is not allowed to perform the action."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicExceptionMessage"
        "429":
          description: "Too many requests have been sent - requests are throttled"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicExceptionThrottlingMessage"
        "200":
          description: "User fetched successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestUserPublic"
        "404":
          description: "Calling user is not assigned to the requested account or requested\
            \ environment is not assigned to account that user is assigned to or the\
            \ 'level-id' does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicExceptionMessage"
      security:
      - ssoAuth:
        - "iam:users:read"
      - ssoBearerAuth: []
  /organizational-levels/{level-type}/{level-id}/users:
    get:
      tags:
      - "Users and Groups"
      summary: "Get active users from organizational level"
      description: "**Required scope:** iam:users:read<br/><br/>Providing value for\
        \ at least one of the parameters: 'partialString' or 'uuid' is required.\n\
        If both query params 'partialString' and 'uuid' are provided then the result\
        \ returns users meeting any of the filtering criteria.\nReturned users are\
        \ first ordered by name and then by surname.\nAuthorization is based on an\
        \ assignment of the calling user to the account associated with the 'level-type'\
        \ and 'level-id' For environment 'level-type' user has to be assigned to account\
        \ to which the environment is assigned, user does not need any permissions\
        \ in such environment"
      operationId: "getActiveUsersForOrganizationalLevel"
      parameters:
      - name: "level-type"
        in: "path"
        description: "Allowed values: account, environment"
        required: true
        schema:
          maxLength: 100
          minLength: 0
          type: "string"
      - name: "level-id"
        in: "path"
        description: "Identifier of 'level-type'. Max allowed length is 36. For account\
          \ use its UUID. For environment 'level-type' user has to be assigned to\
          \ account to which the environment is assigned, user does not need any permissions\
          \ in such environment"
        required: true
        schema:
          maxLength: 36
          minLength: 0
          type: "string"
      - name: "partialString"
        in: "query"
        description: "Filter value - searches for users whose email contains provided\
          \ value AND users whose 'name surname' or 'surname name' starts with provided\
          \ value. Minimum length: 3. Maximum length: 320"
        schema:
          maxLength: 320
          minLength: 3
          type: "string"
      - name: "uuid"
        in: "query"
        description: "List of user UUIDs. Filter value - equals. Allows multiple values.\
          \ Maximum allowed size: 25"
        schema:
          maxItems: 25
          minItems: 0
          type: "array"
          items:
            type: "string"
      - name: "page-key"
        in: "query"
        description: "Cursor-based Pagination - page-key. Cursor to the next page,\
          \ includes page number and filtering values. Implicit filtering values will\
          \ be overwritten by page-key property. Cursor-based Pagination can't be\
          \ used together with Offset-based Pagination! Max length: 2000"
        schema:
          maxLength: 2000
          minLength: 0
          type: "string"
      - name: "page"
        in: "query"
        description: "Offset-based Pagination - page. Default value: 1. Page number\
          \ to return. Offset-based Pagination can't be used with Cursor-based Pagination!"
        schema:
          type: "integer"
          format: "int64"
      - name: "pageSize"
        in: "query"
        description: "Pagination - page size. Default value: 1000. Minimum value:\
          \ 1. Maximum value: 1000"
        schema:
          maximum: 1000
          minimum: 1
          type: "integer"
          format: "int64"
          default: 1000
      responses:
        "401":
          description: "Authorization header is missing or is incorrect."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicExceptionMessage"
        "403":
          description: "Execution user is not allowed to perform the action."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicExceptionMessage"
        "429":
          description: "Too many requests have been sent - requests are throttled"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicExceptionThrottlingMessage"
        "200":
          description: "Users from the organizational level fetched successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestUserPublicListResponse"
        "404":
          description: "Calling user is not assigned to the requested account or requested\
            \ environment is not assigned to account that user is assigned to or the\
            \ 'level-id' does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicExceptionMessage"
      security:
      - ssoAuth:
        - "iam:users:read"
      - ssoBearerAuth: []
    post:
      tags:
      - "Users and Groups"
      summary: "Get active users from organizational level"
      description: "**Required scope:** iam:users:read<br/><br/>It is required to\
        \ provide either request body containing list of user UUIDs or partialString.\n\
        If both are provided then the result returns users meeting any of the provided\
        \ criteria.\nReturned users are first ordered by name and then by surname.\n\
        Authorization is based on an assignment of the calling user to the account\
        \ associated with the 'level-type' and 'level-id' For environment 'level-type'\
        \ user has to be assigned to account to which the environment is assigned,\
        \ user does not need any permissions in such environment"
      operationId: "getActiveUsersForOrganizationalLevelPOST"
      parameters:
      - name: "level-type"
        in: "path"
        description: "Allowed values: account, environment"
        required: true
        schema:
          maxLength: 100
          minLength: 0
          type: "string"
      - name: "level-id"
        in: "path"
        description: "Identifier of 'level-type'. Max allowed length is 36. For account\
          \ use its UUID. For environment 'level-type' user has to be assigned to\
          \ account to which the environment is assigned, user does not need any permissions\
          \ in such environment"
        required: true
        schema:
          maxLength: 36
          minLength: 0
          type: "string"
      - name: "partialString"
        in: "query"
        description: "Filter value - searches for users whose email contains provided\
          \ value AND users whose 'name surname' or 'surname name' starts with provided\
          \ value. Minimum length: 3. Maximum length: 320"
        schema:
          maxLength: 320
          minLength: 3
          type: "string"
      - name: "page-key"
        in: "query"
        description: "Cursor-based Pagination - page-key. Cursor to the next page,\
          \ includes page number and filtering values. Implicit filtering values will\
          \ be overwritten by page-key property. Cursor-based Pagination can't be\
          \ used together with Offset-based Pagination! Max length: 2000"
        schema:
          maxLength: 2000
          minLength: 0
          type: "string"
      - name: "page"
        in: "query"
        description: "Offset-based Pagination - page. Default value: 1. Page number\
          \ to return. Offset-based Pagination can't be used with Cursor-based Pagination!"
        schema:
          type: "integer"
          format: "int64"
      - name: "pageSize"
        in: "query"
        description: "Pagination - page size. Default value: 1000. Minimum value:\
          \ 1. Maximum value: 1000"
        schema:
          maximum: 1000
          minimum: 1
          type: "integer"
          format: "int64"
          default: 1000
      requestBody:
        description: "List of user UUIDs. Filter value - equals. Allows multiple values.\
