        "404":
          description: "The 'level-id' param does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicExceptionMessage"
      security:
      - ssoAuth:
        - "iam:service-users:use"
      - ssoBearerAuth: []
  /organizational-levels/{level-type}/{level-id}/groups:
    get:
      tags:
      - "Users and Groups"
      summary: "Get visible groups from organizational level"
      description: "**Required scope:** iam:groups:read<br/><br/>Providing value for\
