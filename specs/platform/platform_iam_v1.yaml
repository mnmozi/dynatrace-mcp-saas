        in: "path"
        required: true
        schema:
          type: "string"
      - name: "trust-policy-uuid"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "mapping-uuid"
        in: "path"
        required: true
        schema:
          type: "string"
      responses:
