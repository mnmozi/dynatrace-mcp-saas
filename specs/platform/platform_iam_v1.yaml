components:
  schemas:
    ErrorResponse:
      type: "object"
      properties:
        code:
          type: "integer"
          format: "int32"
        message:
          type: "string"
        details:
          $ref: "#/components/schemas/ErrorResponseDetails"
    ErrorResponseConstraintViolation:
      type: "object"
      properties:
        path:
          type: "string"
        message:
          type: "string"
        parameterLocation:
          type: "string"
    ErrorResponseDetails:
      type: "object"
      properties:
        missingScopes:
          type: "array"
          items:
            type: "string"
        constraintViolations:
          type: "array"
          items:
            $ref: "#/components/schemas/ErrorResponseConstraintViolation"
    PublicExceptionMessage:
      type: "object"
      properties:
        error:
          $ref: "#/components/schemas/ErrorResponse"
    ErrorThrottlingResponse:
      type: "object"
      properties:
        code:
          type: "integer"
          format: "int32"
        message:
          type: "string"
        retryAfterSeconds:
          type: "integer"
          format: "int32"
    PublicExceptionThrottlingMessage:
      type: "object"
      properties:
        error:
          $ref: "#/components/schemas/ErrorThrottlingResponse"
    RestUserPublic:
      required:
      - "email"
      - "uid"
      type: "object"
      properties:
        uid:
          type: "string"
        email:
          type: "string"
        name:
          type: "string"
        surname:
          type: "string"
        description:
          type: "string"
      description: "Collection containing the paginated result"
    RestUserPublicListResponse:
      type: "object"
      properties:
        results:
          type: "array"
          description: "Collection containing the paginated result"
          items:
            $ref: "#/components/schemas/RestUserPublic"
        nextPageKey:
          type: "string"
          description: "Key for requesting the next page of the result"
        totalCount:
          type: "integer"
          description: "Total count of records"
          format: "int64"
    SearchResult:
      type: "object"
      properties:
        results:
          type: "array"
          description: "Collection containing the paginated result"
          items:
            $ref: "#/components/schemas/ServiceUserDto"
        nextPageKey:
          type: "string"
          description: "Key for requesting the next page of the result"
        totalCount:
          type: "integer"
          description: "Total count of records"
          format: "int64"
    ServiceUserDto:
      type: "object"
      properties:
        uid:
          type: "string"
        email:
          type: "string"
        name:
          type: "string"
        surname:
          type: "string"
        description:
          type: "string"
        createdAt:
          type: "string"
          format: "date-time"
      description: "Collection containing the paginated result"
    RestGroupPublic:
      required:
      - "groupName"
      - "type"
      - "uuid"
      type: "object"
      properties:
        uuid:
          type: "string"
        groupName:
          type: "string"
        type:
          type: "string"
          enum:
          - "LOCAL"
          - "ALL_USERS"
          - "SCIM"
          - "SAML"
      description: "Collection containing the paginated result"
    RestGroupPublicListResponse:
      type: "object"
      properties:
        results:
          type: "array"
          description: "Collection containing the paginated result"
          items:
            $ref: "#/components/schemas/RestGroupPublic"
        nextPageKey:
          type: "string"
          description: "Key for requesting the next page of the result"
        totalCount:
          type: "integer"
          description: "Total count of records"
          format: "int64"
    RestWifClaimMapping:
      type: "object"
      properties:
        uuid:
          type: "string"
        claimName:
          type: "string"
        claimValue:
          type: "string"
        matchType:
          type: "string"
    RestWifServiceUserMapping:
      type: "object"
      properties:
        uuid:
          type: "string"
        serviceUserUuid:
          type: "string"
        environmentId:
          type: "string"
        scopes:
          type: "array"
          items:
            type: "string"
        status:
          type: "string"
        claimMappings:
          type: "array"
          items:
            $ref: "#/components/schemas/RestWifClaimMapping"
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
    RestWifClaimMappingForm:
      required:
      - "claimName"
      - "claimValue"
      - "matchType"
      type: "object"
      properties:
        claimName:
          maxLength: 256
          minLength: 0
          type: "string"
        claimValue:
          maxLength: 1024
          minLength: 0
          type: "string"
        matchType:
          minLength: 1
          pattern: "EXACT|GLOB"
          type: "string"
    RestWifServiceUserMappingForm:
      required:
      - "claimMappings"
      - "environmentId"
      - "scopes"
      - "serviceUserUuid"
      type: "object"
      properties:
        serviceUserUuid:
          minLength: 1
          type: "string"
        environmentId:
          maxLength: 256
          minLength: 0
          type: "string"
        scopes:
          minItems: 1
          type: "array"
          items:
            type: "string"
        claimMappings:
          minItems: 1
          type: "array"
          items:
            $ref: "#/components/schemas/RestWifClaimMappingForm"
    RestWifServiceUserMappingList:
      type: "object"
      properties:
        pageSize:
          type: "integer"
          format: "int64"
        pageNumber:
          type: "integer"
          format: "int64"
        total:
          type: "integer"
          format: "int64"
        results:
          type: "array"
          items:
            $ref: "#/components/schemas/RestWifServiceUserMappingListItem"
    RestWifServiceUserMappingListItem:
      type: "object"
      properties:
        uuid:
          type: "string"
        serviceUserUuid:
          type: "string"
        environmentId:
          type: "string"
        scopes:
          type: "array"
          items:
            type: "string"
        status:
          type: "string"
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
    RestWifServiceUserMappingPatchForm:
      required:
      - "status"
      type: "object"
      properties:
        status:
          minLength: 1
          pattern: "ACTIVE|INACTIVE"
          type: "string"
    RestWifTrustPolicy:
      type: "object"
      properties:
        uuid:
          type: "string"
        name:
          type: "string"
        issuerUrl:
          type: "string"
        issuerUrlHash:
          type: "string"
        jwksUri:
          type: "string"
        description:
          type: "string"
        audience:
          type: "string"
        status:
          type: "string"
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
        serviceUserMappings:
          type: "array"
          items:
            $ref: "#/components/schemas/RestWifServiceUserMapping"
    RestWifTrustPolicyForm:
      required:
      - "audience"
      - "issuerUrl"
      - "name"
      type: "object"
      properties:
        name:
          maxLength: 256
          minLength: 0
          type: "string"
        issuerUrl:
          maxLength: 2048
          minLength: 0
          type: "string"
        jwksUri:
          maxLength: 2048
          minLength: 0
          type: "string"
        audience:
          maxLength: 512
          minLength: 0
          type: "string"
        description:
          maxLength: 1024
          minLength: 0
          type: "string"
    RestWifTrustPolicyList:
      type: "object"
      properties:
        pageSize:
          type: "integer"
          format: "int64"
        pageNumber:
          type: "integer"
          format: "int64"
        total:
          type: "integer"
          format: "int64"
        results:
          type: "array"
          items:
            $ref: "#/components/schemas/RestWifTrustPolicyListItem"
    RestWifTrustPolicyListItem:
      type: "object"
      properties:
        uuid:
          type: "string"
        name:
          type: "string"
        issuerUrl:
          type: "string"
        audience:
          type: "string"
        status:
          type: "string"
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
    RestWifTrustPolicyPatchForm:
      required:
      - "status"
      type: "object"
      properties:
        status:
          minLength: 1
          pattern: "ACTIVE|INACTIVE"
          type: "string"
  securitySchemes:
    ssoAuth:
      type: "oauth2"
      description: "This API uses oauth2 with the 'client credentials' flow."
      flows:
        clientCredentials:
          tokenUrl: "https://sso-sprint.dynatracelabs.com/sso/oauth2/token"
          scopes:
            iam:users:read: "Scope for reading users"
            iam:groups:read: "Scope for reading groups"
            iam:service-users:use: "Scope for reading service users"
    ssoBearerAuth:
      type: "http"
      scheme: "bearer"
      description: "The value can be either an OAuth2 access token or a platform token.</br>\
        \ For further information about platform tokens see <a href=\"https://dt-url.net/platform-tokens\"\
        \ target=\"_blank\">Platform tokens - Dynatrace Docs</a>."
