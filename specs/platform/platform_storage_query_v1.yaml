              schema:
                $ref: "#/components/schemas/DQLNode"
          description: "A node containing more nodes,  a node offering different (semantically\
            \ equivalent) versions of the query parts, or a terminal node that shows\
            \ the canonical form."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
