  /query:poll:
    get:
      description: "For information about the required permissions see the [Bucket\
        \ and table permissions in Grail documentation](https://docs.dynatrace.com/docs/shortlink/assign-bucket-table-permissions).\
        \ \n\n### Overview:\n\nPolls the status of a Grail query. Returns the status\
        \ of the query, including the result if the query finished.\n\n### The response\
        \ format:\nThe json response will contain the state of the query. If the query\
        \ succeeded, the result will be included.\n\nThe result has two main sections:\n\
        * The 'records' section contains the individual records, where each record\
        \ consists of a set of fields and their corresponding values.\n* The 'types'\
        \ section describes the corresponding data types that a record field has.\n\
        \nEvery record has an implicit 'index' according to the position in the 'records'\
        \ JSON array.\nThe types section has a list of 1..N possible type 'buckets'.\
        \ Each such bucket has an 'indexRange' which indicates which\nrecords will\
        \ find their field types in which bucket. The index range has two values start\
        \ & end and can be thought of as [startIndex, endIndex).\n\nA field part of\
        \ a record with index 'i' will find its corresponding field type by first\
        \ locating the bucket that satisfies:\n\n```text\nstartIndex <= i <= endIndex\n\
        ```\n\nOnce the bucket is found the 'mappings' object has an entry for all\
        \ the fields that are part of that record with index 'i'.\n\n\nSince enforcement\
        \ of a particular schema is absent at ingestion time, it is possible to have\
        \ records that share the same\nfield name but their values are of a different\
        \ type. This phenomenon will hence forth be named as a **\"collision\"**.\n\
        When a collision does occur, we will create a new type 'bucket' that will\
        \ have a different index range where\nthe new record field types will be placed.\n\
        It is guaranteed that every field of every record will have a corresponding\
        \ type.\n**Clients should always take the included types into account when\
        \ consuming records!**"
      operationId: "query:poll"
      parameters:
      - description: "The request-token of the query."
        examples:
          request-token:
            description: "request-token"
            value: "HKsGJwblS6mSwDn0WbzSsQ=="
