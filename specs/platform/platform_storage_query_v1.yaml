        \ \n\n## Overview\n\nWe provide a list of suggestions that may be used after\
        \ the cursor position. The following queries will all provide the\nsame results:\n\
        \n* `query: \"f\"`\n* `query: \"f\", cursorPosition:1`\n* `query: \"fetch\
        \ \", cursorPosition:1`\n\nAvailable fields:\n\n| Field       | Description\
        \                                                                        \
        \                                                                        \
        \                             |\n|-------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|\n\
        | suggestions | a list of suggestions. Each item is a separate possible suggestion,\
        \ despite they might have the same outputs.                              \
        \                                             |\n| optional    | whether the\
        \ suggestion is optional. If `true`, the query until the cursor position might\
        \ work. If `false`, the query is definitely incomplete or invalid if cut at\
        \ the cursor position. |\n\nFields in the `suggestions`\n\n| Field       \
        \           | Description                                                \
        \                                                |\n|------------------------|------------------------------------------------------------------------------------------------------------|\n\
        | suggestion             | a string representing the whole suggestion. This\
        \ information could also be derived from the parts.         |\n| alreadyTypedCharacters\
        \ | how many characters of this suggestion have already been typed (and will\
        \ be overridden by the suggestion). |\n| parts                  | a list of\
        \ semantically enriched information on what are the parts of a suggestion.\
        \                         |\n\nFields in `parts`\n\n| Field      | Description\
        \                                               |\n|------------|-----------------------------------------------------------|\n\
        | suggestion | a string representing the current part of the suggestion. |\n\
        | type       | current types: SPACE, PIPE, COMMAND (may be extended)     |\n\
        \nThe `type` helps to treat specific parts of the suggestion different to\
        \ others; either by a different visualization,  \na link to docs, etc."
