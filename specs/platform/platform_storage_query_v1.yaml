                                  isOptional: true
                                  nodeType: "CONTAINER"
                                  type: "PARAMETER_NAMING"
                              nodeType: "ALTERNATIVE"
                            - children:
                              - canonicalString: "logs"
                                nodeType: "TERMINAL"
                                tokenPosition:
                                  end:
                                    column: 19
