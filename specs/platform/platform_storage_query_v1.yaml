  /query:cancel:
    post:
      description: "For information about the required permissions see the [Bucket\
        \ and table permissions in Grail documentation](https://docs.dynatrace.com/docs/shortlink/assign-bucket-table-permissions).\
        \ \n\n### Overview:\n\nCancels a running Grail query and returns a list of\
        \ records if the query already finished.\n\n### The response format:\n\nIf\
        \ the query was already finished, a response body including the result will\
        \ be returned. Otherwise the response will contain no body.\n\nThe result\
        \ has three main sections:\n* the 'records' section contains the individual\
        \ records, where each record consists of a set of fields and their corresponding\
        \ values.\n* the 'types' section describes the corresponding data types that\
        \ a record field has.\n* the 'metadata' section contains information about\
        \ the query like 'analysisTimeframe', 'timezone' or 'locale'.\n\nEvery record\
        \ has an implicit 'index' according to the position in the 'records' JSON\
        \ array.\nThe types section has a list of 1..N possible type 'buckets'. Each\
        \ such bucket has an 'indexRange' which indicates which\nrecords will find\
        \ their field types in which bucket. The index range has two values start\
        \ & end and can be thought of as [startIndex, endIndex).\n\nA field part of\
        \ a record with index 'i' will find its corresponding field type by first\
        \ locating the bucket that satisfies:\n\n```text\nstartIndex <= i <= endIndex\n\
        ```\n\nOnce the bucket is found the 'mappings' object has an entry for all\
        \ the fields that are part of that record with index 'i'.\n\n\nSince enforcement\
        \ of a particular schema is absent at ingestion time, it is possible to have\
        \ records that share the same\nfield name but their values are of a different\
        \ type. This phenomenon will hence forth be named as a **\"collision\"**.\n\
        When a collision does occur, we will create a new type 'bucket' that will\
        \ have a different index range where\nthe new record field types will be placed.\n\
        It is guaranteed that every field of every record will have a corresponding\
        \ type.\n**Clients should always take the included types into account when\
        \ consuming records!**"
      operationId: "query:cancel"
      parameters:
      - description: "The request-token of the query."
        examples:
          request-token:
            description: "request-token"
            value: "HKsGJwblS6mSwDn0WbzSsQ=="
        explode: false
        in: "query"
        name: "request-token"
        required: true
        schema:
          type: "string"
        style: "form"
      - description: "If set additional data will be available in the metadata section."
        example: "metric-metadata"
        in: "query"
        name: "enrich"
        schema:
          type: "string"
      - $ref: "#/components/parameters/ClientContextHeader"
      responses:
