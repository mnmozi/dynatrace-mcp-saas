  /query:parse:
    post:
      description: "For information about the required permissions see the [Bucket\
        \ and table permissions in Grail documentation](https://docs.dynatrace.com/docs/shortlink/assign-bucket-table-permissions).\
        \ \n\n## Overview\n\nReturns the parsed query as a tree, containing the structure\
        \ of the canonical query. Tree-nodes can contain references to\nthe token\
        \ position where they originate from. This may help to provide hover effects,\
        \ show canonical forms, mark\noptional items, and more.\n\n## Details\n\n\
        The query tree consists of nodes that contain different additional information\
        \ (everything optional):\n\n### General Fields\n\nField | Mandatory |  Description\n\
        ----------------------- | --- | ----------------------------------------------------------------------------------------\n\
        tokenPosition           | no  | optional. If present, it represents the position\
        \ within the query string where the node refers to.\nisOptional          \
        \    | no  | whether this node could be left out and the result would still\
        \ be the same query (semantically).\n\n#### tokenPosition\n\ncontains `start`\
        \ (inclusive) and `end` (inclusive), both contain `index` (0 based; fur substrings),\
        \ `line`\nand `column` (both 1-based; for readability).\n\n* If `tokenPosition`\
        \ is present, it always contains start and end with all fields\n* If `tokenPosition`\
        \ is not present, there might still be nested nodes that do contain a position\n\
        * If `start == end`, the position refers to a single character\n* If `start\
        \ > end`, we know for sure that something was inserted.\n\nWe can always check\
        \ whether the canonical representation of a node matches the text in the tokenPosition\
        \ to see whether\nsomething was inserted, removed, or changed.\n\n#### isOptional\n\
        \nonly present if it is true.\n\nOptional nodes can e.g. be optional braces\
        \ that make a query more readable, but are not necessary. This could be used\
        \ to\nenter *ghost braces* and *implicit functions* in the user's input field;\
        \ maybe with different formatting\n(using the tokenPosition of sibling nodes\
        \ we can also check whether the user wrote these or not).\n\n### Advanced\
        \ Token Types\n\neach node is of one of following types and may contain more\
        \ fields:\n\n* Terminal Node\n* ContainerNode\n* Alternative Node\n\n####\
        \ Terminal Node\n\ncan be identified by checking whether `canonicalString`\
        \ is present\n\nField | Mandatory |  Description\n------------------------\
        \ | --- | ---------------------------------------------------------------------------------------\n\
        type                     | yes | the type of the terminal node - do not confuse\
        \ with the type of container nodes\ncanonicalString          | yes | the canonical\
        \ string representation. Concatenating the canonicalString of all nested terminal\
        \ nodes provides the canonical form of the query.\nisMandatoryOnUserOrder\
        \   | no  | may only be present if (`type=\"BRACE_OPEN\"` or `type=\"BRACE_CLOSE\"\
        `) and `isOptional=true`. For usage see section [Special node type: PARAMETERS](#special-node-type-parameters)\n\
        \n##### Current types of terminal nodes (list might grow):\n\n* SPACE\n* LINEBREAK\n\
        * INDENT\n* PIPE\n* DOT\n* COLON\n* COMMA\n* BRACE_OPEN\n* BRACE_CLOSE\n*\
        \ BRACKET_OPEN\n* BRACKET_CLOSE\n* PARENTHESIS_OPEN\n* PARENTHESIS_CLOSE\n\
        * QUOTE\n* SLASH\n* BOOLEAN_TRUE\n* BOOLEAN_FALSE\n* NULL\n* COMMAND_NAME\n\
        * PARAMETER_KEY\n* PARAMETER_VALUE_SCOPE\n* FUNCTION_NAME\n* OPERATOR\n* TRAVERSAL_OPERATOR\n\
        * TRAVERSAL_RELATION_NAME\n* TRAVERSAL_HOP_COUNT\n* SIMPLE_IDENTIFIER\n* NUMBER\n\
        * STRING\n* TIME_UNIT\n* TIMESTAMP_VALUE\n* METRIC_KEY\n* VARIABLE\n\n####\
        \ ContainerNode\n\ncan be identified by checking whether `children` is present\n\
        \nField | Mandatory |  Description\n----------------------- | --- | ----------------------------------------------------------------------------------------\n\
        type                    | yes | the type of the container node - do not confuse\
        \ with the type of terminal nodes\nchildren                | yes | the children\
        \ for the node. might be of any type\n\n##### Current types of container nodes\
        \ (list might grow):\n\n* QUERY\n* EXECUTION_BLOCK\n* COMMAND\n* COMMAND_SEPARATOR\n\
        * PARAMETER_WITH_KEY\n* GROUP\n* PARAMETERS - check examples further down\n\
        * PARAMETER_NAMING\n* PARAMETER_SEPARATOR\n* FUNCTION\n* FUNCTION_PART - check\
        \ examples further down\n* EXPRESSION\n* IDENTIFIER\n* SOURCE_ID\n* DURATION\n\
        * TIMESTAMP\n* TIMEFRAME\n* TRAVERSAL_PATH\n* TRAVERSAL_STEP\n\n##### Special\
        \ node type: PARAMETERS\n\ncan contain children representing the parameters.\
        \ Every second child is of type PARAMETER_SEPARATOR.\n\nYou may reorder the\
        \ children based on their tokenPosition to get the user order. However, in\
        \ this case, \nyou need to consider `isMandatoryOnUserOrder` to determine\
        \ whether the grouping braces are mandatory or not.\n\n###### Example \n\n\
        For the query `SORT a, {direction:\"descending\", b}`, the canonical form\
        \ is:\n\n`SORT a, {b, direction:\"descending\"}`\n\nThis is the order, in\
        \ which the parameters are returned in the query tree.\nParameters are {a}\
        \ and {{b} and {direction:\"descending\"}}. In this case, the braces are optional.\n\
        \n`SORT a, {b, direction:\"descending\"}` is equivalent to `SORT a, b, direction:\"\
        descending\"`\n\nHowever, if you reorder the children by tokenPosition, the\
        \ braces are not optional, because\n\n`SORT a, direction:\"descending\", b`\
        \ is interpreted as `SORT {a, direction:\"descending\"}, b`\n\nSo, if the\
        \ children in PARAMETERS are re-ordered by tokenPosition, braces (or in general:\
        \ TerminalNodes)\nare only optional if `isOptional && !isMandatoryOnUserOrder`.\n\
        \n##### Special node type: FUNCTION_PART\n\nA container node of type `FUNCTION`\
        \ may contain nodes of type `FUNCTION_PART`.\n\nIf those `FUNCTION_PART`s\
        \ are marked as optional, this means you have to either include *all* or *none*\
        \ of these\noptional function parts.\n\n*Example*:\n\n`filter anyMatch(a.b\
        \ == 1, input:a)`\n\nThe optional function parts are `anyMatch(` and `, input:a)`.\
        \ If you leave out both, the command will still work:\n`filter a.b == 1` and\
        \ return the same result. Using one of these optional function parts and removing\
        \ the other will lead\nto an invalid query.\n\n#### Alternative Node\n\ncan\
        \ be identified by checking whether `alternatives` is present\n\nField | Mandatory\
        \ |  Description\n----------------------- | --- | ----------------------------------------------------------------------------------------\n\
        alternatives            | yes | Type: Map&lt;AlternativeType, DQLNode&gt;\n\
        \nWhen displaying the query, pick one option. You may use the other options\
        \ for hovering, replacing, and more.\n\n##### Current values of AlternativeType\
        \ (list might grow):\n\n* CANONICAL: This node is the one we will use for\
        \ our canonical form\n* USER: An alternative that is also valid, but not canonical;\
        \ and this version was picked by the user.\n* INFO: only if the canonical\
        \ version is not present\n\n*Examples*:\n\n* `CANONICAL` is not present, `USER`\
        \ is present: user's nodes are optional, but not canonical (usually optional\
        \ nodes\n  are still canonical)\n* `CANONICAL` is present, `USER` is not present:\
        \ same as if the canonical node was optional. If this happens, it is\n  likely\
        \ that there is also an `INFO` node\n* `CANONICAL` is present, `USER` is present:\
        \ there are different alternatives\n* `INFO` is present: usually if `CANONICAL`\
        \ is not present (e.g. the parameter key for `FILTER a == 1`), there is an\
        \ info node\n  for `FILTER condition:a == 1`. This `condition:` was neither\
        \ written by the user nor is it canonical; but it might be\n  used to help\
        \ the user understand what this parameter means."
      operationId: "query:parse"
      parameters:
      - $ref: "#/components/parameters/ClientContextHeader"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseRequest"
        description: "All parameters have to be passed via JSON in the POST body."
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                Query tree for query with non-canonical parameter names:
                  description: "Query tree for `fetch sourceId:logs`\nThe example\
                    \ shows how the canonical form handles non-canonical parameter\
                    \ naming\n(in this case the canonical form would be `fetch logs`\
                    \ only)."
                  value:
                    children:
                    - children:
                      - canonicalString: "fetch"
                        nodeType: "TERMINAL"
                        tokenPosition:
                          end:
                            column: 5
                            index: 4
                            line: 1
                          start:
                            column: 1
                            index: 0
                            line: 1
                        type: "COMMAND_NAME"
                      - canonicalString: " "
                        nodeType: "TERMINAL"
                        type: "SPACE"
                      - children:
                        - children:
                          - children:
                            - alternatives:
                                INFO:
                                  children:
                                  - canonicalString: "sourceId"
                                    nodeType: "TERMINAL"
                                    tokenPosition:
                                      end:
                                        column: 14
                                        index: 13
                                        line: 1
                                      start:
                                        column: 7
                                        index: 6
                                        line: 1
                                    type: "PARAMETER_KEY"
                                  - canonicalString: ":"
                                    nodeType: "TERMINAL"
                                    type: "COLON"
                                  isOptional: true
                                  nodeType: "CONTAINER"
                                  type: "PARAMETER_NAMING"
                                USER:
                                  children:
                                  - canonicalString: "sourceId"
                                    nodeType: "TERMINAL"
                                    tokenPosition:
                                      end:
                                        column: 14
                                        index: 13
                                        line: 1
                                      start:
                                        column: 7
                                        index: 6
                                        line: 1
                                    type: "PARAMETER_KEY"
                                  - canonicalString: ":"
                                    nodeType: "TERMINAL"
