      - "createdBy"
      - "createdTime"
      - "lastModifiedBy"
      - "lastModifiedTime"
      example:
        createdBy: "123e4567-e89b-12d3-a456-426614174000"
        createdTime: "2022-05-25T10:24:04.202Z"
        lastModifiedBy: "123e4567-e89b-12d3-a456-426614174000"
        lastModifiedTime: "2022-05-25T10:24:04.202Z"
    OptimisticLockingVersion:
      type: "string"
      readOnly: true
    Targeting:
      type: "string"
      description: "Conditions in json logic when the feature flag shall be applied.\
        \ The following limitations apply:\n  - The `in` operator can contain up to\
        \ 300 values.\n  - There can be up to a total of 20\n    [operators](https://flagd.dev/reference/flag-definitions/#operations)\
        \ or\n    [conditions](https://flagd.dev/reference/flag-definitions/#conditions).\n\
        \  - Keys and values can have up to 100 characters each.\n"
      example: "{\"if\":[{\"==\":[{\"var\":[\"color\"]},\"yellow\"]},\"on\",null]}"
    DefaultVariant:
      type: "string"
      description: "The default variant used when no targeting condition matches.\
        \ If not set, the evaluation should fall back to the fallback value defined\
        \ in code when evaluating this flag.\n"
    Pagination:
      type: "object"
      readOnly: true
      properties:
        nextPageKey:
          type: "integer"
        totalCount:
          type: "integer"
    ResourceContext:
      type: "object"
      readOnly: true
      properties:
        operations:
          type: "array"
          items:
            type: "string"
            enum:
            - "write"
            - "delete"
    Error:
      type: "object"
      required:
      - "error"
      properties:
        error:
          $ref: "#/components/schemas/ErrorInfo"
    ErrorInfo:
      type: "object"
      required:
      - "code"
      - "message"
      properties:
        code:
          type: "integer"
          format: "int32"
        message:
          type: "string"
        details:
