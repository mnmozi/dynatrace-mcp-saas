      description: "A context attribute can be used in targeting rules like a variable."
      required:
      - "name"
      - "type"
      properties:
        name:
          type: "string"
        description:
          type: "string"
        type:
          $ref: "#/components/schemas/ContextType"
    ContextDetails:
      allOf:
