          $ref: "#/components/schemas/ModificationInfo"
        resourceContext:
          $ref: "#/components/schemas/ResourceContext"
        version:
          $ref: "#/components/schemas/OptimisticLockingVersion"
    FeatureFlagStageDefinition:
      description: "A feature flag stage definition is a stage specific configuration\
        \ of a feature flag definition."
      properties:
        defaultVariant:
          $ref: "#/components/schemas/DefaultVariant"
        enabled:
          type: "boolean"
          default: false
