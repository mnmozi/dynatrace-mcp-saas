openapi: "3.0.3"
info:
  version: "0.3.3"
  title: "Feature Flag Management API"
  description: "Management APIs for Feature Flag data"
servers:
- url: "https://asn8731h.sprint.apps.dynatracelabs.com/platform/feature-flag-management/v0.3"
  x-api-gateway-url: "/platform/feature-flag-management/v0.3"
paths:
  /projects:
    get:
      summary: "List projects"
      operationId: "listProjects"
      tags:
      - "Projects"
      security:
      - ssoAuth:
        - "feature-flag:projects:read"
      - ssoBearerAuth: []
      parameters:
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/pageSize"
      - $ref: "#/components/parameters/AddFields"
      responses:
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/InternalServerError"
        "200":
          description: "A paged array of projects"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "400":
          $ref: "#/components/responses/BadRequestError"
      description: "**Required scope:** feature-flag:projects:read"
  /projects/{projectId}:
    get:
      summary: "Get a project"
      operationId: "getProject"
      tags:
      - "Projects"
      security:
      - ssoAuth:
        - "feature-flag:projects:read"
      - ssoBearerAuth: []
      parameters:
      - $ref: "#/components/parameters/projectIdPathParam"
      - $ref: "#/components/parameters/AddFields"
      responses:
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/InternalServerError"
        "200":
          description: "The project configuration"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetails"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
      description: "**Required scope:** feature-flag:projects:read"
    put:
      summary: "Create or update a project"
      operationId: "storeProject"
      tags:
      - "Projects"
      security:
      - ssoAuth:
        - "feature-flag:projects:write"
      - ssoBearerAuth: []
      parameters:
      - $ref: "#/components/parameters/projectIdPathParam"
      - $ref: "#/components/parameters/optimisticLockingVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Project"
      responses:
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/InternalServerError"
        "200":
          description: "The project has been updated successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetails"
        "201":
          description: "The project has been created successfully."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetails"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
      description: "**Required scope:** feature-flag:projects:write"
    delete:
      summary: "Delete a project"
      description: "**Required scope:** feature-flag:projects:delete<br/><br/>Deletes\
        \ the specified project."
      operationId: "deleteProject"
      tags:
      - "Projects"
      security:
      - ssoAuth:
        - "feature-flag:projects:delete"
      - ssoBearerAuth: []
      parameters:
      - $ref: "#/components/parameters/projectIdPathParam"
      - $ref: "#/components/parameters/optimisticLockingVersion"
      responses:
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/InternalServerError"
        "204":
          description: "The project was deleted successfully"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /stages:
    get:
      summary: "List stages"
      operationId: "listStages"
      tags:
      - "Stages"
      security:
      - ssoAuth:
        - "feature-flag:projects:read"
      - ssoBearerAuth: []
      parameters:
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/pageSize"
      - $ref: "#/components/parameters/AddFields"
      responses:
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/InternalServerError"
        "200":
          description: "A paged array of stages"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageList"
        "400":
          $ref: "#/components/responses/BadRequestError"
      description: "**Required scope:** feature-flag:projects:read"
  /stages/{stageId}:
    get:
      summary: "Get a stage"
      operationId: "getStage"
      tags:
      - "Stages"
      security:
      - ssoAuth:
        - "feature-flag:projects:read"
      - ssoBearerAuth: []
      parameters:
      - $ref: "#/components/parameters/stageIdPathParam"
      - $ref: "#/components/parameters/AddFields"
      responses:
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/InternalServerError"
        "200":
          description: "The stage configuration"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageDetails"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
      description: "**Required scope:** feature-flag:projects:read"
    put:
      summary: "Create or update a stage"
      operationId: "storeStage"
      tags:
      - "Stages"
      security:
      - ssoAuth:
        - "feature-flag:stages:write"
      - ssoBearerAuth: []
      parameters:
      - $ref: "#/components/parameters/stageIdPathParam"
      - $ref: "#/components/parameters/optimisticLockingVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Stage"
      responses:
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/InternalServerError"
        "200":
          description: "The stage has been updated successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageDetails"
        "201":
          description: "The stage has been created successfully."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageDetails"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
      description: "**Required scope:** feature-flag:stages:write"
    delete:
      summary: "Delete a stage"
      description: "**Required scope:** feature-flag:stages:delete<br/><br/>Deletes\
        \ the specified stage if it is not linked to a project."
      operationId: "deleteStage"
      tags:
      - "Stages"
      security:
      - ssoAuth:
        - "feature-flag:stages:delete"
      - ssoBearerAuth: []
      parameters:
      - $ref: "#/components/parameters/stageIdPathParam"
      - $ref: "#/components/parameters/optimisticLockingVersion"
      responses:
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/InternalServerError"
        "204":
          description: "The stage was deleted successfully"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "400":
          $ref: "#/components/responses/BadRequestError"
  /projects/{projectId}/contexts:
    get:
      summary: "List context attributes"
      description: "**Required scope:** feature-flag:projects:read<br/><br/>List context\
        \ attributes for the given project."
      operationId: "listContexts"
      tags:
      - "Contexts"
      security:
      - ssoAuth:
        - "feature-flag:projects:read"
      - ssoBearerAuth: []
      parameters:
      - $ref: "#/components/parameters/projectIdPathParam"
      - $ref: "#/components/parameters/AddFields"
      responses:
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/InternalServerError"
        "200":
          description: "An array of context attributes"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextList"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /projects/{projectId}/contexts/{contextId}:
    get:
      summary: "Get a context attribute"
      description: "**Required scope:** feature-flag:projects:read<br/><br/>Returns\
        \ a context attribute for the given project."
      operationId: "getContext"
      tags:
      - "Contexts"
      security:
      - ssoAuth:
        - "feature-flag:projects:read"
      - ssoBearerAuth: []
      parameters:
      - $ref: "#/components/parameters/projectIdPathParam"
      - $ref: "#/components/parameters/contextIdPathParam"
      - $ref: "#/components/parameters/AddFields"
      responses:
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/InternalServerError"
        "200":
          description: "The context configuration"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextDetails"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    put:
      summary: "Create or update a context"
      description: "**Required scope:** feature-flag:context-attributes:write<br/><br/>Creates\
        \ or updates a context attribute from the given project."
      operationId: "storeContext"
      tags:
      - "Contexts"
      security:
      - ssoAuth:
        - "feature-flag:context-attributes:write"
      - ssoBearerAuth: []
      parameters:
      - $ref: "#/components/parameters/projectIdPathParam"
      - $ref: "#/components/parameters/contextIdPathParam"
      - $ref: "#/components/parameters/optimisticLockingVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Context"
      responses:
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/InternalServerError"
        "200":
          description: "The context has been updated successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextDetails"
        "201":
          description: "The context has been created successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextDetails"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
    delete:
      summary: "Delete a context"
      description: "**Required scope:** feature-flag:context-attributes:delete<br/><br/>Deletes\
        \ the specified context."
      operationId: "deleteContext"
      tags:
      - "Contexts"
      security:
      - ssoAuth:
        - "feature-flag:context-attributes:delete"
      - ssoBearerAuth: []
      parameters:
      - $ref: "#/components/parameters/projectIdPathParam"
      - $ref: "#/components/parameters/contextIdPathParam"
      - $ref: "#/components/parameters/optimisticLockingVersion"
      responses:
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/InternalServerError"
        "204":
          description: "The context was deleted successfully"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
  /projects/{projectId}/feature-flags:
    get:
      summary: "List feature flag definitions"
      description: "**Required scope:** feature-flag:feature-flags:read<br/><br/>Lists\
        \ all feature flag definitions for the given project."
      operationId: "listFeatureFlagDefinitions"
      tags:
      - "Feature Flags"
      security:
      - ssoAuth:
        - "feature-flag:feature-flags:read"
      - ssoBearerAuth: []
      parameters:
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/pageSize"
      - $ref: "#/components/parameters/projectIdPathParam"
      - $ref: "#/components/parameters/AddFields"
      responses:
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/InternalServerError"
        "200":
          description: "A paged array of feature flag definitions."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureFlagDefinitionList"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /projects/{projectId}/feature-flags/{featureFlagId}:
    get:
      summary: "Get a feature flag definition"
      description: "**Required scope:** feature-flag:feature-flags:read<br/><br/>Returns\
        \ a feature flag definition from the given project."
      operationId: "getFeatureFlagDefinition"
      tags:
      - "Feature Flags"
      security:
      - ssoAuth:
        - "feature-flag:feature-flags:read"
      - ssoBearerAuth: []
      parameters:
      - $ref: "#/components/parameters/projectIdPathParam"
      - $ref: "#/components/parameters/featureFlagIdPathParam"
      - $ref: "#/components/parameters/AddFields"
      responses:
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/InternalServerError"
        "200":
          description: "The feature flag definition configuration"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureFlagDefinitionDetails"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    put:
      summary: "Create or update a feature flag definition"
      description: "**Required scope:** feature-flag:feature-flags:write<br/><br/>Updates\
        \ a feature flag definition from the given project. The following limitations\
        \ apply:\n  - There can be up to 30 variants.\n  - The `in` operator can contain\
        \ up to 300 values.\n  - There can be up to a total of 20\n    [operators](https://flagd.dev/reference/flag-definitions/#operations)\
        \ or\n    [conditions](https://flagd.dev/reference/flag-definitions/#conditions).\n\
        \  - Keys and values can have up to 100 characters each.\n"
      operationId: "storeFeatureFlagDefinition"
      tags:
      - "Feature Flags"
      security:
      - ssoAuth:
        - "feature-flag:feature-flags:write"
      - ssoBearerAuth: []
      parameters:
      - $ref: "#/components/parameters/projectIdPathParam"
      - $ref: "#/components/parameters/featureFlagIdPathParam"
      - $ref: "#/components/parameters/optimisticLockingVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeatureFlagDefinition"
      responses:
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/InternalServerError"
        "200":
          description: "The feature flag definition has been updated successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureFlagDefinitionDetails"
        "201":
          description: "The feature flag definition has been created successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureFlagDefinitionDetails"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
    delete:
      summary: "Delete a feature flag definition"
      description: "**Required scope:** feature-flag:feature-flags:delete<br/><br/>Deletes\
        \ a feature flag definition from the given project. The feature flag to delete\
        \ must not be active in any stages.\n"
      operationId: "deleteFeatureFlagDefinition"
      tags:
      - "Feature Flags"
      security:
      - ssoAuth:
        - "feature-flag:feature-flags:delete"
      - ssoBearerAuth: []
      parameters:
      - $ref: "#/components/parameters/projectIdPathParam"
      - $ref: "#/components/parameters/featureFlagIdPathParam"
      - $ref: "#/components/parameters/optimisticLockingVersion"
      responses:
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/InternalServerError"
        "204":
          description: "The feature flag definition was deleted successfully"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
  /projects/{projectId}/stages:
    get:
      summary: "List stages linked to a project"
      description: "**Required scope:** feature-flag:projects:read<br/><br/>List stages\
        \ linked to a project"
      operationId: "listProjectStageLinks"
      tags:
      - "Projects"
      security:
      - ssoAuth:
        - "feature-flag:projects:read"
      - ssoBearerAuth: []
      parameters:
      - $ref: "#/components/parameters/projectIdPathParam"
      - $ref: "#/components/parameters/AddFields"
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/pageSize"
      responses:
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/InternalServerError"
        "200":
          description: "An array of stages."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageList"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /projects/{projectId}/stages/{stageId}:
    delete:
      summary: "Unlinks a stage from a project"
      operationId: "deleteProjectStageLink"
      tags:
      - "Projects"
      security:
      - ssoAuth:
        - "feature-flag:projects:write"
      - ssoBearerAuth: []
      parameters:
      - $ref: "#/components/parameters/projectIdPathParam"
      - $ref: "#/components/parameters/stageIdPathParam"
      responses:
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/InternalServerError"
        "204":
          description: "The project stage link was deleted successfully"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
      description: "**Required scope:** feature-flag:projects:write"
    put:
      summary: "Links a stage to a project"
      operationId: "createProjectStageLink"
      tags:
      - "Projects"
      security:
      - ssoAuth:
        - "feature-flag:projects:write"
      - ssoBearerAuth: []
      parameters:
      - $ref: "#/components/parameters/projectIdPathParam"
      - $ref: "#/components/parameters/stageIdPathParam"
      responses:
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/InternalServerError"
        "201":
          description: "The stage was successfully linked to the project"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
      description: "**Required scope:** feature-flag:projects:write"
  /projects/{projectId}/stages/{stageId}/feature-flags:
    get:
      summary: "List feature flag stage definitions"
      description: "**Required scope:** feature-flag:feature-flags:read<br/><br/>List\
        \ feature flag stage definitions that are defined in the specified stage of\
        \ the given project."
      operationId: "listFeatureFlagStageDefinitions"
      tags:
      - "Feature Flags Stage Definition"
      security:
      - ssoAuth:
        - "feature-flag:feature-flags:read"
      - ssoBearerAuth: []
      parameters:
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/pageSize"
      - $ref: "#/components/parameters/projectIdPathParam"
      - $ref: "#/components/parameters/stageIdPathParam"
      - $ref: "#/components/parameters/AddFields"
      responses:
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/InternalServerError"
        "200":
          description: "A paged array of feature flag stage definitions."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureFlagStageDefinitionList"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /projects/{projectId}/stages/{stageId}/feature-flags/{featureFlagId}:
    get:
      summary: "Get a feature flag stage definition"
      description: "**Required scope:** feature-flag:feature-flags:read<br/><br/>Get\
        \ the feature flag's configuration defined in the specified stage of the given\
        \ project."
      operationId: "getFeatureFlagStageDefinition"
      tags:
      - "Feature Flags Stage Definition"
      security:
      - ssoAuth:
        - "feature-flag:feature-flags:read"
      - ssoBearerAuth: []
      parameters:
      - $ref: "#/components/parameters/projectIdPathParam"
      - $ref: "#/components/parameters/stageIdPathParam"
      - $ref: "#/components/parameters/featureFlagIdPathParam"
      - $ref: "#/components/parameters/AddFields"
      responses:
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/InternalServerError"
        "200":
          description: "The feature flag stage definition configuration"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureFlagStageDefinitionDetails"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    put:
      summary: "Create or update a feature flag stage definition"
      description: "**Required scope:** feature-flag:feature-flags:write<br/><br/>Create\
        \ or update the feature flag's configuration defined in the specified stage\
        \ of the given project."
      operationId: "storeFeatureFlagStageDefinition"
      tags:
      - "Feature Flags Stage Definition"
      security:
      - ssoAuth:
        - "feature-flag:feature-flags:write"
      - ssoBearerAuth: []
      parameters:
      - $ref: "#/components/parameters/optimisticLockingVersion"
      - $ref: "#/components/parameters/projectIdPathParam"
      - $ref: "#/components/parameters/stageIdPathParam"
      - $ref: "#/components/parameters/featureFlagIdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeatureFlagStageDefinition"
      responses:
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/InternalServerError"
        "200":
          description: "The feature flag stage definition has been updated successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureFlagStageDefinitionDetails"
        "201":
          description: "The feature flag stage definition has been created successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureFlagStageDefinitionDetails"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
    delete:
      summary: "Delete a feature flag stage definition"
      description: "**Required scope:** feature-flag:feature-flags:delete<br/><br/>Deletes\
        \ the feature flag's configuration defined in the specified stage of the given\
        \ project. If a feature flag is requested for this stage after deletion it\
        \ will fall back to the flag's definition on project level."
      operationId: "deleteFeatureFlagStageDefinition"
      tags:
      - "Feature Flags Stage Definition"
      security:
      - ssoAuth:
        - "feature-flag:feature-flags:delete"
      - ssoBearerAuth: []
      parameters:
      - $ref: "#/components/parameters/projectIdPathParam"
      - $ref: "#/components/parameters/stageIdPathParam"
      - $ref: "#/components/parameters/featureFlagIdPathParam"
      - $ref: "#/components/parameters/optimisticLockingVersion"
      responses:
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/InternalServerError"
        "204":
          description: "The feature flag stage definition was deleted successfully"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
