      additionalProperties: true
    FeatureFlagDefinition:
      description: "A definition is the general skeleton of a feature flag that can\
        \ be defined per stage."
      required:
      - "name"
      - "variants"
      - "type"
      properties:
        name:
          type: "string"
        description:
          type: "string"
        type:
          $ref: "#/components/schemas/FlagType"
        variants:
          $ref: "#/components/schemas/Variants"
    FeatureFlagDefinitionDetails:
      description: "A definition is the general skeleton of a feature flag that can\
        \ be defined per stage."
      allOf:
      - $ref: "#/components/schemas/FeatureFlagDefinition"
      required:
      - "id"
      properties:
        id:
          type: "string"
          readOnly: true
