        \ new state, i.e. closing or applying the change request."
      properties:
        comment:
          type: "string"
          maxLength: 5000
          description: "An optional comment about the transition"
    FeatureFlagStageDefinitionChangeRequestCreate:
      description: "A request to change a feature flag stage definition."
      required:
      - "projectId"
      - "featureFlagId"
      - "featureFlagStageDefinitionVersion"
      - "stageId"
      properties:
        projectId:
          type: "string"
          description: "The id of the project where the change is requested"
        featureFlagId:
          type: "string"
          description: "The id of the feature flag definition where the change is\
            \ requested"
        featureFlagStageDefinitionVersion:
          type: "string"
          description: "The version of the feature flag stage definition at the point\
            \ where the change request is created"
        stageId:
          type: "string"
          description: "The id of the stage where the change is requested"
        comment:
          type: "string"
          maxLength: 5000
          description: "An optional comment describing the reason for the change request"
        defaultVariant:
          $ref: "#/components/schemas/DefaultVariant"
        enabled:
          type: "boolean"
          default: false
        targeting:
          $ref: "#/components/schemas/Targeting"
    FeatureFlagStageDefinitionChangeRequestUpdate:
