components:
  parameters:
    projectIdPathParam:
      name: "projectId"
      in: "path"
      description: "Specify the ID of the project"
      required: true
      schema:
        type: "string"
        pattern: "^[a-z][a-z0-9.-]{0,254}[a-z0-9]"
    stageIdPathParam:
      name: "stageId"
      in: "path"
      description: "Specify the ID of the stage"
      required: true
      schema:
        type: "string"
        pattern: "^[a-z][a-z0-9.-]{0,254}[a-z0-9]"
    contextIdPathParam:
      name: "contextId"
      in: "path"
      description: "Specify the ID of the context"
      required: true
      schema:
        type: "string"
        pattern: "^\\$flagd\\.[A-z0-9.-]{0,248}[A-z0-9]$|^[a-z][a-z0-9.-]{0,254}[a-z0-9]$"
    featureFlagIdPathParam:
      name: "featureFlagId"
      in: "path"
      description: "Specify the ID of the feature flag"
      required: true
      schema:
        type: "string"
        pattern: "^[a-z][a-z0-9.-]{0,254}[a-z0-9]"
    changeRequestIdPathParam:
      name: "changeRequestId"
      in: "path"
      description: "Specify the ID of the change request"
      required: true
      schema:
        type: "string"
    optimisticLockingVersion:
      name: "optimistic-locking-version"
      in: "query"
      description: "The version of the object for optimistic locking.\nThis field\
        \ is required for update operations (PUT). The update will only be allowed\
        \ if the version\nmatches the current version of the object. Otherwise, 409\
        \ will be returned.\nThis field is optional for delete operations (DELETE).\
        \ If set, the delete operation will only be allowed\nif the version matches\
        \ the current version of the object. Otherwise, 409 will be returned. If not\
        \ set,\nthe delete operation will be forced.\n"
      required: false
      schema:
        type: "string"
        minLength: 1
    page:
      name: "page"
      in: "query"
      description: "The index of the page to return. The first page will be returned\
        \ if this parameters isn't specified."
      schema:
        type: "integer"
        default: 1
        minimum: 1
      example: 1
    pageSize:
      name: "page-size"
      in: "query"
      description: "The number of resources to return in a single request. 1000 by\
        \ default."
      schema:
        type: "integer"
        default: 1000
        minimum: 1
      example: 20
    filter:
      name: "filter"
      in: "query"
      description: "A filter expression to filter the results."
      schema:
        type: "string"
      example: "projectId='my-project' and stageId='prod'"
    AddFields:
      name: "add-fields"
      in: "query"
      required: false
      description: "Specify which meta-information to fetch in addition to the default\
        \ fields.\n\nValid values are:\n* `resourceContext`\n\nAny other field will\
        \ result in a HTTP 400 response.\n"
      style: "form"
      explode: false
      schema:
        type: "array"
        items:
          type: "string"
          enum:
          - "resourceContext"
      example: "resourceContext"
  schemas:
    Project:
      type: "object"
      required:
      - "name"
      properties:
        name:
          type: "string"
        description:
          type: "string"
        owners:
          type: "array"
          items:
            type: "string"
    ProjectDetails:
      allOf:
      - $ref: "#/components/schemas/Project"
      required:
      - "id"
      properties:
        id:
          type: "string"
          readOnly: true
        modificationInfo:
          $ref: "#/components/schemas/ModificationInfo"
        resourceContext:
          $ref: "#/components/schemas/ResourceContext"
        version:
          $ref: "#/components/schemas/OptimisticLockingVersion"
    ProjectList:
      required:
      - "items"
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/ProjectDetails"
        pagination:
          $ref: "#/components/schemas/Pagination"
        resourceContext:
          $ref: "#/components/schemas/ResourceContext"
    Stage:
      type: "object"
      required:
      - "name"
      properties:
        name:
          type: "string"
        description:
          type: "string"
        owners:
          type: "array"
          items:
            type: "string"
    StageDetails:
      allOf:
      - $ref: "#/components/schemas/Stage"
      required:
      - "id"
      properties:
        id:
          type: "string"
          readOnly: true
        modificationInfo:
          $ref: "#/components/schemas/ModificationInfo"
        resourceContext:
          $ref: "#/components/schemas/ResourceContext"
        version:
          $ref: "#/components/schemas/OptimisticLockingVersion"
    StageList:
      type: "object"
      required:
      - "items"
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/StageDetails"
        pagination:
          $ref: "#/components/schemas/Pagination"
        resourceContext:
          $ref: "#/components/schemas/ResourceContext"
    ContextType:
