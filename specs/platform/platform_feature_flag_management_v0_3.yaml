            feature-flag:projects:delete: "delete projects"
            feature-flag:stages:write: "create and update stages"
            feature-flag:stages:delete: "delete stages"
            feature-flag:feature-flags:write: "create and update feature-flags"
            feature-flag:feature-flags:read: "read feature-flags"
            feature-flag:feature-flags:delete: "delete feature-flags"
            feature-flag:context-attributes:write: "create and update contexts"
            feature-flag:context-attributes:delete: "delete contexts"
    ssoBearerAuth:
      type: "http"
      scheme: "bearer"
      description: "The value can be either an OAuth2 access token or a platform token.</br>\
        \ For further information about platform tokens see <a href=\"https://dt-url.net/platform-tokens\"\
        \ target=\"_blank\">Platform tokens - Dynatrace Docs</a>."
