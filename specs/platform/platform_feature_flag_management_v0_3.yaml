          maxLength: 5000
          description: "An optional comment describing the reason for the change request"
        defaultVariant:
          $ref: "#/components/schemas/DefaultVariant"
        enabled:
          type: "boolean"
          default: false
        targeting:
          $ref: "#/components/schemas/Targeting"
    FeatureFlagStageDefinitionChangeRequestDetails:
