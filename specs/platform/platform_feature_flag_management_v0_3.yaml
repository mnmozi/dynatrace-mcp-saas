          $ref: "#/components/schemas/ModificationInfo"
        resourceContext:
          $ref: "#/components/schemas/ResourceContext"
        version:
          $ref: "#/components/schemas/OptimisticLockingVersion"
    FeatureFlagDefinitionList:
