          \ application build\nthe symbol file was produced for. Two builds of the\
          \ same app may share a `versionName`\nbut must have different `versionCode`\
          \ values.\n  * **Android:** the `versionCode` from the manifest (`android:versionCode`),\n\
          \    e.g. `1317`.\n  * **iOS / tvOS:** the build number from `Info.plist`\
          \ (`CFBundleVersion`),\n    e.g. `42`.\n"
