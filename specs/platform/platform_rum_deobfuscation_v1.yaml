        schema:
          type: "string"
      - name: "platform"
        in: "path"
        description: "Platform the bundle is built for."
        required: true
        schema:
          type: "string"
          enum:
          - "IOS"
          - "ANDROID"
      - name: "fileName"
        in: "path"
        description: "Name of the bundle file the mapping refers to."
        example: "main.jsbundle"
        required: true
        schema:
          type: "string"
      - name: "bundleVersion"
        in: "path"
        description: "Version of the React Native bundle."
        example: "1.0.0"
        required: true
        schema:
          type: "string"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinRnSymbolFileRequest"
