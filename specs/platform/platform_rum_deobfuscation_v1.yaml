        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/NotImplementedError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
components:
  securitySchemes:
    ssoAuth:
      type: "oauth2"
      description: "This API uses OAuth 2.0 with the client credentials flow."
      flows:
        clientCredentials:
          tokenUrl: "https://sso-sprint.dynatracelabs.com/sso/oauth2/token"
          scopes:
            storage:buckets:read: "read grail events"
            storage:user.events:read: "read grail events"
            deobfuscation:symbol-files:read: "read symbol files information"
            deobfuscation:symbol-files:write: "upload symbol files"
            deobfuscation:symbol-files:delete: "delete symbol files"
    ssoBearerAuth:
      type: "http"
      scheme: "bearer"
      description: "The value can be either an OAuth2 access token or a platform token.</br>\
        \ For further information about platform tokens see <a href=\"https://dt-url.net/platform-tokens\"\
        \ target=\"_blank\">Platform tokens - Dynatrace Docs</a>."
  schemas:
    Issue:
      type: "object"
      properties:
        type:
          type: "string"
          enum:
          - "INVALID_EVENT_PROPERTIES"
          - "INVALID_STACKTRACE"
          - "INVALID_SYMBOL_FILE"
          - "OTHER"
          - "STACKTRACE_TYPE_NOT_RECOGNIZED"
          - "SYMBOL_FILE_NOT_FOUND"
          description: "Issue type:\n  * INVALID_EVENT_PROPERTIES Available event\
            \ properties don't allow to perform de-obfuscation/symbolication, e.g.\
            \ don't allow to identify appropriate symbol/mapping file.\n  * INVALID_STACKTRACE\
            \ The stack trace of the event is of non-parsable format, or is bad in\
            \ any other way.\n  * INVALID_SYMBOL_FILE The symbol/mapping file stored\
            \ in the symbol/mapping file storage is invalid in whatever way, and therefore\
            \ cannot be used for de-obfuscation/symbolication.\n  * OTHER Any other\
            \ issue.\n  * STACKTRACE_TYPE_NOT_RECOGNIZED Stack trace type or technology\
            \ cannot be recognized based on available event properties.\n  * SYMBOL_FILE_NOT_FOUND\
            \ Symbol/mapping file(s) necessary to perform complete de-obfuscation/symbolication,\
            \ could not be found in the symbol/mapping file storage. Note, some technologies\
            \ require multiple symbol/mapping files for complete de-obfuscation/symbolication\
            \ of a stack trace, and might normally miss some of them (e.g. those belonging\
            \ to system libraries).\n"
        details:
          type: "string"
          description: "Verbose issue details"
    StackTraceResponse:
      type: "object"
      description: "Result structure that contains the requested stack trace, along\
        \ with additional information."
      properties:
        issues:
          description: "Any issues faced when de-obfuscating/symbolicating the stack\
            \ trace that might result in incomplete de-obfuscation/symbolication\n"
          type: "array"
          items:
            $ref: "#/components/schemas/Issue"
        stackTrace:
          description: "The requested stack trace, de-obfuscated/symbolicated as much\
            \ as possible. However, in case the event does not have the `exception.stack_trace`\
            \ property, this value will be missing from the response.\n"
          type: "string"
      example: "{\n  \"issues\":[\n    {\n      \"type\":\"SYMBOL_FILE_NOT_FOUND\"\
        ,\n      \"details\":\"Mapping file not found for file URL vendor.27f29fce0c1f6602.js\"\
        \n    },\n    {\n      \"type\":\"SYMBOL_FILE_NOT_FOUND\",\n      \"details\"\
        :\"Mapping file not found for file URL polyfills.943bc9f417e6dd24.js\"\n \
        \   }\n  ],\n  \"stackTrace\":\"ERROR Error: test error\\n  at ./src/app/app.component.ts:463:11\\\
        n  at ctx (./src/app/app.component.ts:449:24)\\n  at lf (vendor.27f29fce0c1f6602.js:1:603132)\\\
        n  at o (vendor.27f29fce0c1f6602.js:1:603281)\\n  at HTMLButtonElement.<anonymous>\
        \ (vendor.27f29fce0c1f6602.js:1:789891)\\n  at v.invokeTask (polyfills.943bc9f417e6dd24.js:1:7169)\\\
        n  at Object.onInvokeTask (vendor.27f29fce0c1f6602.js:1:629669)\\n  at v.invokeTask\
        \ (polyfills.943bc9f417e6dd24.js:1:7090)\\n  at M.runTask (polyfills.943bc9f417e6dd24.js:1:2564)\\\
        n  at m.invokeTask [as invoke] (polyfills.943bc9f417e6dd24.js:1:8220)\"\n\
        }\n"
    DssClientUrl:
      type: "object"
      description: "DSS client download URL information."
      properties:
        dssClientUrl:
          type: "string"
          description: "The URL of the Dynatrace Symbol Service client download."
    StorageQuota:
      type: "object"
      description: "Storage quota information for symbol files."
      properties:
        availableStorage:
          type: "string"
          description: "Available storage space in bytes"
        fileCount:
          type: "string"
          description: "Number of symbol files stored"
        storageQuota:
          type: "string"
          description: "Total storage quota in bytes"
        usedStorage:
          type: "string"
          description: "Used storage space in bytes"
      example: "{\n  \"availableStorage\": 0,\n  \"fileCount\": 0,\n  \"storageQuota\"\
        : 0,\n  \"usedStorage\": 0\n}\n"
    RnSymbolFile:
      type: "object"
      description: "React Native symbol file information."
      properties:
        dtRumAppId:
          type: "string"
          description: "The RUM application identifier."
        bundleName:
          type: "string"
          description: "The bundle name of the React Native application."
        platform:
          type: "string"
          description: "The platform (IOS or ANDROID)."
        fileName:
          type: "string"
          description: "The file name of the symbol file."
        bundleVersion:
          type: "string"
          description: "The bundle version of the React Native application."
        metadata:
          $ref: "#/components/schemas/RnSymbolFileInfoMetadata"
    PinJsSymbolFileRequest:
      type: "object"
      description: "Request body for pinning or unpinning a JavaScript mapping file."
      required:
      - "pinned"
      properties:
        pinned:
          type: "boolean"
          description: "Whether to pin the symbol file and protect it from automatic\
            \ deletion."
    PinRnSymbolFileRequest:
      type: "object"
      description: "Request body for pinning or unpinning a React Native symbol file."
      required:
      - "pinned"
      properties:
        pinned:
          type: "boolean"
          description: "Whether to pin the symbol file and protect it from automatic\
            \ deletion."
    PinMobileSymbolFileRequest:
      type: "object"
      description: "Request body for pinning or unpinning a mobile symbol file."
      required:
      - "pinned"
      properties:
        pinned:
          type: "boolean"
          description: "Whether to pin the symbol file and protect it from automatic\
            \ deletion."
    RnSymbolFileInfoMetadata:
      type: "object"
      description: "Metadata associated with a React Native symbol file."
      properties:
        pinned:
          type: "boolean"
          description: "Indicates whether the symbol file is pinned and protected\
            \ from automatic deletion."
        storedSizeInBytes:
          type: "string"
          description: "The size of the stored symbol file in bytes."
        uploadTimestampInMilliseconds:
          type: "string"
          description: "The timestamp of when the symbol file was uploaded, in milliseconds\
            \ since epoch."
    PagedRnSymbolFiles:
      type: "object"
      description: "A paginated list of React Native symbol files."
      required:
      - "totalCount"
      - "pageSize"
      - "mappingFiles"
      properties:
        totalCount:
          type: "integer"
          description: "The total number of React Native symbol files matching the\
            \ request."
        pageSize:
          type: "integer"
          description: "The number of entries per page."
        nextPageKey:
          type: "string"
          description: "The cursor for the next page of results. Present only when\
            \ additional pages exist. Pass this value as the `nextPageKey` query parameter\
            \ on the next request.\n"
        mappingFiles:
          type: "array"
          description: "The list of React Native symbol files on this page."
          items:
            $ref: "#/components/schemas/RnSymbolFile"
    JsMappingFile:
      type: "object"
      description: "JavaScript mapping file information."
      properties:
        fileName:
          type: "string"
          description: "The file name of the JavaScript mapping file."
        fileType:
          type: "string"
          description: "The type of the JavaScript file (e.g. MINIFIED, SOURCE, SOURCEMAP)."
        minifiedJsFileUrl:
          type: "string"
          description: "The URL of the minified JavaScript file this mapping belongs\
            \ to."
        numberOfFiles:
          type: "integer"
          description: "The number of files associated with this mapping entry."
        pinned:
          type: "boolean"
          description: "Indicates whether the mapping file is pinned and protected\
            \ from automatic deletion."
        size:
          type: "string"
          description: "The size of the stored mapping file in bytes."
        uploadTimestamp:
          type: "string"
          description: "The timestamp of when the mapping file was uploaded, in milliseconds\
            \ since epoch."
        zipped:
          type: "boolean"
          description: "Indicates whether the mapping file is stored in a zipped format."
    PagedJsMappingFiles:
      type: "object"
      description: "A paginated list of JavaScript mapping files."
      required:
      - "totalCount"
      - "pageSize"
      - "jsMappingFiles"
      properties:
        totalCount:
          type: "integer"
          description: "The total number of JavaScript mapping files matching the\
            \ request."
        pageSize:
          type: "integer"
          description: "The number of entries per page."
        nextPageKey:
          type: "string"
          description: "The cursor for the next page of results. Present only when\
            \ additional pages exist. Pass this value as the `nextPageKey` query parameter\
            \ on the next request.\n"
        jsMappingFiles:
          type: "array"
          description: "The list of JavaScript mapping files on this page."
          items:
            $ref: "#/components/schemas/JsMappingFile"
    MobileSymbolFileAppId:
      type: "object"
      description: "The application identifier of the mobile symbol file."
      properties:
        id:
          type: "string"
          description: "The RUM application identifier."
        os:
          type: "string"
          description: "The operating system (ANDROID, IOS, or TVOS)."
        packageName:
          type: "string"
          description: "The package or bundle name of the application."
        versionCode:
          type: "string"
          description: "The version code of the application."
        versionName:
          type: "string"
          description: "The version name of the application."
    MobileSymbolFile:
      type: "object"
      description: "Mobile symbol file information."
      properties:
        appId:
          $ref: "#/components/schemas/MobileSymbolFileAppId"
        applicationName:
          type: "string"
          description: "The display name of the application."
        pinned:
          type: "boolean"
          description: "Indicates whether the symbol file is pinned and protected\
            \ from automatic deletion."
        size:
          type: "string"
          description: "The size of the stored symbol file in bytes."
        uploadTimestamp:
          type: "string"
          description: "The timestamp of when the symbol file was uploaded, in milliseconds\
            \ since epoch."
    MobileSymbolFiles:
      type: "object"
      description: "A list of mobile symbol files."
      required:
      - "symbolFiles"
      properties:
        symbolFiles:
          type: "array"
          description: "The list of mobile symbol files."
          items:
            $ref: "#/components/schemas/MobileSymbolFile"
    ErrorResponse:
      type: "object"
      properties:
        error:
          $ref: "#/components/schemas/Error"
      required:
      - "error"
    Error:
      type: "object"
      description: "An error response as defined [here](https://dt-url.net/platform-services-error-handling)."
      properties:
        code:
          type: "integer"
        message:
          type: "string"
        retryAfterSeconds:
          type: "integer"
      required:
      - "code"
      - "message"
  responses:
    BadRequest:
      description: "Malformed request or invalid parameters."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "API token or tenant missing or corrupt."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "You don't have adequate permission. This could either be because\
        \ the user lacks the permission to access the specific endpoint, or because\
        \ the target document isn't accessible to your user.\n"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "No RUM event found by event ID and start time."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ResourceNotFound:
      description: "Resource not found."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ContentTooLarge:
      description: "The content is too large. This can happen when the symbol file\
        \ storage quota is exhausted or when the uploaded file exceeds the maximum\
        \ allowed size of 100 MB.\n"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: "The request uses a content type that's not supported for the target\
        \ platform. For Android, allowed types are `application/zip`, `application/x-compressed`,\
        \ `application/x-zip-compressed`, and `text/plain`. For iOS and tvOS, only\
        \ the zip variants are allowed.\n"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: "There is a problem in the backend."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotImplementedError:
      description: "Method isn't implemented."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailableError:
      description: "Service is unavailable."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
