openapi: "3.0.3"
info:
  version: "1.20.1"
  title: "Platform Deobfuscation Service Public API"
  description: "Provides access to stack traces of events stored in Grail."
servers:
- url: "https://asn8731h.sprint.apps.dynatracelabs.com/platform/rum/deobfuscation/v1"
  x-api-gateway-url: "/platform/rum/deobfuscation/v1"
paths:
  /stacktraces/{eventId}:
    get:
      summary: "Returns the stack trace of a given event."
      description: "**All the following scopes are required:**\n+ storage:buckets:read\n\
        + storage:user.events:read\n\n<br/><br/>Returns the stack trace of an event\
        \ stored in the `user.events` table, identified by its ID and start time properties.\n\
        \nOnly stack traces stored as event's `exception.stack_trace` property value\
        \ can be returned.\n\nA requested stack trace is de-obfuscated/symbolicated\
        \ based on the availability of appropriate symbol/mapping\nfile(s) in the\
        \ symbol/mapping file storage.\n"
      operationId: "getStackTrace"
      tags:
      - "Deobfuscation"
      security:
      - ssoAuth:
        - "storage:buckets:read"
        - "storage:user.events:read"
      - ssoBearerAuth: []
      parameters:
      - name: "eventId"
        in: "path"
        description: "ID of the event (its `id` property value)."
        example: "357bf70f3c617cb34584b31bd4616af8"
        required: true
        schema:
          type: "string"
      - name: "eventTime"
        in: "query"
        description: "Start time of the event (its `start_time` property value)."
        example: "2023-10-02T11:20:11.000000000Z"
        required: true
        schema:
          type: "string"
          format: "date-time"
      responses:
        "200":
          description: "Successful operation that returns a stack trace response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StackTraceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/NotImplementedError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /symbol-files/quota:
    get:
      summary: "Returns symbol file storage quota information."
      description: "**Required scope:** deobfuscation:symbol-files:read<br/><br/>Retrieves\
        \ the current storage quota information for symbol files, including total\
        \ storage quota,\nused storage, available storage, and the number of stored\
        \ files.\n\nAll size values are returned as strings holding the number of\
        \ bytes.\n"
      operationId: "getQuota"
      tags:
      - "Symbol Files Management"
      security:
      - ssoAuth:
        - "deobfuscation:symbol-files:read"
      - ssoBearerAuth: []
      responses:
        "200":
          description: "Successful operation that returns storage quota information."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageQuota"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/NotImplementedError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /symbol-files/rn:
    get:
      summary: "Returns a paginated list of React Native symbol files."
      description: "**Required scope:** deobfuscation:symbol-files:read<br/><br/>Returns\
        \ a paginated list of React Native source mapping files stored in the symbol\
        \ file storage.\nUse `nextPageKey` from a previous response to retrieve the\
        \ next page of results.\n"
      operationId: "getRnSymbolFile"
      tags:
      - "Symbol Files Management"
      security:
      - ssoAuth:
        - "deobfuscation:symbol-files:read"
      - ssoBearerAuth: []
      parameters:
      - name: "nextPageKey"
        in: "query"
        required: false
        description: "The cursor for the next page of results, obtained from the `nextPageKey`\
          \ field of a\nprevious response. Omit on the first request.\n\n**Mutually\
          \ exclusive with `pageSize`:** when `nextPageKey` is provided, `pageSize`\n\
          must NOT be set. The page size chosen on the initial request is preserved\
          \ across\nthe cursor walk.\n"
        schema:
          type: "string"
      - name: "pageSize"
        in: "query"
        required: false
        description: "The number of results per page. Defaults to 50 if not specified.\n\
          \n**Mutually exclusive with `nextPageKey`:** only set `pageSize` on the\
          \ first\n(uncursored) request. When paging through results using `nextPageKey`,\
          \ this\nparameter must NOT be provided.\n"
        example: 1
        schema:
          type: "integer"
          minimum: 1
          maximum: 100
      responses:
        "200":
          description: "Successful operation that returns a paginated list of React\
            \ Native symbol files."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedRnSymbolFiles"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/NotImplementedError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /symbol-files/js:
    get:
      summary: "Returns a paginated list of JavaScript mapping files."
      description: "**Required scope:** deobfuscation:symbol-files:read<br/><br/>Returns\
        \ a paginated list of JavaScript source mapping files stored in the symbol\
        \ file storage.\nUse `nextPageKey` from a previous response to retrieve the\
        \ next page of results.\n"
      operationId: "getJsMappingFiles"
      tags:
      - "Symbol Files Management"
      security:
      - ssoAuth:
        - "deobfuscation:symbol-files:read"
      - ssoBearerAuth: []
      parameters:
      - name: "nextPageKey"
        in: "query"
        required: false
        description: "The cursor for the next page of results, obtained from the `nextPageKey`\
          \ field of a\nprevious response. Omit on the first request.\n\n**Mutually\
          \ exclusive with `pageSize`:** when `nextPageKey` is provided, `pageSize`\n\
          must NOT be set. The page size chosen on the initial request is preserved\
          \ across\nthe cursor walk.\n"
        schema:
          type: "string"
      - name: "pageSize"
        in: "query"
        required: false
        description: "The number of results per page. Defaults to 50 if not specified.\n\
          \n**Mutually exclusive with `nextPageKey`:** only set `pageSize` on the\
          \ first\n(uncursored) request. When paging through results using `nextPageKey`,\
          \ this\nparameter must NOT be provided.\n"
        example: 1
        schema:
          type: "integer"
          minimum: 1
          maximum: 100
      responses:
        "200":
          description: "Successful operation that returns a paginated list of JavaScript\
            \ mapping files."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedJsMappingFiles"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/NotImplementedError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /symbol-files/mobile:
    get:
      summary: "Returns a list of mobile symbol files."
      description: "**Required scope:** deobfuscation:symbol-files:read<br/><br/>Returns\
        \ the list of mobile symbol files (Android, iOS and tvOS)\nstored in the symbol\
        \ file storage. This endpoint doesn't currently support pagination\nand returns\
        \ all entries available for the tenant.\n"
      operationId: "getMobileSymbolFiles"
      tags:
      - "Symbol Files Management"
      security:
      - ssoAuth:
        - "deobfuscation:symbol-files:read"
      - ssoBearerAuth: []
      responses:
        "200":
          description: "Successful operation that returns a list of mobile symbol\
            \ files."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileSymbolFiles"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/NotImplementedError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /symbol-files/mobile/dtxdss-download:
    get:
      summary: "Returns the DSS client download URL."
      description: "**Required scope:** deobfuscation:symbol-files:read<br/><br/>Returns\
        \ the Dynatrace Symbol Service (DSS) client download URL for use with mobile\n\
        symbol file management.\n"
      operationId: "getDtxdssDownloadUrl"
      tags:
      - "Symbol Files Management"
      security:
      - ssoAuth:
        - "deobfuscation:symbol-files:read"
      - ssoBearerAuth: []
      responses:
        "200":
          description: "Successful operation that returns the DSS client download\
            \ URL."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DssClientUrl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/NotImplementedError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /symbol-files/rn/{dtRumAppId}/{bundleName}/{platform}/{fileName}/{bundleVersion}:
    put:
      summary: "Uploads a React Native mapping file."
      description: "**Required scope:** deobfuscation:symbol-files:write<br/><br/>Uploads\
        \ a React Native source mapping file (`.map`) to the symbol file storage.\n\
        \nThe mapping file is associated with a specific RUM application, JavaScript\
        \ bundle, platform,\nbundle file name and bundle version. The uploaded file\
        \ must have a `.map` extension.\n"
      operationId: "uploadRnSymbolFile"
      tags:
      - "Symbol Files Management"
      security:
      - ssoAuth:
        - "deobfuscation:symbol-files:write"
      - ssoBearerAuth: []
      parameters:
      - name: "dtRumAppId"
        in: "path"
        description: "RUM application identifier the bundle belongs to."
        example: "632712bf-7135-4ff1-a7b2-63088f71c166"
        required: true
        schema:
          type: "string"
      - name: "bundleName"
        in: "path"
        description: "Name of the React Native bundle."
        example: "index"
        required: true
        schema:
          type: "string"
      - name: "platform"
        in: "path"
        description: "Platform the bundle is built for."
        required: true
        schema:
          type: "string"
          enum:
          - "IOS"
          - "ANDROID"
      - name: "fileName"
        in: "path"
        description: "Name of the bundle file the mapping refers to (without extension)."
        example: "main.jsbundle"
        required: true
        schema:
          type: "string"
      - name: "bundleVersion"
        in: "path"
        description: "Version of the React Native bundle."
        example: "1.0.0"
        required: true
        schema:
          type: "string"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: "object"
              required:
              - "file"
              properties:
                file:
                  type: "string"
                  format: "binary"
                  description: "The React Native mapping file content (`.map` file).\
                    \ Maximum allowed size is 100 MB."
      responses:
        "200":
          description: "Symbol file uploaded successfully."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/NotImplementedError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
    delete:
      summary: "Deletes a React Native mapping file."
      description: "**Required scope:** deobfuscation:symbol-files:delete<br/><br/>Deletes\
        \ a React Native source mapping file from the symbol file storage. The file\
        \ is\nidentified by the combination of RUM application id, bundle name, platform,\
        \ bundle file\nname, and bundle version.\n"
      operationId: "deleteRnSymbolFile"
      tags:
      - "Symbol Files Management"
      security:
      - ssoAuth:
        - "deobfuscation:symbol-files:delete"
      - ssoBearerAuth: []
      parameters:
      - name: "dtRumAppId"
        in: "path"
        description: "RUM application identifier the bundle belongs to."
        example: "632712bf-7135-4ff1-a7b2-63088f71c166"
        required: true
        schema:
          type: "string"
      - name: "bundleName"
        in: "path"
        description: "Name of the React Native bundle."
        example: "index"
        required: true
        schema:
          type: "string"
      - name: "platform"
        in: "path"
        description: "Platform the bundle is built for."
        required: true
        schema:
          type: "string"
          enum:
          - "IOS"
          - "ANDROID"
      - name: "fileName"
        in: "path"
        description: "Name of the bundle file the mapping refers to."
        example: "main.jsbundle"
        required: true
        schema:
          type: "string"
      - name: "bundleVersion"
        in: "path"
        description: "Version of the React Native bundle."
        example: "1.0.0"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "Symbol file deleted successfully."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/NotImplementedError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /symbol-files/js/{fileType}:
    put:
      summary: "Uploads a JavaScript source mapping file."
      description: "**Required scope:** deobfuscation:symbol-files:write<br/><br/>Uploads\
        \ a JavaScript source mapping file to the symbol file storage. The mapping\
        \ file is\nassociated with the JavaScript file identified by the `minifiedJsFileUrl`\
        \ query parameter.\n\nAccepted file extensions depend on `fileType`:\n  *\
        \ `MINIFIED`: `.js`\n  * `SOURCE`: `.js` or `.zip`\n  * `SOURCEMAP`: `.map`\n"
      operationId: "uploadJsSymbolFile"
      tags:
      - "Symbol Files Management"
      security:
      - ssoAuth:
        - "deobfuscation:symbol-files:write"
      - ssoBearerAuth: []
      parameters:
      - name: "fileType"
        in: "path"
        description: "Type of the JavaScript file the mapping belongs to."
        required: true
        schema:
          type: "string"
          enum:
          - "MINIFIED"
          - "SOURCE"
          - "SOURCEMAP"
      - name: "minifiedJsFileUrl"
        in: "query"
        description: "URL of the minified JavaScript file this source mapping file\
          \ belongs to."
        example: "https://easytravel-ang.lab.dynatrace.org/main-es2015.f81ac6e76943cfef85ca.js"
        required: true
        schema:
          type: "string"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: "object"
              required:
              - "file"
              properties:
                file:
                  type: "string"
                  format: "binary"
                  description: "The JavaScript source mapping file content. Maximum\
                    \ allowed size is 100 MB."
      responses:
        "200":
          description: "Symbol file uploaded successfully."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/NotImplementedError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
    delete:
      summary: "Deletes a JavaScript mapping file."
      description: "**Required scope:** deobfuscation:symbol-files:delete<br/><br/>Deletes\
        \ a JavaScript source mapping file from the symbol file storage,\nidentified\
        \ by the file type and the URL of the minified JavaScript file.\n"
      operationId: "deleteJsSymbolFile"
      tags:
      - "Symbol Files Management"
      security:
      - ssoAuth:
        - "deobfuscation:symbol-files:delete"
      - ssoBearerAuth: []
      parameters:
      - name: "fileType"
        in: "path"
        description: "Type of the JavaScript file the mapping belongs to."
        required: true
        schema:
          type: "string"
          enum:
          - "MINIFIED"
          - "SOURCE"
          - "SOURCEMAP"
      - name: "minifiedJsFileUrl"
        in: "query"
        description: "URL of the minified JavaScript file whose mapping should be\
          \ deleted."
        example: "https://easytravel-ang.lab.dynatrace.org/main-es2015.f81ac6e76943cfef85ca.js"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "Symbol file deleted successfully."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/NotImplementedError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /symbol-files/mobile/{platform}/{dtRumAppId}/{packageName}/{versionCode}/{versionName}:
    put:
      summary: "Uploads a mobile symbol file."
      description: "**Required scope:** deobfuscation:symbol-files:write<br/><br/>Uploads\
        \ a mobile symbol file to the symbol file storage.\n\nAccepted content types\
        \ depend on the platform:\n  * `ANDROID`: as `text/plain`, or a zip archive\n\
        \    (`application/zip`, `application/x-compressed`, `application/x-zip-compressed`).\n\
        \  * `IOS` / `TVOS`: as a zip\n    (`application/zip`, `application/x-compressed`,\
        \ `application/x-zip-compressed`).\n"
      operationId: "uploadMobileSymbolFile"
      tags:
      - "Symbol Files Management"
      security:
      - ssoAuth:
        - "deobfuscation:symbol-files:write"
      - ssoBearerAuth: []
      parameters:
      - name: "platform"
        in: "path"
        description: "Mobile platform of the symbol file."
        required: true
        schema:
          type: "string"
          enum:
          - "ANDROID"
          - "IOS"
          - "TVOS"
      - name: "dtRumAppId"
        in: "path"
        description: "RUM application identifier the symbol file belongs to."
        example: "632712bf-7135-4ff1-a7b2-63088f71c166"
        required: true
        schema:
          type: "string"
      - name: "packageName"
        in: "path"
        description: "Unique identifier of the mobile application across versions.\n\
          \  * **Android:** the application id declared in `build.gradle`\n    (`applicationId`)\
          \ / the manifest `package` attribute, e.g. `com.example.app`.\n  * **iOS\
          \ / tvOS:** the bundle identifier from `Info.plist`\n    (`CFBundleIdentifier`),\
          \ e.g. `com.example.app`.\n"
        example: "com.example.app"
        required: true
        schema:
          type: "string"
      - name: "versionCode"
        in: "path"
        description: "Internal, monotonically increasing build identifier of the specific\
          \ application build\nthe symbol file was produced for. Two builds of the\
          \ same app may share a `versionName`\nbut must have different `versionCode`\
          \ values.\n  * **Android:** the `versionCode` from the manifest (`android:versionCode`),\n\
          \    e.g. `1317`.\n  * **iOS / tvOS:** the build number from `Info.plist`\
          \ (`CFBundleVersion`),\n    e.g. `42`.\n"
        example: "1317"
        required: true
        schema:
          type: "string"
      - name: "versionName"
        in: "path"
        description: "User-facing version string of the application (the value shown\
          \ to end users in the\napp store).\n  * **Android:** `versionName` from\
          \ the manifest (`android:versionName`),\n    e.g. `11.0.151`.\n  * **iOS\
          \ / tvOS:** the short version string from `Info.plist`\n    (`CFBundleShortVersionString`),\
          \ e.g. `11.0.151`.\n"
        example: "11.0.151"
        required: true
        schema:
          type: "string"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: "object"
              required:
              - "file"
              properties:
                file:
                  type: "string"
                  format: "binary"
                  description: "The symbol file content. For Android, this is a ProGuard/R8\
                    \ `mapping.txt` or a zip\narchive containing it. For iOS/tvOS,\
                    \ this is a zip archive containing the dSYM bundle.\nMaximum allowed\
                    \ size is 100 MB.\n"
      responses:
        "200":
          description: "Symbol file uploaded successfully."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/NotImplementedError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
    delete:
      summary: "Deletes a mobile symbol file."
      description: "**Required scope:** deobfuscation:symbol-files:delete<br/><br/>Deletes\
        \ a mobile symbol file from the symbol file storage. The file is identified\
        \ by the\ncombination of platform, RUM application id, package name, version\
        \ code, and version name.\n"
      operationId: "deleteMobileSymbolFile"
      tags:
      - "Symbol Files Management"
      security:
      - ssoAuth:
        - "deobfuscation:symbol-files:delete"
      - ssoBearerAuth: []
      parameters:
      - name: "platform"
        in: "path"
        description: "Mobile platform of the symbol file."
        required: true
        schema:
          type: "string"
          enum:
          - "ANDROID"
          - "IOS"
          - "TVOS"
      - name: "dtRumAppId"
        in: "path"
        description: "RUM application identifier the symbol file belongs to."
        example: "632712bf-7135-4ff1-a7b2-63088f71c166"
        required: true
        schema:
          type: "string"
      - name: "packageName"
        in: "path"
        description: "Unique identifier of the mobile application across versions.\n\
          \  * **Android:** the application id declared in `build.gradle`\n    (`applicationId`)\
          \ / the manifest `package` attribute, e.g. `com.example.app`.\n  * **iOS\
          \ / tvOS:** the bundle identifier from `Info.plist`\n    (`CFBundleIdentifier`),\
          \ e.g. `com.example.app`.\n"
        example: "com.example.app"
        required: true
        schema:
          type: "string"
      - name: "versionCode"
        in: "path"
        description: "Internal, monotonically increasing build identifier of the specific\
          \ application build\nthe symbol file was produced for. Two builds of the\
          \ same app may share a `versionName`\nbut must have different `versionCode`\
          \ values.\n  * **Android:** the `versionCode` from the manifest (`android:versionCode`),\n\
          \    e.g. `1317`.\n  * **iOS / tvOS:** the build number from `Info.plist`\
          \ (`CFBundleVersion`),\n    e.g. `42`.\n"
        example: "1317"
        required: true
        schema:
          type: "string"
      - name: "versionName"
        in: "path"
        description: "User-facing version string of the application (the value shown\
          \ to end users in the\napp store).\n  * **Android:** `versionName` from\
          \ the manifest (`android:versionName`),\n    e.g. `11.0.151`.\n  * **iOS\
          \ / tvOS:** the short version string from `Info.plist`\n    (`CFBundleShortVersionString`),\
          \ e.g. `11.0.151`.\n"
        example: "11.0.151"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "Symbol file deleted successfully."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/NotImplementedError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
