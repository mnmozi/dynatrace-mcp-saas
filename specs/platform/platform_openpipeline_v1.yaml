    SamplingAwareCounterMetricExtractionProcessor:
      type: "object"
      description: "Processor to write the occurrences as a metric."
      properties:
        aggregation:
          type: "string"
          description: "Indicates whether aggregation is considered for metric extraction."
          enum:
          - "DISABLED"
          - "ENABLED"
        builtin:
          type: "boolean"
          default: false
          description: "Indicates if Dynatrace provides the object or if it's customer-defined."
        description:
          type: "string"
          description: "Name or description of the processor."
        dimensions:
          type: "array"
          description: "List of unique dimensions to add to the metric. Dimensions\
            \ are represented in the format `({dimensionName}=)?{sourceField}`. `{dimensionName}`\
            \ is optional if `{sourceField}` represents a valid metric dimension name.\
            \ `{sourceField}` has to represent a valid DQL field accessor and it can\
            \ access a nested field (for example, `field[field2][0]`)."
          items:
            type: "string"
            description: "List of unique dimensions to add to the metric. Dimensions\
              \ are represented in the format `({dimensionName}=)?{sourceField}`.\
              \ `{dimensionName}` is optional if `{sourceField}` represents a valid\
              \ metric dimension name. `{sourceField}` has to represent a valid DQL\
              \ field accessor and it can access a nested field (for example, `field[field2][0]`)."
            pattern: "^(([a-zA-Z_][.a-zA-Z0-9_\\-:]+)=)?(([.a-zA-Z0-9_]*|`.*`|[\\\
              [\\]])+)$"
          pattern: "^(([a-zA-Z_][.a-zA-Z0-9_\\-:]+)=)?(([.a-zA-Z0-9_]*|`.*`|[\\[\\\
            ]])+)$"
        editable:
          type: "boolean"
          description: "Indicates if the user can edit this object based on permissions\
            \ and builtin property."
          readOnly: true
        enabled:
          type: "boolean"
          description: "Indicates if the object is active."
        id:
          type: "string"
          description: "Processor identifier, which must be unique within a stage."
        matcher:
          type: "string"
          description: "Matching condition to apply to incoming records."
        metricKey:
          type: "string"
          description: "The key of the metric to write."
        sampleData:
          type: "string"
          description: "Sample data related to the processor for documentation or\
            \ testing."
        sampling:
          type: "string"
          description: "Indicates whether sampling is considered for metric extraction."
          enum:
          - "DISABLED"
          - "ENABLED"
      required:
      - "description"
      - "enabled"
      - "id"
      - "matcher"
      - "metricKey"
    SamplingAwareValueMetricExtractionProcessor:
      type: "object"
      description: "Processor to extract a value from a field as a metric."
      properties:
        aggregation:
          type: "string"
          description: "Indicates whether aggregation is considered for metric extraction."
          enum:
          - "DISABLED"
          - "ENABLED"
        builtin:
          type: "boolean"
          default: false
          description: "Indicates if Dynatrace provides the object or if it's customer-defined."
        defaultValue:
          type: "string"
          description: "The default value to use if the given field value could not\
            \ be extracted. String value must be a number."
        description:
          type: "string"
          description: "Name or description of the processor."
        dimensions:
          type: "array"
          description: "List of unique dimensions to add to the metric. Dimensions\
            \ are represented in the format `({dimensionName}=)?{sourceField}`. `{dimensionName}`\
            \ is optional if `{sourceField}` represents a valid metric dimension name.\
            \ `{sourceField}` has to represent a valid DQL field accessor and it can\
            \ access a nested field (for example, `field[field2][0]`)."
          items:
            type: "string"
            description: "List of unique dimensions to add to the metric. Dimensions\
              \ are represented in the format `({dimensionName}=)?{sourceField}`.\
              \ `{dimensionName}` is optional if `{sourceField}` represents a valid\
              \ metric dimension name. `{sourceField}` has to represent a valid DQL\
              \ field accessor and it can access a nested field (for example, `field[field2][0]`)."
            pattern: "^(([a-zA-Z_][.a-zA-Z0-9_\\-:]+)=)?(([.a-zA-Z0-9_]*|`.*`|[\\\
              [\\]])+)$"
          pattern: "^(([a-zA-Z_][.a-zA-Z0-9_\\-:]+)=)?(([.a-zA-Z0-9_]*|`.*`|[\\[\\\
            ]])+)$"
        editable:
          type: "boolean"
          description: "Indicates if the user can edit this object based on permissions\
            \ and builtin property."
          readOnly: true
        enabled:
          type: "boolean"
          description: "Indicates if the object is active."
        field:
          type: "string"
          description: "The field from which to extract the value for the metric,\
            \ or `null` for a duration measurement."
        id:
          type: "string"
          description: "Processor identifier, which must be unique within a stage."
        matcher:
          type: "string"
          description: "Matching condition to apply to incoming records."
        measurement:
          type: "string"
          description: "Indicates whether the metric value should be the specified\
            \ field or duration."
          enum:
          - "DURATION"
          - "FIELD"
        metricKey:
          type: "string"
          description: "The key of the metric to write."
        sampleData:
          type: "string"
          description: "Sample data related to the processor for documentation or\
            \ testing."
        sampling:
          type: "string"
          description: "Indicates whether sampling is considered for metric extraction."
          enum:
          - "DISABLED"
          - "ENABLED"
      required:
      - "description"
      - "enabled"
      - "id"
      - "matcher"
      - "measurement"
      - "metricKey"
