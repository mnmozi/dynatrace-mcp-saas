      description: "**Required scope:** openpipeline:configurations:read"
  /technologies/{id}/processors:
    get:
      operationId: "processorsForTechnologyId"
      parameters:
      - description: "The ID of a technology bundle."
        in: "path"
        name: "id"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          content:
            application/json; charset=utf-8:
              example:
              - type: "dql"
                enabled: true
                editable: false
                id: "es_slow_log"
                description: "ES Slow Log Index"
                matcher: "matchesPhrase(content, \"index.indexing.slowlog*\")"
                sampleData: "{}"
                dqlScript: "parse content, \"'[' TIMESTAMP('yyyy-MM-ddTHH:mm:ss,SSS'):timestamp\
                  \ ']' PUNCT?\nSPACE? '[' UPPER:loglevel SPACE* ']' PUNCT?\nSPACE?\
                  \ '[index.indexing.slowlog.' LD:'db.operation' ']' PUNCT?\nSPACE?\
                  \ '[' LD:'db.elasticsearch.node' ']' PUNCT?\n(SPACE? '{' LD '}')?\
                  \ //metadata, dt.trace_id\nSPACE? '[' LD?:'db.elasticsearch.index_name'\
                  \ ']' PUNCT?\nSPACE? 'took[' LD ']' PUNCT?\nSPACE? 'took_millis['\
                  \ INT:'db.elasticsearch.duration' ']' PUNCT?\nDATA\"\n"
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/ProcessingStageProcessor"
