openapi: "3.0.1"
info:
  description: "\nFetch and update OpenPipeline configurations for different data\
    \ sources.\n\nTo read about use cases and examples, see [Dynatrace Documentation](https://dt-url.net/openpipeline-pipelines-docs).\n\
    \nTo authorize, use a valid OAuth token.\n\nNotes about compatibility:\n* Operations\
    \ marked as early adopter or preview may be changed in non-compatible ways, although\
    \ we try to avoid this.\n* We may add new enum constants without incrementing\
    \ the API version; thus, clients need to handle unknown enum constants gracefully."
  title: "OpenPipeline v1"
  version: "1.41.0"
  x-service-category: "OpenPipeline"
  x-summary: "Fetch and update OpenPipeline configurations for different data sources."
servers:
- url: "https://asn8731h.sprint.apps.dynatracelabs.com/platform/openpipeline/v1"
  x-api-gateway-url: "/platform/openpipeline/v1"
tags:
- description: "Allows you to translate the tenant's classic pipeline configuration\
    \ into an OpenPipeline configuration pipeline."
  name: "Classic Pipeline Translation"
- description: "Allows you to view and update your configurations."
  name: "Configurations"
- description: "Allows you to verify and retrieve suggestions for DQL processor scripts."
  name: "DQL Processor"
- description: "Allows you to verify and retrieve suggestions for matchers."
  name: "Matcher"
- description: "Allows you to preview the impact of configuration changes."
  name: "Preview"
- description: "Allows you to view all technology bundles and the associated processors."
  name: "Technology"
paths:
  /classic-pipelines/translate:
    get:
      operationId: "translateClassicPipeline"
      parameters:
      - description: "Configuration scope to translate, either 'logs' or 'bizevents'."
        in: "query"
        name: "configuration"
        required: true
        schema:
          type: "string"
      - description: "Include processor sample data in the translation."
        in: "query"
        name: "includeSampleData"
        schema:
          type: "boolean"
          default: true
      - description: "Skip disabled rules during translation."
        in: "query"
        name: "skipDisabledRules"
        schema:
          type: "boolean"
          default: false
      - description: "Skip built-in processing rules during translation."
        in: "query"
        name: "skipBuiltinProcessingRules"
        schema:
          type: "boolean"
          default: true
      responses:
        "200":
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/ClassicPipelineTranslationResult"
          description: "The translated OpenPipeline configuration pipeline."
        "4XX":
          content:
            application/json; charset=utf-8:
              example:
                error:
                  code: 400
                  message: "Bad request."
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
          description: "Client-side error."
        "5XX":
          content:
            application/json; charset=utf-8:
              example:
                error:
                  code: 500
                  message: "Internal server error."
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
          description: "Server-side error."
      security:
      - ssoAuth:
        - "settings:objects:read"
      - ssoBearerAuth: []
      summary: "Translates the tenant's classic pipeline for the requested config\
        \ scope into an OpenPipeline configuration pipeline. | maturity=EARLY_ADOPTER"
      tags:
      - "Classic Pipeline Translation"
      x-maturity: "EARLY_ADOPTER"
      x-only-visible-in-saas: true
      description: "**Required scope:** settings:objects:read"
  /configurations:
    get:
      operationId: "configurations"
      parameters:
      - description: "Returns results only for the selected configuration."
        in: "query"
        name: "configurationId"
        schema:
          type: "string"
      responses:
        "200":
          content:
            application/json; charset=utf-8:
              example:
              - id: "logs"
                editable: false
                definition:
                  endpointsSpecification:
                    customEndpoints: false
                  pipelinesSpecification:
                    processing:
                    - "drop"
                    - "fieldsRemove"
                    - "fieldsRename"
                    - "technology"
                    - "dql"
                    - "fieldsAdd"
                    dataExtraction:
                    - "bizevent"
                    - "davis"
                    metricExtraction:
                    - "valueMetric"
                    - "counterMetric"
                    securityContext:
                    - "securityContext"
                    storage:
                    - "noStorage"
                    - "bucketAssignment"
                  metricKeyPrefix: "log"
                  bucketsSpecification:
                    defaultBucket: "default_logs"
                    bucketTable: "logs"
              - id: "events"
                editable: false
                definition:
                  endpointsSpecification:
                    customEndpoints: true
                  pipelinesSpecification:
                    processing:
                    - "drop"
                    - "fieldsRemove"
                    - "fieldsRename"
                    - "dql"
                    - "fieldsAdd"
                    dataExtraction:
                    - "davis"
                    metricExtraction:
                    - "valueMetric"
                    - "counterMetric"
                    securityContext:
                    - "securityContext"
                    storage:
                    - "noStorage"
                    - "bucketAssignment"
                  metricKeyPrefix: "events"
                  bucketsSpecification:
                    defaultBucket: "default_events"
                    bucketTable: "events"
              - id: "bizevents"
                editable: false
                definition:
                  endpointsSpecification:
                    customEndpoints: false
                  pipelinesSpecification:
                    processing:
                    - "drop"
                    - "fieldsRemove"
                    - "fieldsRename"
                    - "dql"
                    - "fieldsAdd"
                    dataExtraction:
                    - "davis"
                    metricExtraction:
                    - "valueMetric"
                    - "counterMetric"
                    securityContext:
                    - "securityContext"
                    storage:
                    - "noStorage"
                    - "bucketAssignment"
                  metricKeyPrefix: "bizevents"
                  bucketsSpecification:
                    defaultBucket: "default_bizevents"
                    bucketTable: "bizevents"
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/ConfigurationListItem"
          description: "List of available configurations."
        "4XX":
          content:
            application/json; charset=utf-8:
              example:
                error:
                  code: 400
                  message: "Bad request."
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
          description: "Client-side error."
        "5XX":
          content:
            application/json; charset=utf-8:
              example:
                error:
                  code: 500
                  message: "Internal server error."
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
          description: "Server-side error."
      security:
      - ssoAuth:
        - "openpipeline:configurations:read"
      - ssoBearerAuth: []
      summary: "Returns the list of available configuration identifiers."
      tags:
      - "Configurations"
      x-only-visible-in-saas: true
      description: "**Required scope:** openpipeline:configurations:read"
  /dqlProcessor/autocomplete:
    post:
      operationId: "dqlProcessorAutocomplete"
      requestBody:
        content:
          application/json; charset=utf-8:
            example:
              cursorPosition: 5
              script: "parse"
            schema:
              $ref: "#/components/schemas/DQLProcessorAutocompleteRequest"
        description: "DQL processor script and position to create suggestions for."
        required: true
      responses:
        "200":
          content:
            application/json; charset=utf-8:
              example:
                suggestions:
                - parts:
                  - suggestion: " "
                    type: "SPACE"
                  alreadyTypedCharacters: 0
                  suggestion: " "
                - parts:
                  - suggestion: "parse"
                    type: "COMMAND_NAME"
                    info: "Parses a record field and puts the result(s) into one or\
                      \ more fields as specified in the pattern."
                    synopsis: "parse expression, pattern [, preserveFieldsOnFailure]\
                      \ [, parsingPrerequisite]"
                  - suggestion: " "
                    type: "SPACE"
                  alreadyTypedCharacters: 5
                  suggestion: "parse "
                optional: false
              schema:
                $ref: "#/components/schemas/AutocompleteResponse"
          description: "Returns the autocomplete suggestions for the DQL processor\
            \ script."
        "4XX":
          content:
            application/json; charset=utf-8:
              example:
                error:
                  code: 400
                  message: "Bad request."
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
          description: "Client-side error."
        "5XX":
          content:
            application/json; charset=utf-8:
              example:
                error:
                  code: 500
                  message: "Internal server error."
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
          description: "Server-side error."
      security:
      - ssoAuth:
        - "openpipeline:configurations:read"
      - ssoBearerAuth: []
      summary: "Returns autocompletion suggestions for the given DQL processor script."
      tags:
      - "DQL Processor"
      description: "**Required scope:** openpipeline:configurations:read"
  /dqlProcessor/verify:
    post:
      operationId: "dqlProcessorVerify"
      requestBody:
        content:
          application/json; charset=utf-8:
            example:
              script: "parse content, \"IPV4:ip LD HTTPDATE:time ']' LD:text\""
            schema:
              $ref: "#/components/schemas/DQLProcessorVerifyRequest"
        description: "Single DQL processor script to verify."
        required: true
      responses:
        "200":
          content:
            application/json; charset=utf-8:
              examples:
                Invalid DQL script:
                  description: "Invalid DQL script"
                  value:
                    valid: false
                    notifications:
                    - severity: "ERROR"
                      syntaxPosition:
                        start:
                          column: 1
                          index: 0
                          line: 1
                        end:
                          column: 6
                          index: 5
                          line: 1
                      message: "There's been an error during parsing: There's no command\
                        \ `parsee`."
                Valid DQL script:
                  description: "Valid DQL script"
                  value:
                    valid: true
                    notifications: []
              schema:
                $ref: "#/components/schemas/VerifyResponse"
          description: "Returns the verification result of the DQL processor script."
        "4XX":
          content:
            application/json; charset=utf-8:
              example:
                error:
                  code: 400
                  message: "Bad request."
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
          description: "Client-side error."
        "5XX":
          content:
            application/json; charset=utf-8:
              example:
                error:
                  code: 500
                  message: "Internal server error."
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
          description: "Server-side error."
      security:
      - ssoAuth:
        - "openpipeline:configurations:read"
      - ssoBearerAuth: []
      summary: "Verifies if the given DQL processor script is valid."
      tags:
      - "DQL Processor"
      description: "**Required scope:** openpipeline:configurations:read"
  /matcher/autocomplete:
    post:
      operationId: "matcherAutocomplete"
      requestBody:
        content:
          application/json; charset=utf-8:
            example:
              query: "match"
              cursorPosition: 5
            schema:
              $ref: "#/components/schemas/MatcherAutocompleteRequest"
        description: "Matcher and position to create suggestions for."
        required: true
      responses:
        "200":
          content:
            application/json; charset=utf-8:
              example:
                suggestions:
                - parts:
                  - suggestion: ""
                    type: "SIMPLE_IDENTIFIER"
                    info: "some custom field"
                  alreadyTypedCharacters: 0
                  suggestion: ""
                - parts:
                  - suggestion: "matchesPhrase"
                    type: "FUNCTION_NAME"
                    info: "Matches a phrase against the input string expression using\
                      \ token matchers."
                    synopsis: "matchesPhrase(expression, phrase [, caseSensitive])"
                  - suggestion: "("
                    type: "PARENTHESIS_OPEN"
                  alreadyTypedCharacters: 5
                  suggestion: "matchesPhrase("
                - parts:
                  - suggestion: "matchesValue"
                    type: "FUNCTION_NAME"
                    info: "Matches a value against the input expression using token\
                      \ matchers."
                    synopsis: "matchesValue(expression, value [, caseSensitive])"
                  - suggestion: "("
                    type: "PARENTHESIS_OPEN"
                  alreadyTypedCharacters: 5
                  suggestion: "matchesValue("
                - parts:
                  - suggestion: " "
                    type: "SPACE"
                  - suggestion: "*"
                    type: "OPERATOR"
                  - suggestion: " "
                    type: "SPACE"
                  alreadyTypedCharacters: 0
                  suggestion: " * "
                - parts:
                  - suggestion: " "
                    type: "SPACE"
                  - suggestion: "/"
                    type: "OPERATOR"
                  - suggestion: " "
                    type: "SPACE"
                  alreadyTypedCharacters: 0
                  suggestion: " / "
                - parts:
                  - suggestion: " "
                    type: "SPACE"
                  - suggestion: "%"
                    type: "OPERATOR"
                  - suggestion: " "
                    type: "SPACE"
                  alreadyTypedCharacters: 0
                  suggestion: " % "
                - parts:
                  - suggestion: " "
                    type: "SPACE"
                  - suggestion: "+"
                    type: "OPERATOR"
                  - suggestion: " "
                    type: "SPACE"
                  alreadyTypedCharacters: 0
                  suggestion: " + "
                - parts:
                  - suggestion: " "
                    type: "SPACE"
                  - suggestion: "-"
                    type: "OPERATOR"
                  - suggestion: " "
                    type: "SPACE"
                  alreadyTypedCharacters: 0
                  suggestion: " - "
                - parts:
                  - suggestion: " "
                    type: "SPACE"
                  - suggestion: "=="
                    type: "OPERATOR"
                  - suggestion: " "
                    type: "SPACE"
                  alreadyTypedCharacters: 0
                  suggestion: " == "
                - parts:
                  - suggestion: " "
                    type: "SPACE"
                  - suggestion: "!="
                    type: "OPERATOR"
                  - suggestion: " "
                    type: "SPACE"
                  alreadyTypedCharacters: 0
                  suggestion: " != "
                - parts:
                  - suggestion: " "
                    type: "SPACE"
                  - suggestion: "<"
                    type: "OPERATOR"
                  - suggestion: " "
                    type: "SPACE"
                  alreadyTypedCharacters: 0
                  suggestion: " < "
                - parts:
                  - suggestion: " "
                    type: "SPACE"
                  - suggestion: ">"
                    type: "OPERATOR"
                  - suggestion: " "
                    type: "SPACE"
                  alreadyTypedCharacters: 0
                  suggestion: " > "
                - parts:
                  - suggestion: " "
                    type: "SPACE"
                  - suggestion: "<="
                    type: "OPERATOR"
                  - suggestion: " "
                    type: "SPACE"
                  alreadyTypedCharacters: 0
                  suggestion: " <= "
                - parts:
                  - suggestion: " "
                    type: "SPACE"
                  - suggestion: ">="
                    type: "OPERATOR"
                  - suggestion: " "
                    type: "SPACE"
                  alreadyTypedCharacters: 0
                  suggestion: " >= "
                - parts:
                  - suggestion: " "
                    type: "SPACE"
                  - suggestion: "and"
                    type: "OPERATOR"
                  - suggestion: " "
                    type: "SPACE"
                  alreadyTypedCharacters: 0
                  suggestion: " and "
                - parts:
                  - suggestion: " "
                    type: "SPACE"
                  - suggestion: "xor"
                    type: "OPERATOR"
                  - suggestion: " "
                    type: "SPACE"
                  alreadyTypedCharacters: 0
                  suggestion: " xor "
                - parts:
                  - suggestion: " "
                    type: "SPACE"
                  - suggestion: "or"
                    type: "OPERATOR"
                  - suggestion: " "
                    type: "SPACE"
                  alreadyTypedCharacters: 0
                  suggestion: " or "
                - parts:
                  - suggestion: "|"
                    type: "PIPE"
                  alreadyTypedCharacters: 0
                  suggestion: "|"
                optional: true
              schema:
                $ref: "#/components/schemas/AutocompleteResponse"
          description: "Returns the autocomplete suggestions for the matcher."
        "4XX":
          content:
            application/json; charset=utf-8:
              example:
                error:
                  code: 400
                  message: "Bad request."
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
          description: "Client-side error."
        "5XX":
          content:
            application/json; charset=utf-8:
              example:
                error:
                  code: 500
                  message: "Internal server error."
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
          description: "Server-side error."
      security:
      - ssoAuth:
        - "openpipeline:configurations:read"
      - ssoBearerAuth: []
      summary: "Returns autocompletion suggestions for the given matcher."
      tags:
      - "Matcher"
      description: "**Required scope:** openpipeline:configurations:read"
  /matcher/lqlToDql:
    post:
      operationId: "matcherLqlToDql"
      requestBody:
        content:
          application/json; charset=utf-8:
            example:
              query: "log.source=\"snmptraps\" AND snmp.trap_oid=\"F5-BIGIP-COMMON-MIB\""
            schema:
              $ref: "#/components/schemas/MatcherRequest"
        description: "Valid LQL matcher for conversion."
        required: true
      responses:
        "200":
          content:
            application/json; charset=utf-8:
              example:
                query: "matchesValue(log.source, \"snmptraps\") and matchesValue(snmp.trap_oid,\
                  \ \"F5-BIGIP-COMMON-MIB\")"
              schema:
                $ref: "#/components/schemas/MatcherRequest"
          description: "Returns the converted LQL matcher in DQL format."
        "4XX":
          content:
            application/json; charset=utf-8:
              example:
                error:
                  code: 400
                  message: "Bad request."
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
          description: "Client-side error."
        "5XX":
          content:
            application/json; charset=utf-8:
              example:
                error:
                  code: 500
                  message: "Internal server error."
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
          description: "Server-side error."
      security:
      - ssoAuth:
        - "openpipeline:configurations:read"
      - ssoBearerAuth: []
      summary: "Translates the given LQL matcher into a DQL matcher."
      tags:
      - "Matcher"
      description: "**Required scope:** openpipeline:configurations:read"
  /matcher/verify:
    post:
      operationId: "matcherVerify"
      requestBody:
        content:
          application/json; charset=utf-8:
            example:
              query: "matchesValue(type, \"security\")"
            schema:
              $ref: "#/components/schemas/MatcherVerifyRequest"
        description: "Single matcher to verify."
        required: true
      responses:
        "200":
          content:
            application/json; charset=utf-8:
              examples:
                Invalid matcher:
                  description: "Invalid matcher"
                  value:
                    valid: false
                    notifications:
                    - severity: "ERROR"
                      syntaxPosition:
                        start:
                          column: 1
                          index: 0
                          line: 1
                        end:
                          column: 6
                          index: 5
                          line: 1
                      message: "There's been an error during parsing: There's no command\
                        \ `parsee`."
                Valid matcher:
                  description: "Valid matcher"
                  value:
                    valid: true
                    notifications: []
              schema:
                $ref: "#/components/schemas/VerifyResponse"
          description: "Returns the verification result of the matcher."
        "4XX":
          content:
            application/json; charset=utf-8:
              example:
                error:
                  code: 400
                  message: "Bad request."
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
          description: "Client-side error."
        "5XX":
          content:
            application/json; charset=utf-8:
              example:
                error:
                  code: 500
                  message: "Internal server error."
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
          description: "Server-side error."
      security:
      - ssoAuth:
        - "openpipeline:configurations:read"
      - ssoBearerAuth: []
      summary: "Verifies if the given matcher is valid."
      tags:
      - "Matcher"
      description: "**Required scope:** openpipeline:configurations:read"
  /preview/processor:
    post:
      operationId: "previewSingle"
      requestBody:
        content:
          application/json; charset=utf-8:
            example:
              processor:
                type: "fieldsRename"
                enabled: false
                editable: true
                id: "hostname-field-normalizer"
                description: "hostname field normalizer"
                matcher: "isNotNull(\"hostname\")"
                sampleData: "{\"hostname\": \"raspberry-pi 4\",\"ip\":\"10.0.0.123\"\
                  }"
                fields:
                - fromName: "hostname"
                  toName: "host.name"
                - fromName: "ip"
                  toName: "ip.address"
            schema:
              $ref: "#/components/schemas/PreviewProcessorEnvelope"
        description: "The processor with sample-data to preview."
        required: true
      responses:
        "200":
          content:
            application/json; charset=utf-8:
              example:
                results:
                - matched: true
                  record:
                    ip.address: "10.0.0.123"
                    host.name: "raspberry-pi 4"
                    timestamp: "2024-06-24T07:21:52.200000000Z"
              schema:
                $ref: "#/components/schemas/PreviewProcessorResult"
          description: "Preview result containing the processed sample data record."
        "408":
          content:
            application/json; charset=utf-8:
              example:
                error:
                  code: 408
                  message: "Preview run resulted in a timeout."
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
          description: "Preview run resulted in a timeout."
        "429":
          content:
            application/json; charset=utf-8:
              example:
                error:
                  code: 429
                  message: "Failed. Too many requests."
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
          description: "Too many concurrent preview requests."
        "4XX":
          content:
            application/json; charset=utf-8:
              example:
                error:
                  code: 400
                  message: "Bad request."
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
          description: "Client-side error."
        "5XX":
          content:
            application/json; charset=utf-8:
              example:
                error:
                  code: 500
                  message: "Internal server error."
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
          description: "Server-side error."
      security:
      - ssoAuth:
        - "openpipeline:configurations:read"
      - ssoBearerAuth: []
      summary: "Returns the preview result for a given processor and sample data."
      tags:
      - "Preview"
      x-only-visible-in-saas: true
      description: "**Required scope:** openpipeline:configurations:read"
  /technologies:
    get:
      operationId: "getAllTechnologies"
      parameters:
      - description: "Contains a configuration ID as a string to filter the technologies\
          \ by."
        in: "query"
        name: "configurationsFilter"
        schema:
          type: "string"
      responses:
        "200":
          content:
            application/json; charset=utf-8:
              example:
              - groupId: "ElasticSearch"
                technologies:
                - id: "elasticsearch_9430_v2"
                  name: "ElasticSearch Logs parser"
                  iconUrl: "/icons/elastic"
                  sampleData: "{}"
                  shortDescription: "ElasticSearch technology"
                  fullDescription: "ElasticSearch technology parsers"
                  tags:
                  - "slow"
                  - "log"
                  - "elastic"
                  matcher: "matchesValue(process.technology, \"elastic_search\") or\
                    \ matchesValue(process.technology, \"elasticsearch\")"
                  allowedConfigurations:
                  - "logs"
                  - "events.sdlc"
                  deprecated: false
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/TechnologyGroup"
          description: "List of available technology bundles grouped by a technology\
            \ group name."
        "4XX":
          content:
            application/json; charset=utf-8:
              example:
                error:
                  code: 400
                  message: "Bad request."
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
          description: "Client-side error."
        "5XX":
          content:
            application/json; charset=utf-8:
              example:
                error:
                  code: 500
                  message: "Internal server error."
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
          description: "Server-side error."
      security:
      - ssoAuth:
        - "openpipeline:configurations:read"
      - ssoBearerAuth: []
      summary: "Returns all technology bundles. | maturity=EARLY_ADOPTER"
      tags:
      - "Technology"
      x-maturity: "EARLY_ADOPTER"
      x-only-visible-in-saas: true
      description: "**Required scope:** openpipeline:configurations:read"
  /technologies/{id}/processors:
    get:
      operationId: "processorsForTechnologyId"
      parameters:
      - description: "The ID of a technology bundle."
        in: "path"
        name: "id"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          content:
            application/json; charset=utf-8:
              example:
              - type: "dql"
                enabled: true
                editable: false
                id: "es_slow_log"
                description: "ES Slow Log Index"
                matcher: "matchesPhrase(content, \"index.indexing.slowlog*\")"
                sampleData: "{}"
                dqlScript: "parse content, \"'[' TIMESTAMP('yyyy-MM-ddTHH:mm:ss,SSS'):timestamp\
                  \ ']' PUNCT?\nSPACE? '[' UPPER:loglevel SPACE* ']' PUNCT?\nSPACE?\
                  \ '[index.indexing.slowlog.' LD:'db.operation' ']' PUNCT?\nSPACE?\
                  \ '[' LD:'db.elasticsearch.node' ']' PUNCT?\n(SPACE? '{' LD '}')?\
                  \ //metadata, dt.trace_id\nSPACE? '[' LD?:'db.elasticsearch.index_name'\
                  \ ']' PUNCT?\nSPACE? 'took[' LD ']' PUNCT?\nSPACE? 'took_millis['\
                  \ INT:'db.elasticsearch.duration' ']' PUNCT?\nDATA\"\n"
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/ProcessingStageProcessor"
          description: "List of all processors within a specific technology bundle."
        "4XX":
          content:
            application/json; charset=utf-8:
              example:
                error:
                  code: 400
                  message: "Bad request."
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
          description: "Client-side error."
        "5XX":
          content:
            application/json; charset=utf-8:
              example:
                error:
                  code: 500
                  message: "Internal server error."
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
          description: "Server-side error."
      security:
      - ssoAuth:
        - "openpipeline:configurations:read"
      - ssoBearerAuth: []
      summary: "Returns all processors for a technology bundle. | maturity=EARLY_ADOPTER"
      tags:
      - "Technology"
      x-maturity: "EARLY_ADOPTER"
      x-only-visible-in-saas: true
      description: "**Required scope:** openpipeline:configurations:read"
components:
  schemas:
    AutocompleteResponse:
      type: "object"
      description: "The response of the autocomplete call."
      properties:
        optional:
          type: "boolean"
          description: "True if the suggestions are optional."
        suggestedTtlSeconds:
          type: "integer"
          format: "int32"
          description: "Suggested duration, in seconds, for how long the response\
            \ can be cached and reused by the client. It's derived from the volatility\
            \ of the suggestions on the server (such as if the suggestions are static,\
            \ how long the server will cache the volatile suggestions, etc.). If no\
            \ value is provided, the result might be cached for a long time. If the\
            \ value is lower than `1`, the result won't be cached."
        suggestions:
          type: "array"
          description: "The list of suggestions."
          items:
            $ref: "#/components/schemas/AutocompleteSuggestion"
      required:
      - "optional"
      - "suggestions"
    AutocompleteSuggestion:
      type: "object"
      description: "Single suggestion for completion of the query."
      properties:
        alreadyTypedCharacters:
          type: "integer"
          format: "int32"
          description: "Number of characters that the user already typed for this\
            \ suggestion."
        parts:
          type: "array"
          description: "List of suggestion parts."
          items:
            $ref: "#/components/schemas/AutocompleteSuggestionPart"
        suggestion:
          type: "string"
          description: "The suggested continuation of the input."
      required:
      - "alreadyTypedCharacters"
      - "parts"
      - "suggestion"
    AutocompleteSuggestionPart:
      type: "object"
      description: "Part of the suggestion."
      properties:
        info:
          type: "string"
          description: "The type of the suggestion."
        suggestion:
          type: "string"
          description: "The suggested continuation of the input."
        synopsis:
          type: "string"
          description: "The synopsis of the suggestion."
        type:
          type: "string"
          description: "The type of the autocomplete token."
          enum:
          - "ASSIGNMENT"
          - "BOOLEAN_FALSE"
          - "BOOLEAN_TRUE"
          - "BRACE_CLOSE"
          - "BRACE_OPEN"
          - "BRACKET_CLOSE"
          - "BRACKET_OPEN"
          - "COLON"
          - "COMMA"
          - "COMMAND_NAME"
          - "DATA_OBJECT"
          - "DOT"
          - "END_COMMENT"
          - "ENTITY_ATTRIBUTE"
          - "ENTITY_SELECTOR_PART"
          - "ENTITY_TYPE"
          - "FIELD_MODIFIER"
          - "FIELD_PATTERN"
          - "FUNCTION_NAME"
          - "INDENT"
          - "LINEBREAK"
          - "METRIC_KEY"
          - "NULL"
          - "NUMBER"
          - "OPERATOR"
          - "PARAMETER_KEY"
          - "PARAMETER_VALUE_SCOPE"
          - "PARENTHESIS_CLOSE"
          - "PARENTHESIS_OPEN"
          - "PARSE_PATTERN"
          - "PIPE"
          - "QUOTE"
          - "SIMPLE_IDENTIFIER"
          - "SINGLE_QUOTE"
          - "SLASH"
          - "SPACE"
          - "STRING"
          - "TIMESERIES_AGGREGATION"
          - "TIMESERIES_AGGREGATION_EXPRESSION"
          - "TIMESTAMP_VALUE"
          - "TIME_UNIT"
          - "TRAVERSAL_HOP_COUNT"
          - "TRAVERSAL_OPERATOR"
          - "TRAVERSAL_RELATION_NAME"
          - "UID_VALUE"
          - "VARIABLE"
      required:
      - "suggestion"
      - "type"
    BucketsSpecification:
      type: "object"
      description: "Contains information about allowed buckets for the configuration."
      properties:
        bucketTable:
          type: "string"
          description: "The bucket table containing the allowed buckets for the configuration."
