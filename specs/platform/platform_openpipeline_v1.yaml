      - "enabled"
      - "id"
      - "technologyId"
    TokenPosition:
      type: "object"
      description: "The position of a token in the input string used for errors and\
        \ notification to map the message to a specific part of the input."
      properties:
        end:
          $ref: "#/components/schemas/PositionInfo"
        start:
          $ref: "#/components/schemas/PositionInfo"
      required:
      - "end"
      - "start"
    ValueAssignment:
      type: "object"
      description: "Strategy to assign a value."
      discriminator:
        mapping:
          constant: "#/components/schemas/ConstantValueAssignment"
          field: "#/components/schemas/FieldValueAssignment"
          multiValueConstant: "#/components/schemas/ConstantMultiValueAssignment"
        propertyName: "type"
      properties:
        type:
          type: "string"
          description: "Defines the actual set of fields depending on the value. See\
            \ one of the following objects: \n\n* `constant` -> ConstantValueAssignment\
            \ \n* `field` -> FieldValueAssignment \n* `multiValueConstant` -> ConstantMultiValueAssignment\
            \ \n"
          enum:
          - "constant"
          - "field"
          - "multiValueConstant"
      required:
      - "type"
    ValueMetricExtractionProcessor:
      type: "object"
      description: "Processor to extract a value from a field as a metric."
      properties:
        builtin:
          type: "boolean"
          default: false
          description: "Indicates if Dynatrace provides the object or if it's customer-defined."
        defaultValue:
          type: "string"
          description: "The default value to use if the given field value could not\
            \ be extracted. String value must be a number."
        description:
          type: "string"
          description: "Name or description of the processor."
        dimensions:
          type: "array"
          description: "List of unique dimensions to add to the metric. Dimensions\
            \ are represented in the format `({dimensionName}=)?{sourceField}`. `{dimensionName}`\
            \ is optional if `{sourceField}` represents a valid metric dimension name.\
            \ `{sourceField}` has to represent a valid DQL field accessor and it can\
            \ access a nested field (for example, `field[field2][0]`)."
          items:
            type: "string"
            description: "List of unique dimensions to add to the metric. Dimensions\
              \ are represented in the format `({dimensionName}=)?{sourceField}`.\
              \ `{dimensionName}` is optional if `{sourceField}` represents a valid\
              \ metric dimension name. `{sourceField}` has to represent a valid DQL\
              \ field accessor and it can access a nested field (for example, `field[field2][0]`)."
            pattern: "^(([a-zA-Z_][.a-zA-Z0-9_\\-:]+)=)?(([.a-zA-Z0-9_]*|`.*`|[\\\
              [\\]])+)$"
          pattern: "^(([a-zA-Z_][.a-zA-Z0-9_\\-:]+)=)?(([.a-zA-Z0-9_]*|`.*`|[\\[\\\
            ]])+)$"
        editable:
          type: "boolean"
          description: "Indicates if the user can edit this object based on permissions\
            \ and builtin property."
          readOnly: true
        enabled:
          type: "boolean"
          description: "Indicates if the object is active."
        field:
          type: "string"
          description: "The field to extract the value for the metric."
        id:
          type: "string"
          description: "Processor identifier, which must be unique within a stage."
        matcher:
          type: "string"
          description: "Matching condition to apply to incoming records."
        metricKey:
          type: "string"
          description: "The key of the metric to write."
        sampleData:
          type: "string"
          description: "Sample data related to the processor for documentation or\
            \ testing."
      required:
      - "description"
      - "enabled"
      - "field"
      - "id"
      - "matcher"
      - "metricKey"
    VerifyResponse:
      type: "object"
      description: "Verify response."
      properties:
        notifications:
          type: "array"
          description: "The notifications related to the supplied input string."
          items:
            $ref: "#/components/schemas/MetadataNotification"
        valid:
          type: "boolean"
          description: "True if the supplied input string is valid."
      required:
      - "valid"
  securitySchemes:
    ssoAuth:
      description: "Dynatrace OAuth\n\n A Bearer token is passed in the **Authorization**\
        \ header in the following format: `Authorization: Bearer abcdefjhij1234567890`."
      flows:
        clientCredentials:
          scopes:
            openpipeline:configurations:read: "Read the OpenPipeline configuration"
            openpipeline:configurations:write: "Write the OpenPipeline configuration"
          tokenUrl: "https://sso-sprint.dynatracelabs.com/sso/oauth2/token"
      type: "oauth2"
    ssoBearerAuth:
      type: "http"
      scheme: "bearer"
      description: "The value can be either an OAuth2 access token or a platform token.</br>\
        \ For further information about platform tokens see <a href=\"https://dt-url.net/platform-tokens\"\
        \ target=\"_blank\">Platform tokens - Dynatrace Docs</a>."
