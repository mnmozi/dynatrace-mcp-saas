openapi: "3.0.1"
info:
  description: "\nFetch and update OpenPipeline configurations for different data\
    \ sources.\n\nTo read about use cases and examples, see [Dynatrace Documentation](https://dt-url.net/openpipeline-pipelines-docs).\n\
    \nTo authorize, use a valid OAuth token.\n\nNotes about compatibility:\n* Operations\
    \ marked as early adopter or preview may be changed in non-compatible ways, although\
    \ we try to avoid this.\n* We may add new enum constants without incrementing\
    \ the API version; thus, clients need to handle unknown enum constants gracefully."
  title: "OpenPipeline v1"
  version: "1.37.0"
  x-service-category: "OpenPipeline"
  x-summary: "Fetch and update OpenPipeline configurations for different data sources."
servers:
- url: "https://asn8731h.sprint.apps.dynatracelabs.com/platform/openpipeline/v1"
  x-api-gateway-url: "/platform/openpipeline/v1"
tags:
- description: "Allows you to view and update your configurations."
  name: "Configurations"
- description: "Allows you to preview the impact of configuration changes."
  name: "Preview"
- description: "Allows you to verify and retrieve suggestions for matchers."
  name: "Matcher"
- description: "Allows you to verify and retrieve suggestions for DQL processor scripts."
  name: "DQL Processor"
- description: "Allows you to view all technology bundles and the associated processors."
  name: "Technology"
paths:
  /configurations:
    get:
      operationId: "configurations"
      parameters:
      - description: "Returns results only for the selected configuration."
        in: "query"
        name: "configurationId"
        schema:
          type: "string"
      responses:
        "200":
          content:
            application/json; charset=utf-8:
              example:
              - id: "logs"
                editable: false
                definition:
                  endpointsSpecification:
                    customEndpoints: false
                  pipelinesSpecification:
                    processing:
                    - "drop"
                    - "fieldsRemove"
                    - "fieldsRename"
                    - "technology"
                    - "dql"
                    - "fieldsAdd"
                    dataExtraction:
                    - "bizevent"
                    - "davis"
                    metricExtraction:
                    - "valueMetric"
                    - "counterMetric"
                    securityContext:
                    - "securityContext"
                    storage:
                    - "noStorage"
                    - "bucketAssignment"
                  metricKeyPrefix: "log"
                  bucketsSpecification:
                    defaultBucket: "default_logs"
                    bucketTable: "logs"
              - id: "events"
                editable: false
                definition:
                  endpointsSpecification:
                    customEndpoints: true
                  pipelinesSpecification:
                    processing:
                    - "drop"
                    - "fieldsRemove"
                    - "fieldsRename"
                    - "dql"
                    - "fieldsAdd"
                    dataExtraction:
                    - "davis"
                    metricExtraction:
                    - "valueMetric"
                    - "counterMetric"
                    securityContext:
                    - "securityContext"
                    storage:
                    - "noStorage"
                    - "bucketAssignment"
                  metricKeyPrefix: "events"
                  bucketsSpecification:
                    defaultBucket: "default_events"
                    bucketTable: "events"
              - id: "bizevents"
                editable: false
                definition:
                  endpointsSpecification:
                    customEndpoints: false
                  pipelinesSpecification:
                    processing:
                    - "drop"
                    - "fieldsRemove"
                    - "fieldsRename"
                    - "dql"
                    - "fieldsAdd"
                    dataExtraction:
                    - "davis"
                    metricExtraction:
                    - "valueMetric"
                    - "counterMetric"
                    securityContext:
                    - "securityContext"
                    storage:
                    - "noStorage"
                    - "bucketAssignment"
                  metricKeyPrefix: "bizevents"
                  bucketsSpecification:
                    defaultBucket: "default_bizevents"
                    bucketTable: "bizevents"
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/ConfigurationListItem"
          description: "List of available configurations."
        "4XX":
          content:
            application/json; charset=utf-8:
              example:
                error:
                  code: 400
                  message: "Bad request."
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
          description: "Client-side error."
        "5XX":
          content:
            application/json; charset=utf-8:
              example:
                error:
                  code: 500
                  message: "Internal server error."
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
          description: "Server-side error."
      security:
      - ssoAuth:
        - "openpipeline:configurations:read"
      - ssoBearerAuth: []
      summary: "Returns the list of available configuration identifiers."
      tags:
      - "Configurations"
      x-only-visible-in-saas: true
      description: "**Required scope:** openpipeline:configurations:read"
  /configurations/{id}:
    get:
      deprecated: true
      description: "**Required scope:** openpipeline:configurations:read<br/><br/>Deprecated.\
        \ Use the [Settings API](https://docs.dynatrace.com/docs/discover-dynatrace/references/dynatrace-api/environment-api/settings)\
        \ with OpenPipeline schemas `builtin:openpipeline.<configuration.scope>.routing`,\
        \ `builtin:openpipeline.<configuration.scope>.pipelines`, and `builtin:openpipeline.<configuration.scope>.ingest-sources`\
        \ for each configuration scope.\nFurther details can be found in the [migration\
        \ guide](https://docs.dynatrace.com/docs/discover-dynatrace/platform/openpipeline/migration-settings)."
      operationId: "configurationById"
      parameters:
      - description: "Identifier of the configuration."
        in: "path"
        name: "id"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          content:
            application/json; charset=utf-8:
              example:
                id: "events"
                editable: false
                version: "1719220519649-ff2897a62cf849b0baa95e71fa4d5f1f"
                updateToken: "NzgyMTVjYzAtOWYwNC0zZjQ1LWFmNzgtMWQ3OWZjNzdkYjMwX2E3YzZkN2QwLTdmMzctMTFlZi04MDAxLTAxMDAwMDAwMDAwMQ=="
                customBasePath: "/platform/ingest/custom/events"
                endpoints:
                - enabled: true
                  builtin: false
                  editable: false
                  basePath: "/platform/ingest/custom/events"
                  segment: "home"
                  displayName: "Endpoint for home automation"
                  defaultBucket: "home_automation_events"
                  processors:
                  - type: "fieldsRename"
                    enabled: false
                    editable: true
                    id: "hostname-field-normalizer"
                    description: "hostname field normalizer"
                    matcher: "isNotNull(\"hostname\")"
                    sampleData: "{\"hostname\": \"raspberry-pi 4\",\"ip\":\"10.0.0.123\"\
                      }"
                    fields:
                    - fromName: "hostname"
                      toName: "host.name"
                    - fromName: "ip"
                      toName: "ip.address"
                  - type: "fieldsAdd"
                    enabled: false
                    editable: true
                    id: "add-source-field"
                    description: "Add source field"
                    matcher: "true"
                    sampleData: "{\"hostname\": \"raspberry-pi 4\",\"ip\":\"10.0.0.123\"\
                      }"
                    fields:
                    - name: "source"
                      value: "home-automation"
                  routing:
                    type: "dynamic"
                - enabled: true
                  builtin: true
                  editable: false
                  basePath: "/platform/ingest/v1/events"
                  segment: ""
                  source: "/platform/ingest/v1/events"
                  displayName: "Default API"
                  processors: []
                  routing:
                    type: "dynamic"
                pipelines:
                - type: "default"
                  enabled: true
                  editable: false
                  id: "home-automation"
                  builtin: false
                  displayName: "Home automation pipeline"
                  storage:
                    editable: false
                    catchAllBucketName: "home_automation_events"
                    processors:
                    - type: "noStorage"
                      id: "don-not-store-debug-events"
                      description: "Do not store debugging events"
                      enabled: true
                      editable: false
                      matcher: "severity==\"debug\""
                      sampleData: "{}"
                    - type: "bucketAssignment"
                      enabled: true
                      editable: false
                      id: "bucket-assignment-security-relevent-events"
                      description: "Store security-relevant events in a dedicated\
                        \ bucket"
                      matcher: "type==\"security\""
                      sampleData: "{}"
                      bucketName: "home_automation_security_events"
                  securityContext:
                    editable: false
                    processors:
                    - type: "securityContext"
                      id: "security-context"
                      description: "Mark security context for supervisors"
                      enabled: true
                      editable: false
                      matcher: "type==\"security\""
                      sampleData: "{}"
                      value:
                        type: "constant"
                        constant: "supervisors"
                  metricExtraction:
                    editable: false
                    processors:
                    - type: "counterMetric"
                      id: "click-counter-metric"
                      description: "Counts the clicks on a button"
                      enabled: true
                      editable: true
                      matcher: "device.type==\"button\""
                      sampleData: "{}"
                      metricKey: "events.home.button.click"
                      dimensions:
                      - "device.name"
                      - "device.location"
                    - type: "valueMetric"
                      id: "temperature-value-metric"
                      description: "description"
                      enabled: true
                      editable: true
                      matcher: "device.type==\"temperature-sensor\""
                      sampleData: "{}"
                      metricKey: "events.home.temperature"
                      dimensions:
                      - "device.name"
                      - "device.location"
                      field: "temperature"
                  dataExtraction:
                    editable: false
                    processors: []
                  processing:
                    editable: false
                    processors: []
                - type: "default"
                  enabled: true
                  editable: false
                  id: "default"
                  builtin: true
                  displayName: "events"
                  storage:
                    editable: false
                    catchAllBucketName: "default_events"
                    processors: []
                  securityContext:
                    editable: false
                    processors: []
                  metricExtraction:
                    editable: false
                    processors: []
                  dataExtraction:
                    editable: false
                    processors: []
                  processing:
                    editable: false
                    processors: []
                routing:
                  editable: false
                  catchAllPipeline:
                    editable: false
                    pipelineId: "default"
                  entries:
                  - enabled: true
                    editable: false
                    builtin: false
                    pipelineId: "home-automation"
                    matcher: "source==\"home-automation\""
                    note: "Route all home automation events into a dedicated pipeline."
              schema:
                $ref: "#/components/schemas/Configuration"
          description: "Full configuration of the requested identifier."
          headers:
            Deprecation:
              required: true
              schema:
                oneOf:
                - type: "boolean"
                - type: "string"
              style: "simple"
            Sunset:
              required: true
              schema:
                type: "string"
              style: "simple"
        "404":
          content:
            application/json; charset=utf-8:
              example:
                error:
                  code: 404
                  message: "Migration in-progress/completed, the requested resource\
                    \ is no longer available."
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
          description: "Migration in-progress/completed, the requested resource is\
            \ no longer available."
          headers:
            Deprecation:
              required: true
              schema:
                oneOf:
                - type: "boolean"
                - type: "string"
              style: "simple"
            Sunset:
              required: true
              schema:
                type: "string"
              style: "simple"
        "4XX":
          content:
            application/json; charset=utf-8:
              example:
                error:
                  code: 400
                  message: "Bad request."
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
          description: "Client-side error."
        "5XX":
          content:
            application/json; charset=utf-8:
              example:
                error:
                  code: 500
                  message: "Internal server error."
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
          description: "Server-side error."
      security:
      - ssoAuth:
        - "openpipeline:configurations:read"
      - ssoBearerAuth: []
      summary: "Returns the configuration for a given identifier."
      tags:
      - "Configurations"
      x-only-visible-in-saas: true
    put:
      deprecated: true
      description: "**Required scope:** openpipeline:configurations:write<br/><br/>Deprecated.\
        \ Use the [Settings API](https://docs.dynatrace.com/docs/discover-dynatrace/references/dynatrace-api/environment-api/settings)\
        \ with OpenPipeline schemas `builtin:openpipeline.<configuration.scope>.routing`,\
        \ `builtin:openpipeline.<configuration.scope>.pipelines`, and `builtin:openpipeline.<configuration.scope>.ingest-sources`\
        \ for each configuration scope.\nFurther details can be found in the [migration\
        \ guide](https://docs.dynatrace.com/docs/discover-dynatrace/platform/openpipeline/migration-settings).\n\
        \nNOTE: Objects with builtin set to 'true' and pipeline definitions of type\
        \ 'classic' will be accepted but aren't saved."
      operationId: "updateConfigurationById"
      parameters:
      - description: "Identifier of the configuration."
        in: "path"
        name: "id"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json; charset=utf-8:
            example:
