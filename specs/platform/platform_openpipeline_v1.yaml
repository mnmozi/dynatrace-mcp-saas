                type: "fieldsRename"
                enabled: false
                editable: true
                id: "hostname-field-normalizer"
                description: "hostname field normalizer"
                matcher: "isNotNull(\"hostname\")"
                sampleData: "{\"hostname\": \"raspberry-pi 4\",\"ip\":\"10.0.0.123\"\
                  }"
                fields:
                - fromName: "hostname"
                  toName: "host.name"
                - fromName: "ip"
                  toName: "ip.address"
