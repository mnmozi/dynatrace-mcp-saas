                    host.name: "raspberry-pi 4"
                    timestamp: "2024-06-24T07:21:52.200000000Z"
              schema:
                $ref: "#/components/schemas/PreviewProcessorResult"
          description: "Preview result containing the processed sample data record."
        "408":
          content:
            application/json; charset=utf-8:
              example:
                error:
                  code: 408
                  message: "Preview run resulted in a timeout."
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
          description: "Preview run resulted in a timeout."
        "429":
          content:
            application/json; charset=utf-8:
              example:
                error:
                  code: 429
                  message: "Failed. Too many requests."
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
          description: "Too many concurrent preview requests."
        "4XX":
          content:
            application/json; charset=utf-8:
              example:
                error:
                  code: 400
                  message: "Bad request."
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
          description: "Client-side error."
        "5XX":
          content:
            application/json; charset=utf-8:
              example:
                error:
                  code: 500
                  message: "Internal server error."
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
          description: "Server-side error."
      security:
      - ssoAuth:
        - "openpipeline:configurations:read"
      - ssoBearerAuth: []
      summary: "Returns the preview result for a given processor and sample data."
      tags:
      - "Preview"
