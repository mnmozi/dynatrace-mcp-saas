    PositionInfo:
      type: "object"
      description: "The exact position in the query string."
      properties:
        column:
          type: "integer"
          format: "int32"
          description: "Input string position column zero based index."
        index:
          type: "integer"
          format: "int32"
          description: "Input string position index."
        line:
          type: "integer"
          format: "int32"
          description: "Input string position line zero based index."
      required:
      - "column"
      - "index"
      - "line"
    PreviewProcessor:
      type: "object"
      description: "The processor to execute for the preview. Applicable processors\
        \ are DqlProcessor, FieldsAddProcessor, FieldsRemoveProcessor, FieldsRenameProcessor,\
        \ TechnologyProcessor, GeoLookupProcessor, and InlineLookupProcessor."
      oneOf:
      - $ref: "#/components/schemas/DqlProcessor"
      - $ref: "#/components/schemas/FieldsAddProcessor"
      - $ref: "#/components/schemas/FieldsRemoveProcessor"
      - $ref: "#/components/schemas/FieldsRenameProcessor"
      - $ref: "#/components/schemas/TechnologyProcessor"
      - $ref: "#/components/schemas/GeoLookupProcessor"
      - $ref: "#/components/schemas/InlineLookupProcessor"
    PreviewProcessorEnvelope:
      type: "object"
      properties:
        configId:
          type: "string"
          description: "Identifier of the configuration."
        processor:
          $ref: "#/components/schemas/PreviewProcessor"
        scope:
          type: "string"
          description: "The scope in which the processor is previewed in."
          enum:
          - "ENDPOINT"
          - "PIPELINE"
      required:
      - "processor"
    PreviewProcessorResult:
      type: "object"
      properties:
        results:
          type: "array"
          description: "List of results for each sample data record."
          items:
            $ref: "#/components/schemas/PreviewProcessorResultEntry"
      required:
      - "results"
    PreviewProcessorResultEntry:
      type: "object"
      description: "Preview result for a single sample data record."
      properties:
        matched:
          type: "boolean"
          description: "Indicates if the record matched the processors matching condition."
        matchedProcessors:
          type: "array"
          description: "Contains matched processors IDs, useful in case of multi-processors\
            \ preview like in case of Technology."
          items:
            type: "string"
            description: "Contains matched processors IDs, useful in case of multi-processors\
              \ preview like in case of Technology."
        record:
          type: "object"
          additionalProperties: true
          description: "The altered record after the processor was applied."
      required:
      - "matched"
      - "matchedProcessors"
      - "record"
    ProcessingStageProcessor:
      type: "object"
      description: "Groups all processors applicable for the ProcessingStage.\nApplicable\
        \ processors are DqlProcessor, FieldsAddProcessor, FieldsRemoveProcessor,\
        \ FieldsRenameProcessor, TechnologyProcessor, and DropProcessor."
      oneOf:
      - $ref: "#/components/schemas/DqlProcessor"
      - $ref: "#/components/schemas/FieldsAddProcessor"
      - $ref: "#/components/schemas/FieldsRemoveProcessor"
      - $ref: "#/components/schemas/FieldsRenameProcessor"
      - $ref: "#/components/schemas/TechnologyProcessor"
      - $ref: "#/components/schemas/DropProcessor"
      required:
      - "enabled"
      - "id"
    Technology:
      type: "object"
      description: "A technology bundle that represents a specific technology."
      properties:
        allowedConfigurations:
          type: "array"
          description: "List of configurations this technology is available for."
          items:
            type: "string"
            description: "List of configurations this technology is available for."
        deprecated:
          type: "boolean"
          description: "Marks the technology bundle as deprecated."
        fullDescription:
          type: "string"
          description: "Detailed description of the specific technology and contents\
            \ of the bundle."
        iconUrl:
          type: "string"
          description: "URL to fetch the associated icon for the technology."
        id:
          type: "string"
          description: "Identifier of the technology bundle."
        matcher:
          type: "string"
          description: "Matching condition to apply to incoming records."
        name:
          type: "string"
          description: "Name of the technology bundle."
        replacementId:
          type: "string"
          description: "The identifier of a technology bundle which should be used\
            \ instead of this deprecated bundle."
        sampleData:
          type: "string"
          description: "Sample data of the specific technology."
        shortDescription:
          type: "string"
          description: "Summary about the specific technology."
        tags:
          type: "array"
          description: "Tags to categorize the specific technology."
          items:
            type: "string"
            description: "Tags to categorize the specific technology."
      required:
      - "deprecated"
      - "id"
      - "name"
    TechnologyGroup:
      type: "object"
      description: "Technology group with name and a list of technology bundles."
      properties:
        groupId:
          type: "string"
          description: "Identifier of the technology group."
        technologies:
          type: "array"
          description: "List of technology bundles."
          items:
            $ref: "#/components/schemas/Technology"
      required:
      - "groupId"
      - "technologies"
    TechnologyProcessor:
      type: "object"
      description: "Processor to apply a technology processors."
      properties:
        builtin:
          type: "boolean"
          default: false
          description: "Indicates if Dynatrace provides the object or if it's customer-defined."
        customMatcher:
          type: "string"
          description: "Optional customer-defined matching condition, that's used\
            \ in place of the main technology matcher."
          nullable: true
        editable:
          type: "boolean"
          description: "Indicates if the user can edit this object based on permissions\
            \ and builtin property."
          readOnly: true
        enabled:
          type: "boolean"
          description: "Indicates if the object is active."
        id:
          type: "string"
          description: "Processor identifier, which must be unique within a stage."
        sampleData:
          type: "string"
          description: "Sample data related to the processor for documentation or\
            \ testing."
        technologyId:
          type: "string"
          description: "The reference identifier to a specific technology. This technology\
            \ is applied on the record."
      required:
      - "enabled"
      - "id"
      - "technologyId"
    TokenPosition:
      type: "object"
      description: "The position of a token in the input string used for errors and\
        \ notification to map the message to a specific part of the input."
      properties:
        end:
          $ref: "#/components/schemas/PositionInfo"
        start:
          $ref: "#/components/schemas/PositionInfo"
      required:
      - "end"
      - "start"
    VerifyResponse:
      type: "object"
      description: "Verify response."
      properties:
        notifications:
          type: "array"
          description: "The notifications related to the supplied input string."
          items:
            $ref: "#/components/schemas/MetadataNotification"
        valid:
          type: "boolean"
          description: "True if the supplied input string is valid."
      required:
      - "valid"
  securitySchemes:
    ssoAuth:
      description: "Dynatrace OAuth\n\n A Bearer token is passed in the **Authorization**\
        \ header in the following format: `Authorization: Bearer abcdefjhij1234567890`."
      flows:
        clientCredentials:
          scopes:
            openpipeline:configurations:read: "Read the OpenPipeline configuration"
            settings:objects:read: "Read settings objects"
          tokenUrl: "https://sso-sprint.dynatracelabs.com/sso/oauth2/token"
      type: "oauth2"
    ssoBearerAuth:
      type: "http"
      scheme: "bearer"
      description: "The value can be either an OAuth2 access token or a platform token.</br>\
        \ For further information about platform tokens see <a href=\"https://dt-url.net/platform-tokens\"\
        \ target=\"_blank\">Platform tokens - Dynatrace Docs</a>."
