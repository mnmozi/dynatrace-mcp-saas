    TechnologyProcessor:
      type: "object"
      description: "Processor to apply a technology processors."
      properties:
        builtin:
          type: "boolean"
          default: false
          description: "Indicates if Dynatrace provides the object or if it's customer-defined."
        customMatcher:
          type: "string"
          description: "Optional customer-defined matching condition, that is used\
            \ in place of the main technology matcher."
          nullable: true
        editable:
          type: "boolean"
          description: "Indicates if the user can edit this object based on permissions\
            \ and builtin property."
          readOnly: true
        enabled:
          type: "boolean"
          description: "Indicates if the object is active."
        id:
          type: "string"
          description: "Processor identifier, which must be unique within a stage."
        sampleData:
          type: "string"
          description: "Sample data related to the processor for documentation or\
            \ testing."
