          type: "array"
          description: "List of configurations this technology is available for."
          items:
            type: "string"
            description: "List of configurations this technology is available for."
        deprecated:
          type: "boolean"
          description: "Marks the technology bundle as deprecated."
        fullDescription:
          type: "string"
          description: "Detailed description of the specific technology and contents\
            \ of the bundle."
        iconUrl:
          type: "string"
          description: "URL to fetch the associated icon for the technology."
        id:
          type: "string"
          description: "Identifier of the technology bundle."
        matcher:
          type: "string"
          description: "Matching condition to apply to incoming records."
        name:
          type: "string"
          description: "Name of the technology bundle."
        replacementId:
          type: "string"
          description: "The identifier of a technology bundle which should be used\
            \ instead of this deprecated bundle."
        sampleData:
          type: "string"
          description: "Sample data of the specific technology."
        shortDescription:
          type: "string"
          description: "Summary about the specific technology."
        tags:
          type: "array"
          description: "Tags to categorize the specific technology."
          items:
            type: "string"
            description: "Tags to categorize the specific technology."
