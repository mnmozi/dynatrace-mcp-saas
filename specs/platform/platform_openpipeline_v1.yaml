      x-only-visible-in-saas: true
      description: "**Required scope:** openpipeline:configurations:read"
components:
  schemas:
    AutocompleteResponse:
      type: "object"
      description: "The response of the autocomplete call."
      properties:
        optional:
          type: "boolean"
          description: "True if the suggestions are optional."
        suggestedTtlSeconds:
          type: "integer"
          format: "int32"
          description: "Suggested duration, in seconds, for how long the response\
            \ can be cached and reused by the client. It's derived from the volatility\
            \ of the suggestions on the server (such as if the suggestions are static,\
            \ how long the server will cache the volatile suggestions, etc.). If no\
            \ value is provided, the result might be cached for a long time. If the\
            \ value is lower than `1`, the result won't be cached."
        suggestions:
          type: "array"
          description: "The list of suggestions."
          items:
            $ref: "#/components/schemas/AutocompleteSuggestion"
      required:
      - "optional"
      - "suggestions"
    AutocompleteSuggestion:
      type: "object"
      description: "Single suggestion for completion of the query."
      properties:
        alreadyTypedCharacters:
          type: "integer"
          format: "int32"
          description: "Number of characters that the user already typed for this\
            \ suggestion."
        parts:
          type: "array"
          description: "List of suggestion parts."
          items:
            $ref: "#/components/schemas/AutocompleteSuggestionPart"
        suggestion:
          type: "string"
          description: "The suggested continuation of the input."
      required:
      - "alreadyTypedCharacters"
      - "parts"
      - "suggestion"
    AutocompleteSuggestionPart:
      type: "object"
      description: "Part of the suggestion."
      properties:
        info:
          type: "string"
          description: "The type of the suggestion."
        suggestion:
          type: "string"
          description: "The suggested continuation of the input."
        synopsis:
          type: "string"
          description: "The synopsis of the suggestion."
        type:
          type: "string"
          description: "The type of the autocomplete token."
          enum:
          - "ASSIGNMENT"
          - "BOOLEAN_FALSE"
          - "BOOLEAN_TRUE"
          - "BRACE_CLOSE"
          - "BRACE_OPEN"
          - "BRACKET_CLOSE"
          - "BRACKET_OPEN"
          - "COLON"
          - "COMMA"
          - "COMMAND_NAME"
          - "DATA_OBJECT"
          - "DOT"
          - "END_COMMENT"
          - "ENTITY_ATTRIBUTE"
          - "ENTITY_SELECTOR_PART"
          - "ENTITY_TYPE"
          - "FIELD_MODIFIER"
          - "FIELD_PATTERN"
          - "FUNCTION_NAME"
          - "INDENT"
          - "LINEBREAK"
          - "METRIC_KEY"
          - "NULL"
          - "NUMBER"
          - "OPERATOR"
          - "PARAMETER_KEY"
          - "PARAMETER_VALUE_SCOPE"
          - "PARENTHESIS_CLOSE"
          - "PARENTHESIS_OPEN"
          - "PARSE_PATTERN"
          - "PIPE"
          - "QUOTE"
          - "SIMPLE_IDENTIFIER"
          - "SINGLE_QUOTE"
          - "SLASH"
          - "SPACE"
          - "STRING"
          - "TIMESERIES_AGGREGATION"
          - "TIMESERIES_AGGREGATION_EXPRESSION"
          - "TIMESTAMP_VALUE"
          - "TIME_UNIT"
          - "TRAVERSAL_HOP_COUNT"
          - "TRAVERSAL_OPERATOR"
          - "TRAVERSAL_RELATION_NAME"
          - "UID_VALUE"
          - "VARIABLE"
      required:
      - "suggestion"
      - "type"
    AzureLogForwardingProcessor:
      type: "object"
      description: "Processor to extract a Azure log."
      properties:
        builtin:
          type: "boolean"
          default: false
          description: "Indicates if Dynatrace provides the object or if it's customer-defined."
        description:
          type: "string"
          description: "Name or description of the processor."
        editable:
          type: "boolean"
          description: "Indicates if the user can edit this object based on permissions\
            \ and builtin property."
          readOnly: true
        enabled:
          type: "boolean"
          description: "Indicates if the object is active."
        fieldExtraction:
          $ref: "#/components/schemas/FieldsExtraction"
        forwarderConfigId:
          type: "string"
        id:
          type: "string"
          description: "Processor identifier, which must be unique within a stage."
        matcher:
          type: "string"
          description: "Matching condition to apply to incoming records."
        sampleData:
          type: "string"
          description: "Sample data related to the processor for documentation or\
            \ testing."
      required:
      - "description"
      - "enabled"
      - "fieldExtraction"
      - "forwarderConfigId"
      - "id"
      - "matcher"
    BizeventExtractionProcessor:
      type: "object"
      description: "Processor to extract a bizevent.\nFields event.type and event.provider\
        \ can only be assigned to a constant or field value. A multi-value constant\
        \ is not supported for those fields."
      properties:
        builtin:
          type: "boolean"
          default: false
          description: "Indicates if Dynatrace provides the object or if it's customer-defined."
        description:
          type: "string"
          description: "Name or description of the processor."
        editable:
          type: "boolean"
          description: "Indicates if the user can edit this object based on permissions\
            \ and builtin property."
          readOnly: true
        enabled:
          type: "boolean"
          description: "Indicates if the object is active."
        eventProvider:
          $ref: "#/components/schemas/ValueAssignment"
        eventType:
          $ref: "#/components/schemas/ValueAssignment"
        fieldExtraction:
          $ref: "#/components/schemas/FieldsExtraction"
        id:
          type: "string"
          description: "Processor identifier, which must be unique within a stage."
        matcher:
          type: "string"
          description: "Matching condition to apply to incoming records."
        sampleData:
          type: "string"
          description: "Sample data related to the processor for documentation or\
            \ testing."
      required:
      - "description"
      - "enabled"
      - "eventProvider"
      - "fieldExtraction"
      - "id"
      - "matcher"
    BucketAssignmentProcessor:
      type: "object"
      description: "Processor to assign a bucket."
      properties:
        bucketName:
          type: "string"
          description: "Bucket that is assigned when the record is matched."
        builtin:
          type: "boolean"
          default: false
          description: "Indicates if Dynatrace provides the object or if it's customer-defined."
        description:
          type: "string"
          description: "Name or description of the processor."
        editable:
          type: "boolean"
          description: "Indicates if the user can edit this object based on permissions\
            \ and builtin property."
          readOnly: true
        enabled:
          type: "boolean"
          description: "Indicates if the object is active."
        id:
          type: "string"
          description: "Processor identifier, which must be unique within a stage."
        matcher:
          type: "string"
          description: "Matching condition to apply to incoming records."
        sampleData:
          type: "string"
          description: "Sample data related to the processor for documentation or\
            \ testing."
      required:
      - "bucketName"
      - "description"
      - "enabled"
      - "id"
      - "matcher"
    BucketsSpecification:
      type: "object"
      description: "Contains information about allowed buckets for the configuration."
      properties:
        bucketTable:
          type: "string"
          description: "The bucket table containing the allowed buckets for the configuration."
        defaultBucket:
          type: "string"
          description: "The default bucket that will be used to store records if nothing\
            \ else is defined in the processing rules."
      required:
      - "bucketTable"
      - "defaultBucket"
    ClassicPipelineDefinition:
      type: "object"
      allOf:
      - $ref: "#/components/schemas/PipelineDefinition"
      - type: "object"
        properties:
          processing:
            $ref: "#/components/schemas/ClassicProcessingStage"
          settingsSchema:
            type: "string"
            description: "The settings-schema identifier related to the processing\
              \ of the classic pipeline."
      description: "Definition of a classic pipeline which are configured via settings\
        \ 2.0.\nThis only applies to the logs and bizevents configuration."
      required:
      - "enabled"
      - "id"
      - "settingsSchema"
    ClassicProcessingStage:
      type: "object"
      description: "Processing stage configuration of the pipeline."
      properties:
        editable:
          type: "boolean"
          description: "Indicates if the user can edit this object based on permissions\
            \ and builtin property."
          readOnly: true
        processors:
          type: "array"
          description: "List of processors."
          items:
            $ref: "#/components/schemas/ClassicProcessingStageProcessor"
      required:
      - "processors"
    ClassicProcessingStageProcessor:
      type: "object"
      description: "Groups all processors applicable for the ClassicProcessingStage.\n\
        Applicable processor is SxqlProcessor."
      oneOf:
      - $ref: "#/components/schemas/SxqlProcessor"
      required:
      - "description"
      - "enabled"
      - "id"
      - "matcher"
    Configuration:
      type: "object"
      description: "Full configuration containing ingest sources, pipelines, and dynamic\
        \ routing."
      properties:
        customBasePath:
          type: "string"
          description: "The base path for custom ingest endpoints."
        editable:
          type: "boolean"
          description: "Indicates if the user can edit this object based on permissions\
            \ and builtin property."
          readOnly: true
        endpoints:
          type: "array"
          description: "List of all ingest sources of the configuration."
          items:
            $ref: "#/components/schemas/EndpointDefinition"
        id:
          type: "string"
          description: "Identifier of the configuration."
        pipelines:
          type: "array"
          description: "List of all pipelines of the configuration."
          items:
            $ref: "#/components/schemas/PipelineDefinition"
        routing:
          $ref: "#/components/schemas/RoutingTable"
        updateToken:
          type: "string"
          description: "The update token of the configuration. You can use it to detect\
