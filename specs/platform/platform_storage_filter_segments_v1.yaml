openapi: "3.0.1"
info:
  description: "Filter-Segment Management for Grail.\n\nSlice, dice and contextualize\
    \ your data to make it easier to find, understand and work with.\n"
  title: "Grail Filter Segments API"
  version: "1.3.0"
  x-service-category: "grail"
  x-summary: "Defines and manages filter segments used to constrain query scope by\
    \ applying custom data filters."
servers:
- url: "https://asn8731h.sprint.apps.dynatracelabs.com/platform/storage/filter-segments/v1"
  x-api-gateway-url: "/platform/storage/filter-segments/v1"
paths:
  /filter-segments:
    get:
      description: "Returns all filter-segments.\nIf details like description are\
        \ not needed then consider using the `:lean` endpoint.\n\nRequired scopes:\n\
        \n- `storage:filter-segments:read`\n"
      operationId: "getFilterSegments"
      parameters:
      - description: "Add additional fields."
        in: "query"
        name: "add-fields"
        required: false
        schema:
          type: "array"
          items:
            type: "string"
            enum:
            - "VARIABLES"
            - "EXTERNALID"
            - "RESOURCECONTEXT"
          nullable: true
      responses:
        "200":
          content:
            application/json:
              examples:
                Example all filter-segments response:
                  description: "Example all filter-segments response"
                  value:
                    filterSegments:
                    - uid: "D82a1jdA23a"
                      name: "dev_environment"
                      description: "only includes data of the dev environment"
                      isPublic: false
                      owner: "john.doe"
                      version: 1
                    - uid: "aa2E2xA01yA"
                      name: "prod_environment"
                      description: "only includes data of the prod environment"
                      isPublic: true
                      owner: "john.doe"
                      version: 1
              schema:
                $ref: "#/components/schemas/FilterSegments"
          description: "Filter-segments successfully retrieved."
        "400":
          content:
            application/json:
              examples:
                TenantId missing:
                  value:
                    error:
                      code: 400
                      message: "Missing request header"
                      errorDetails:
                      - type: "parameter"
                        parameterDescriptor: "Dt-Tenant"
                        message: "is required"
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "bad request"
        "401":
          content:
            application/json:
              examples:
                Unauthorized:
                  value:
                    error:
                      code: 401
                      message: "Invalid authorization parameters"
                      errorDetails: []
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "unauthorized"
        "403":
          content:
            application/json:
              examples:
                Forbidden:
                  value:
                    error:
                      code: 403
                      message: "Required permissions not met"
                      errorDetails: []
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "missing permissions"
      security:
      - ApiToken: []
      - ssoBearerAuth: []
      summary: "Get all filter-segments."
      tags:
      - "Filter-Segments"
    post:
      description: "Create a new segment and define data.\n\nRequired scopes:\n\n\
        - `storage:filter-segments:write`\n- `storage:filter-segments:share` if `isPublic`\
        \ is set to `true`\n\n### New Filter-Segment\n\nProvide a name and an optional\
        \ description for the filter-segment.\n\n#### Variables\n\nCreate variables\
        \ to apply in your filter-segment data filters\n\n#### Includes (Segment data)\n\
        \nInclude all data that should be accessible when applying the filter-segment\n\
        \n#### IsPublic (Visibility)\n\n- `false`: The filter-segment is private and\
        \ only visible to the owner\n- `true`: The filter-segment is visible to everyone\
        \ in the environment\n"
      operationId: "createFilterSegment"
      requestBody:
        content:
          application/json:
            examples:
              Example new filter-segment request:
                description: "Example new filter-segment request"
                value:
                  name: "dev_environment"
                  description: "only includes data of the dev environment"
                  variables:
                    type: "query"
                    value: "fetch logs | limit 1"
                  isPublic: false
                  includes:
                  - filter: "{\"type\":\"Group\",\"range\":{\"from\":0,\"to\":19},\"\
                      logicalOperator\":\"AND\",\"explicit\":false,\"children\":[{\"\
                      type\":\"Statement\",\"range\":{\"from\":0,\"to\":19},\"key\"\
                      :{\"type\":\"Key\",\"textValue\":\"content\",\"value\":\"content\"\
                      ,\"range\":{\"from\":0,\"to\":7}},\"operator\":{\"type\":\"\
                      ComparisonOperator\",\"textValue\":\"=\",\"value\":\"=\",\"\
                      range\":{\"from\":8,\"to\":9}},\"value\":{\"type\":\"String\"\
                      ,\"textValue\":\"\\\"[debug]\\\"\",\"value\":\"[debug]\",\"\
                      range\":{\"from\":10,\"to\":19},\"isEscaped\":true}}]}"
                    dataObject: "logs"
                  - filter: "{\"type\":\"Group\",\"range\":{\"from\":0,\"to\":18},\"\
                      logicalOperator\":\"AND\",\"explicit\":false,\"children\":[{\"\
                      type\":\"Statement\",\"range\":{\"from\":0,\"to\":18},\"key\"\
                      :{\"type\":\"Key\",\"textValue\":\"content\",\"value\":\"content\"\
                      ,\"range\":{\"from\":0,\"to\":7}},\"operator\":{\"type\":\"\
                      ComparisonOperator\",\"textValue\":\"=\",\"value\":\"=\",\"\
                      range\":{\"from\":8,\"to\":9}},\"value\":{\"type\":\"String\"\
                      ,\"textValue\":\"\\\"[info]\\\"\",\"value\":\"[info]\",\"range\"\
                      :{\"from\":10,\"to\":18},\"isEscaped\":true}}]}"
                    dataObject: "events"
            schema:
              $ref: "#/components/schemas/NewFilterSegment"
        required: true
      responses:
        "201":
          content:
            application/json:
              examples:
                Example full filter-segment response:
                  description: "Example full filter-segment response"
                  value:
                    uid: "D82a1jdA23a"
                    name: "dev_environment"
                    description: "only includes data of the dev environment"
                    variables:
                      type: "query"
                      value: "fetch logs | limit 1"
                    isPublic: false
                    owner: "john.doe"
                    includes:
                    - filter: "here goes the filter"
                      dataObject: "logs"
                    - filter: "here goes another filter"
                      dataObject: "events"
                    version: 1
              schema:
                $ref: "#/components/schemas/DetailedFilterSegment"
          description: "Filter-segment successfully created."
        "400":
          content:
            application/json:
              examples:
                TenantId missing:
                  value:
                    error:
                      code: 400
                      message: "Missing request header"
                      errorDetails:
                      - type: "parameter"
                        parameterDescriptor: "Dt-Tenant"
                        message: "is required"
                The json provided as filter in the filter-segment include is malformed:
                  description: "The json provided as filter in the filter-segment\
                    \ include is malformed"
                  value:
                    error:
                      code: 400
                      message: "The filter provided in the filter-segment as include\
                        \ is malformed"
                      errorDetails:
                      - '@type': "request-body"
                        bodyDescriptor: "$.operator.value"
                        message: "Unsupported operator value: [==]. Only \"=\" is\
                          \ allowed."
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Filter-segment Bad Request."
        "401":
          content:
            application/json:
              examples:
                Unauthorized:
                  value:
                    error:
                      code: 401
                      message: "Invalid authorization parameters"
                      errorDetails: []
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "unauthorized"
        "403":
          content:
            application/json:
              examples:
                Forbidden:
                  value:
                    error:
                      code: 403
                      message: "Required permissions not met"
                      errorDetails: []
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "missing permissions"
      security:
      - ApiToken: []
      - ssoBearerAuth: []
      summary: "Create a new filter-segment."
      tags:
      - "Filter-Segments"
  /filter-segments-entity-model:
    get:
      description: "Returns the filter-segment-entity-model.\n\nRequired scopes:\n\
        \n- `storage:filter-segments:read`\n"
      operationId: "getFilterSegmentsEntityModel"
      responses:
        "200":
          content:
            application/json:
              examples:
                Example all filter-segments response:
                  description: "Example all filter-segments response"
                  value: "{\n    \"name\": \"dt.entity,\n    \"types\" [\n      {\n\
                    \        \"name\": \"datastore\",\n        \"displayName\": \"\
                    Datastore\",\n        \"filtersEntitiesOnly\": false,\n      \
                    \  \"relatedTargetEntityOnly\": false,\n        \"restrictedParentProperties\"\
                    : [],\n        \"properties\": [\n          {\n            \"\
                    name\": \"entity.conditional_name\",\n            \"type\": \"\
                    STRING\"\n          }\n        ],\n        \"fromTypes\": [\n\
                    \          {\n            \"name\": \"belongs_to\",\n        \
                    \    \"target\": \"vmware_datacenter\"\n          },\n       \
                    \   {\n            \"name\": \"belongs_to\",\n            \"target\"\
                    : \"virtualmachine\"\n          },\n          {\n            \"\
                    name\": \"belongs_to\",\n            \"target\": \"hypervisor\"\
                    \n          }\n        ]\n      }\n    ],\n    {\n       \"filterName\"\
                    : \"in\",\n       \"supportedAttributes\": [\n         \"entity.name\"\
                    \n       ]\n     },\n     {\n       \"filterName\": \"equals\"\
                    ,\n       \"supportedAttributes\": [\n         \"entity.name\"\
                    ,\n         \"type\",\n         \"tag\",\n         \"id\",\n \
                    \        \"casesensitive\"\n       ]\n     },\n     {\n      \
                    \ \"filterName\": \"startsWith\",\n       \"supportedAttributes\"\
                    : [\n         \"entity.name\"\n       ]\n     }\n   ]\n}\n"
              schema:
                $ref: "#/components/schemas/FilterSegmentNamespaceDto"
          description: "Filter-segments-entity-model successfully retrieved."
        "400":
          content:
            application/json:
              examples:
                TenantId missing:
                  value:
                    error:
                      code: 400
                      message: "Missing request header"
                      errorDetails:
                      - type: "parameter"
                        parameterDescriptor: "Dt-Tenant"
                        message: "is required"
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "bad request"
        "401":
          content:
            application/json:
              examples:
                Unauthorized:
                  value:
                    error:
                      code: 401
                      message: "Invalid authorization parameters"
                      errorDetails: []
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "unauthorized"
        "403":
          content:
            application/json:
              examples:
                Forbidden:
                  value:
                    error:
                      code: 403
                      message: "Required permissions not met"
                      errorDetails: []
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "missing permissions"
      security:
      - ApiToken: []
      - ssoBearerAuth: []
      summary: "Get filter-segment-entity-model."
      tags:
      - "Filter-Segments"
  /filter-segments/{filterSegmentUid}:
    delete:
      description: "Remove the filter-segment from the environment for all users.\n\
        \nRequired scopes:\n- `storage:filter-segments:delete`\n"
      operationId: "deleteFilterSegment"
      parameters:
      - description: "UID of the filter-segment"
        example: "D82a1jdA23a"
        in: "path"
        name: "filterSegmentUid"
        required: true
        schema:
          type: "string"
      responses:
        "204":
          description: "Filter-segment successfully deleted."
        "400":
          content:
            application/json:
              examples:
                TenantId missing:
                  value:
                    error:
                      code: 400
                      message: "Missing request header"
                      errorDetails:
                      - type: "parameter"
                        parameterDescriptor: "Dt-Tenant"
                        message: "is required"
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "bad request"
        "401":
          content:
            application/json:
              examples:
                Unauthorized:
                  value:
                    error:
                      code: 401
                      message: "Invalid authorization parameters"
                      errorDetails: []
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "unauthorized"
        "403":
          content:
            application/json:
              examples:
                Forbidden:
                  value:
                    error:
                      code: 403
                      message: "Required permissions not met"
                      errorDetails: []
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "missing permissions"
        "404":
          content:
            application/json:
              examples:
                Filter-segment not found:
                  description: "Filter-segment not found"
                  value:
                    error:
                      code: 404
                      message: "Filter-segment not found"
                      errorDetails: []
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Not found: the server cannot find the requested filter-segment."
      security:
      - ApiToken: []
      - ssoBearerAuth: []
      summary: "Delete a filter-segment."
      tags:
      - "Filter-Segments"
    get:
      description: "Get filter-segment by its UID.\n\nRequired scopes:\n\n- `storage:filter-segments:read`\n"
      operationId: "getFilterSegment"
      parameters:
      - description: "UID of the filter-segment"
        example: "D82a1jdA23a"
        in: "path"
        name: "filterSegmentUid"
        required: true
        schema:
          type: "string"
      - description: "Add additional fields."
        in: "query"
        name: "add-fields"
        required: false
        schema:
          type: "array"
          items:
            type: "string"
            enum:
            - "INCLUDES"
            - "VARIABLES"
            - "EXTERNALID"
            - "RESOURCECONTEXT"
          nullable: true
      responses:
        "200":
          content:
            application/json:
              examples:
                Example full filter-segment response:
                  description: "Example full filter-segment response"
                  value:
                    uid: "D82a1jdA23a"
                    name: "dev_environment"
                    description: "only includes data of the dev environment"
                    variables:
                      type: "query"
                      value: "fetch logs | limit 1"
                    isPublic: false
                    owner: "john.doe"
                    includes:
                    - filter: "here goes the filter"
                      dataObject: "logs"
                    - filter: "here goes another filter"
                      dataObject: "events"
                    version: 1
              schema:
                $ref: "#/components/schemas/DetailedFilterSegment"
          description: "Filter-segment successfully retrieved."
        "400":
          content:
            application/json:
              examples:
                TenantId missing:
                  value:
                    error:
                      code: 400
                      message: "Missing request header"
                      errorDetails:
                      - type: "parameter"
                        parameterDescriptor: "Dt-Tenant"
                        message: "is required"
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "bad request"
        "401":
          content:
            application/json:
              examples:
                Unauthorized:
                  value:
                    error:
                      code: 401
                      message: "Invalid authorization parameters"
                      errorDetails: []
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "unauthorized"
        "403":
          content:
            application/json:
              examples:
                Forbidden:
                  value:
                    error:
                      code: 403
                      message: "Required permissions not met"
                      errorDetails: []
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "missing permissions"
        "404":
          content:
            application/json:
              examples:
                Filter-segment not found:
                  description: "Filter-segment not found"
                  value:
                    error:
                      code: 404
                      message: "Filter-segment not found"
                      errorDetails: []
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Not found: the server cannot find the requested filter-segment."
      security:
      - ApiToken: []
      - ssoBearerAuth: []
      summary: "Get filter-segment by UID."
      tags:
      - "Filter-Segments"
    patch:
      description: "Update one or more fields of a filter-segment.\n\nRequired scopes:\n\
        - `storage:filter-segments:write`\n- `storage:filter-segments:share` to change\
        \ `isPublic` to `true`\n\nFollowing fields can be updated:\n\n- `name`\n-\
        \ `description`\n- `isPublic`\n- `variables`*\n- `includes`*\n\n\\* If given\
        \ the value will be overridden.\n\nFields not given will be ignored.\n"
      operationId: "partiallyUpdateFilterSegment"
      parameters:
      - description: "UID of the filter-segment"
        example: "D82a1jdA23a"
        in: "path"
        name: "filterSegmentUid"
        required: true
        schema:
          type: "string"
      - description: "version which should be updated. used for optimistic locking."
        example: "1"
        in: "query"
        name: "optimistic-locking-version"
        required: true
        schema:
          type: "integer"
          format: "int32"
          exclusiveMinimum: true
          minimum: 0
      requestBody:
        content:
          application/json:
            examples:
              Example partial update request:
                description: "Example partial update request"
                value:
                  description: "only includes data of the development environment"
            schema:
              $ref: "#/components/schemas/PartialUpdateFilterSegment"
        required: true
      responses:
        "200":
          description: "Filter-segment successfully updated."
        "400":
          content:
            application/json:
              examples:
                TenantId missing:
                  value:
                    error:
                      code: 400
                      message: "Missing request header"
                      errorDetails:
                      - type: "parameter"
                        parameterDescriptor: "Dt-Tenant"
                        message: "is required"
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "bad request"
        "401":
          content:
            application/json:
              examples:
                Unauthorized:
                  value:
                    error:
                      code: 401
                      message: "Invalid authorization parameters"
                      errorDetails: []
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "unauthorized"
        "403":
          content:
            application/json:
              examples:
                Forbidden:
                  value:
                    error:
                      code: 403
                      message: "Required permissions not met"
                      errorDetails: []
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "missing permissions"
        "404":
          content:
            application/json:
              examples:
                Filter-segment not found:
                  description: "Filter-segment not found"
                  value:
                    error:
                      code: 404
                      message: "Filter-segment not found"
                      errorDetails: []
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Not found: the server cannot find the requested filter-segment."
      security:
      - ApiToken: []
      - ssoBearerAuth: []
      summary: "Partially update a filter-segment."
      tags:
      - "Filter-Segments"
    put:
      description: "Update one or more fields of a filter-segment.\n\nRequired scopes:\n\
        - `storage:filter-segments:write`\n- `storage:filter-segments:share` to change\
        \ `isPublic` to `true`\n\nFollowing fields can be updated:\n\n- `name`\n-\
        \ `description`\n- `isPublic`\n- `variables`*\n- `includes`*\n\n\\* Values\
        \ of the fields will be overridden or removed if not given.\n\nProvide all\
        \ other fields with unchanged values.\n"
      operationId: "updateFilterSegment"
      parameters:
      - description: "UID of the filter-segment"
        example: "D82a1jdA23a"
        in: "path"
        name: "filterSegmentUid"
        required: true
        schema:
          type: "string"
      - description: "version which should be updated. used for optimistic locking."
        example: "1"
        in: "query"
        name: "optimistic-locking-version"
        required: true
        schema:
          type: "integer"
          format: "int32"
          exclusiveMinimum: true
          minimum: 0
      requestBody:
        content:
          application/json:
            examples:
              Example update request:
                description: "Example update request"
                value:
                  uid: "D82a1jdA23a"
                  name: "dev_environment"
                  description: "only includes data of the development environment"
                  variables:
                    type: "query"
                    value: "fetch logs | limit 1"
                  isPublic: false
                  owner: "john.doe"
                  includes:
                  - filter: "{\"type\":\"Group\",\"range\":{\"from\":0,\"to\":19},\"\
                      logicalOperator\":\"AND\",\"explicit\":false,\"children\":[{\"\
                      type\":\"Statement\",\"range\":{\"from\":0,\"to\":19},\"key\"\
                      :{\"type\":\"Key\",\"textValue\":\"content\",\"value\":\"content\"\
                      ,\"range\":{\"from\":0,\"to\":7}},\"operator\":{\"type\":\"\
                      ComparisonOperator\",\"textValue\":\"=\",\"value\":\"=\",\"\
                      range\":{\"from\":8,\"to\":9}},\"value\":{\"type\":\"String\"\
                      ,\"textValue\":\"\\\"[debug]\\\"\",\"value\":\"[debug]\",\"\
                      range\":{\"from\":10,\"to\":19},\"isEscaped\":true}}]}"
                    dataObject: "logs"
                  - filter: "{\"type\":\"Group\",\"range\":{\"from\":0,\"to\":18},\"\
                      logicalOperator\":\"AND\",\"explicit\":false,\"children\":[{\"\
                      type\":\"Statement\",\"range\":{\"from\":0,\"to\":18},\"key\"\
                      :{\"type\":\"Key\",\"textValue\":\"content\",\"value\":\"content\"\
                      ,\"range\":{\"from\":0,\"to\":7}},\"operator\":{\"type\":\"\
                      ComparisonOperator\",\"textValue\":\"=\",\"value\":\"=\",\"\
                      range\":{\"from\":8,\"to\":9}},\"value\":{\"type\":\"String\"\
                      ,\"textValue\":\"\\\"[info]\\\"\",\"value\":\"[info]\",\"range\"\
                      :{\"from\":10,\"to\":18},\"isEscaped\":true}}]}"
                    dataObject: "events"
            schema:
              $ref: "#/components/schemas/UpdateFilterSegment"
        required: true
      responses:
        "200":
          description: "Filter-segment successfully updated."
        "400":
          content:
            application/json:
              examples:
                TenantId missing:
                  value:
                    error:
                      code: 400
                      message: "Missing request header"
                      errorDetails:
                      - type: "parameter"
                        parameterDescriptor: "Dt-Tenant"
                        message: "is required"
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "bad request"
        "401":
          content:
            application/json:
              examples:
                Unauthorized:
                  value:
                    error:
                      code: 401
                      message: "Invalid authorization parameters"
                      errorDetails: []
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "unauthorized"
        "403":
          content:
            application/json:
              examples:
                Forbidden:
                  value:
                    error:
                      code: 403
                      message: "Required permissions not met"
                      errorDetails: []
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "missing permissions"
        "404":
          content:
            application/json:
              examples:
                Filter-segment not found:
                  description: "Filter-segment not found"
                  value:
                    error:
                      code: 404
                      message: "Filter-segment not found"
                      errorDetails: []
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Not found: the server cannot find the requested filter-segment."
      security:
      - ApiToken: []
      - ssoBearerAuth: []
      summary: "Update a filter-segment. All fields will be overwritten (also undefined\
        \ or null fields)."
      tags:
      - "Filter-Segments"
  /filter-segments:lean:
    get:
      description: "Returns all filter-segments in a minimal representational form.\
        \ This endpoint saves resources\nand as a result quicker response times can\
        \ be expected over the more detailed get-all\nendpoint.\n\nRequired scopes:\n\
        \n- `storage:filter-segments:read`\n"
      operationId: "getLeanFilterSegments"
      parameters:
      - description: "Add additional fields."
        in: "query"
        name: "add-fields"
        required: false
        schema:
          type: "array"
          items:
            type: "string"
            enum:
            - "VARIABLES"
            - "EXTERNALID"
            - "RESOURCECONTEXT"
            - "OWNER"
          nullable: true
      responses:
        "200":
          content:
            application/json:
              examples:
                Example all lean filter-segments response:
                  description: "Example all lean filter-segments response"
                  value:
                    filterSegments:
                    - uid: "D82a1jdA23a"
                      name: "dev_environment"
                      variables:
                        type: "query"
                        value: "fetch logs | limit 1"
                      isPublic: false
                    - uid: "aa2E2xA01yA"
                      name: "prod_environment"
                      variables:
                        type: "query"
                        value: "fetch logs | limit 1"
                      isPublic: true
              schema:
                $ref: "#/components/schemas/LeanFilterSegments"
          description: "Filter-segments successfully retrieved."
        "400":
          content:
            application/json:
              examples:
                TenantId missing:
                  value:
                    error:
                      code: 400
                      message: "Missing request header"
                      errorDetails:
                      - type: "parameter"
                        parameterDescriptor: "Dt-Tenant"
                        message: "is required"
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "bad request"
        "401":
          content:
            application/json:
              examples:
                Unauthorized:
                  value:
                    error:
                      code: 401
                      message: "Invalid authorization parameters"
                      errorDetails: []
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "unauthorized"
        "403":
          content:
            application/json:
              examples:
                Forbidden:
                  value:
                    error:
                      code: 403
                      message: "Required permissions not met"
                      errorDetails: []
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "missing permissions"
      security:
      - ApiToken: []
      - ssoBearerAuth: []
      summary: "Get all filter-segments in a minimal/lean form."
