            \ Dynatrace Configuration as Code"
          nullable: true
        includes:
          type: "array"
          description: "List of includes of the filter-segment."
          items:
            $ref: "#/components/schemas/Include"
          nullable: true
        isPublic:
          type: "boolean"
          description: "Indicates if the filter-segment is publicly accessible within\
