          description: "Use this as page-key query param to get the next page"
        totalCount:
          type: "integer"
          description: "Total number of recipients of the share."
      required:
      - "recipients"
      - "totalCount"
      example:
        recipients:
        - id: "441664f0-23c9-40ef-b344-18c02c23d789"
          type: "user"
        - id: "4b41f970-099c-47c5-8818-3f6daac77a40"
          type: "group"
        - id: "063a45f0-877f-48ca-8646-5044de48d886"
          type: "user"
        nextPageKey: "bmQgUXVhcms="
        totalCount: 3
    TrashDocumentList:
      type: "object"
      description: "Envelope object for a list of documents in trash."
      properties:
        documents:
          type: "array"
          items:
            $ref: "#/components/schemas/TrashDocumentListEntry"
        nextPageKey:
          type: "string"
          description: "Use this as `page-key` query param to get the next page. If\
            \ the list was paginated, and there are more results available, this parameter\
            \ will be returned."
        totalCount:
          type: "integer"
          description: "The total amount of matching results for this query, as if\
            \ no pagination would have been applied."
      required:
      - "documents"
      - "totalCount"
    TrashDocumentListEntry:
      type: "object"
      description: "A document which has been deleted and now lives in the trash."
      properties:
        id:
          type: "string"
          description: "Id of the deleted document."
        name:
          type: "string"
          description: "Name of the deleted document."
        type:
          type: "string"
          description: "Type of the deleted document."
        deletionInfo:
          $ref: "#/components/schemas/DeletionInfo"
      required:
      - "id"
      - "name"
      - "type"
      - "deletionInfo"
    TrashDocument:
      type: "object"
      description: "A document which has been moved to the trash."
      properties:
        id:
          type: "string"
          description: "Id of the deleted document."
        name:
          type: "string"
          description: "Name of the deleted document."
        type:
          type: "string"
          description: "Type of the deleted document."
        version:
          description: "Version of the deleted document."
          type: "integer"
        owner:
          type: "string"
          description: "Owner of the deleted document."
        modificationInfo:
          $ref: "#/components/schemas/ModificationInfo"
        deletionInfo:
          $ref: "#/components/schemas/DeletionInfo"
      required:
      - "id"
      - "name"
      - "type"
      - "version"
      - "owner"
      - "deletionInfo"
      - "modificationInfo"
    DocumentLockDetails:
      type: "object"
      description: "The locking details of the document."
      properties:
        lockedBy:
          type: "string"
          description: "The user that currently owns the lock."
        isLocked:
          description: "Document is locked or not."
          type: "boolean"
        isLockedByAnotherUser:
          description: "Document is locked by another user or not."
          type: "boolean"
        documentVersion:
          description: "Latest version of the document."
          type: "integer"
      required:
      - "isLockedByAnotherUser"
      - "documentVersion"
      example:
        lockedBy: "431664f1-23c9-40ef-b344-18c02c23d789"
        isLocked: true
        isLockedByAnotherUser: true
        documentVersion: 1
    BulkDeleteRequest:
      type: "object"
      properties:
        ids:
          description: "The ids of the documents that shall be deleted. Must not be\
            \ empty."
          type: "array"
          items:
            type: "string"
      required:
      - "ids"
      example:
        ids:
        - "0cf381b6-f235-4606-8675-27f96d954b18"
        - "b91371a5-925e-4ee2-868b-cad4d4057416"
        - "c1fc125a-e310-439a-9703-c7e3bdbeab5a"
        - "doc-123"
    BulkDeleteResponse:
      description: "Result of the bulk operation for the individual objects."
      type: "object"
      properties:
        documents:
          type: "array"
          items:
            type: "object"
            properties:
              id:
                type: "string"
                description: "ID of the document."
              code:
                type: "number"
                description: "HTTP code the single delete endpoint would return for\
                  \ a request with this Document ID"
              error:
                $ref: "#/components/schemas/Error"
            required:
            - "id"
            - "code"
      example:
        documents:
        - id: "0cf381b6-f235-4606-8675-27f96d954b18"
          code: 204
        - id: "b91371a5-925e-4ee2-868b-cad4d4057416"
          code: 404
          error:
            code: 404
            message: "Document not found: b91371a5-925e-4ee2-868b-cad4d4057416"
            details:
              errorRef: "738f7bc2-ae51-4e50-bf1a-ff057d6b5f9f"
        - id: "c1fc125a-e310-439a-9703-c7e3bdbeab5a"
          code: 403
          error:
            code: 403
            message: "Document not accessible: c1fc125a-e310-439a-9703-c7e3bdbeab5a"
            details:
              errorRef: "738f7bc2-ae51-4e50-bf1a-ff057d6b5f9f"
        - id: "doc-123"
          code: 204
  requestBodies:
    BulkDeleteRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BulkDeleteRequest"
  responses:
    DocumentCreated:
      description: "A new document has been created."
      headers:
        Document-Version:
          $ref: "#/components/headers/documentVersionResponseHeader"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DocumentMetaData"
    DocumentUpdated:
      description: "The document has been updated. The updated metadata is returned."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DocumentMetaData"
          example:
            id: "doc-123"
            name: "a new name"
            type: "a new type"
            description: "Some description of the document"
            version: "2"
            owner: "441664f0-23c9-40ef-b344-18c02c23d789"
            modificationInfo:
              createdBy: "441664f0-23c9-40ef-b344-18c02c23d789"
              createdTime: "2021-10-09T19:23:27Z"
              lastModifiedBy: "441664f0-23c9-40ef-b344-18c02c23d789"
              lastModifiedTime: "2021-11-10T05:11:11Z"
              lastModifyingAppId: null
            access:
            - "read"
            - "read-write"
            isPrivate: true
            isReshareable: true
            externalId: "doc-123"
            originAppId: null
            labels:
            - "label1"
            - "label2"
      headers:
        Document-Version:
          $ref: "#/components/headers/documentVersionResponseHeader"
    DocumentContent:
      description: "Content of the document"
      content:
        '*/*':
          schema:
            type: "string"
            format: "binary"
      headers:
        Document-Version:
          $ref: "#/components/headers/documentVersionResponseHeader"
    DocumentContentUpdated:
      description: "Document content successfully updated"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DocumentMetaData"
      headers:
        Document-Version:
          $ref: "#/components/headers/documentVersionResponseHeader"
    DocumentDeleted:
      description: "The document was deleted successfully."
    FullDocument:
      description: "Metadata and content in a multipart response."
      headers:
        Document-Version:
          $ref: "#/components/headers/documentVersionResponseHeader"
      content:
        multipart/form-data:
          schema:
            type: "object"
            properties:
              metadata:
                $ref: "#/components/schemas/DocumentMetaData"
              content:
                description: "The binary content of this document."
                type: "string"
                format: "binary"
          example: "POST / HTTP/1.1\n...\nContent-Type: multipart/form-data; boundary=---------------------------9051914041544843365972754266\n\
            Content-Length: <nn>\n\n-----------------------------9051914041544843365972754266\n\
            Content-Disposition: form-data; name=\"metadata\"; filename=\"1234-metadata.json\"\
            \nContent-Type: application/json\n\n{\n  \"id\": \"doc-123\",\n  \"name\"\
            : \"My Dashboard\",\n  \"type\": \"MyType\",\n  \"version\": \"1\",\n\
            \  \"owner\": \"441664f0-23c9-40ef-b344-18c02c23d789\",\n  \"modificationInfo\"\
            : {\n    \"createdBy\": \"441664f0-23c9-40ef-b344-18c02c23d789\",\n  \
            \  \"createdTime\": \"2021-10-09T19:23:27Z\",\n    \"lastModifiedBy\"\
            : \"441664f0-23c9-40ef-b344-18c02c23d789\",\n    \"lastModifiedTime\"\
            : \"2021-11-10T05:11:11Z\",\n    \"lastModifyingAppId\": \"app-123\"\n\
            \  },\n  \"access\": [\"read\"],\n  \"isPrivate\": false,\n  \"isReshareable\"\
            : true,\n  \"externalId\": \"doc-123\",\n  \"originAppId: null,\n  \"\
            originExtensionId\": null,\n  \"labels\": [ \"label1\", \"label2\" ]\n\
            }\n\n-----------------------------9051914041544843365972754266\nContent-Disposition:\
            \ form-data; filename=\"My Dashboard\"\nContent-Type: image/jpeg\n\n<some\
            \ image binary data>\n-----------------------------9051914041544843365972754266"
    UpdateDocumentResponse:
      description: "Result of updating metadata & content. Contains document metadata\
