        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DocumentNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/GeneralError"
  /labels:
    parameters:
    - $ref: "#/components/parameters/containsQueryParam"
    - $ref: "#/components/parameters/adminAccessQueryParam"
    get:
      summary: "Lists labels accessible to you."
      security:
      - ssoAuth:
        - "document:documents:read"
      - ssoBearerAuth: []
      description: "**Required scope:** document:documents:read<br/><br/>Lists labels\
        \ accessible to you. Accepts an optional parameter for filtering. Results\
        \ are sorted alphabetically."
      operationId: "listLabels"
      tags:
      - "Documents"
      responses:
        "200":
          $ref: "#/components/responses/ListLabelsResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/GeneralError"
  /environment-shares:
    parameters:
    - $ref: "#/components/parameters/adminAccessQueryParam"
    post:
      summary: "Create an environment-share for a document."
      security:
      - ssoAuth:
        - "document:environment-shares:write"
      - ssoBearerAuth: []
      description: "**Required scope:** document:environment-shares:write<br/><br/>Create\
        \ an environment-share, which can be used to give one or multiple other users\
        \ access to this document. This is only possible for documents you own, as\
        \ well as for reshareable documents owned by other users to which you have\
        \ write access.\nA share can be created with either `read` or `read-write`\
        \ access.\n\nA document can have maximally one share per access type, therefore\
        \ it's impossible to create multiple read-shares or multiple 'read-write'-shares\
        \ for a single document.\n\nThis means, that you can create one read-share\
        \ for a document, and this single read-share can be used to give read-access\
        \ to an arbitrary number of users. The same applies to a 'read-write'-share.\n\
        \nCreating a share does *not* automatically allow users to access the document\
        \ - only those users who explicitly [claim the share](#/Environment%20Shares/claimEnvironmentShare)\
        \ gain access to the document.\n\nRevoking access from users can be done by\
        \ [deleting the share](#/Environment%20Shares/deleteEnvironmentShare)."
      operationId: "createEnvironmentShare"
      tags:
      - "Environment Shares"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnvShare"
      responses:
        "201":
          description: "A new environment-share for the specified document has been\
            \ created."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentShare"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DocumentNotFound"
        "409":
          $ref: "#/components/responses/ShareAlreadyExists"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/GeneralError"
    get:
      summary: "List environment-shares accessible to you."
      security:
      - ssoAuth:
        - "document:environment-shares:read"
      - ssoBearerAuth: []
      description: "**Required scope:** document:environment-shares:read<br/><br/>List\
        \ all environment-shares accessible to you.\nShares accessible to you include\
        \ those of your own documents, as well as those of reshareable documents owned\
        \ by other users to which you have write access.\nIf you are only concerned\
        \ with a specific document's environment-shares, or a specific share, you\
        \ can use the `filter` parameter to narrow down the result set. If you attempt\
        \ to retrieve environment-shares of a document not accessible by you, the\
        \ result set will be empty.\n\nFurthermore, you can apply pagination via the\
        \ `pageKey`, `page` and `pageSize` parameters.\n\n*Note, that at the moment\
        \ we offer a naive pagination, and therefore interim mutations can lead to\
        \ result inconsistencies (such as duplicates, missing entries).*"
      operationId: "listEnvironmentShares"
      tags:
      - "Environment Shares"
      parameters:
      - in: "query"
        name: "filter"
        description: "The filter query, as explained [here](https://dt-url.net/platform-services-filtering).\
          \ Filtering is only possible on the `documentId` property, and only via\
          \ the equals operator. Via this you can effectively retrieve the environment-shares\
          \ of a specific document. If this parameter is omitted, all environment-shares\
          \ accessible to you will be returned."
        required: false
        schema:
          type: "string"
      - $ref: "#/components/parameters/pageKey"
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: "A list of the environment-shares accessible to you.\nIf the\
            \ list was paginated (see `pageKey`, `page` and `pageSize`), and there\
            \ are more environment-shares available, you will find a non-empty `nextPageKey`\
            \ which can be used for a follow-up query. The `totalCount` property will\
            \ let you know the number of all matching environment-shares, as if no\
            \ pagination would have been applied."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentShareList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/GeneralError"
  /environment-shares/{id}:
    get:
      summary: "Retrieve an environment-share."
      security:
      - ssoAuth:
        - "document:environment-shares:read"
      - ssoBearerAuth: []
      description: "**Required scope:** document:environment-shares:read<br/><br/>Retrieve\
        \ an environment-share via its id.\nThe share must be accessible to you. Shares\
        \ accessible to you include those of your own documents, as well as those\
        \ of reshareable documents owned by other users to which you have write access."
      operationId: "getEnvironmentShare"
      tags:
      - "Environment Shares"
      parameters:
      - in: "path"
        name: "id"
        description: "Environment-share id."
        required: true
        schema:
          type: "string"
      - $ref: "#/components/parameters/adminAccessQueryParam"
      responses:
        "200":
          $ref: "#/components/responses/EnvironmentShare"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ShareNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/GeneralError"
    delete:
      summary: "Delete an environment-share accessible to you."
      security:
      - ssoAuth:
        - "document:environment-shares:delete"
      - ssoBearerAuth: []
      description: "**Required scope:** document:environment-shares:delete<br/><br/>Delete\
        \ the share. This will *not* delete the share's document.\n\nThe share must\
        \ be accessible to you. Shares accessible to you include those of your own\
        \ documents, as well as those of reshareable documents owned by other users\
        \ to which you have write access.\n\nThis operation effectively revokes the\
        \ access which has been granted to *all users* which have claimed this share.\
        \ This is the only way to revoke access to your document from other users.\
        \ It's impossible to revoke access of individual users.\n\nBe aware that deleting\
        \ a share doesn't necessarily prevent a user from accessing a document, as\
        \ the user might still have access via another share (of the same document).\
        \ E.g., if a user has read- and readwrite-access (via one read-share and another\
        \ readwrite-share), and the read-share gets deleted, access is still granted\
        \ to the user via the readwrite-share."
      operationId: "deleteEnvironmentShare"
      tags:
      - "Environment Shares"
      parameters:
      - in: "path"
        name: "id"
        description: "Environment-share id."
        required: true
        schema:
          type: "string"
      - $ref: "#/components/parameters/adminAccessQueryParam"
      responses:
        "204":
          description: "The share has been deleted."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ShareNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/GeneralError"
  /environment-shares/{id}/claim:
    put:
      summary: "Claim another user's environment-share."
      security:
      - ssoAuth:
        - "document:environment-shares:claim"
      - ssoBearerAuth: []
      description: "**Required scope:** document:environment-shares:claim<br/><br/>Claim\
        \ this environment-share, therefore gaining access to the share's document.\
        \ From thereafter, the document will be accessible to you with the specific\
        \ permissions defined by the share. You can then access the document as usual,\
        \ via the same endpoints which you would use to access your own documents.\n\
        \nClaiming your own shares isn't possible. You can only claim shares of documents\
        \ belonging to other users *of the same environment*.\n\nOnce you have claimed\
        \ access to a document, you can not revoke that access again.\n\nThe document's\
        \ owner can revoke your access by deleting the share. This will effectively\
        \ revoke the access you have been granted by claiming this share.\n\nYou can\
        \ claim multiple shares of the same document, and each share will grant you\
        \ different permissions.\n\nClaiming the same share multiple times doesn't\
        \ have any effect."
      operationId: "claimEnvironmentShare"
      tags:
      - "Environment Shares"
      parameters:
      - in: "path"
        name: "id"
        description: "Share id."
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "You have successfully claimed this share and can now access\
            \ the document with the granted permissions."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentShareClaimResult"
        "400":
          $ref: "#/components/responses/ClaimingOwnedShareNotAllowed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ShareNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/GeneralError"
  /environment-shares/{id}/claimers:
    get:
      summary: "List the claimers of an environment-share accessible to you."
      security:
      - ssoAuth:
        - "document:environment-shares:read"
      - ssoBearerAuth: []
      description: "**Required scope:** document:environment-shares:read<br/><br/>\n\
        Retrieve a share's claimers.\n\nThe share must be accessible to you.\nShares\
        \ accessible to you include those of your own documents, as well as those\
        \ of reshareable documents owned by other users to which you have write access.\n\
        \nYou can control the result's pagination via the `pageKey`, `page` and `pageSize`\
        \ parameters.\n\n*Note, that at the moment we offer a naive pagination, and\
        \ therefore interim document mutations and/or an\ninsufficient sort clause,\
        \ if provided, can lead to result inconsistencies (such as duplicates, missing\
        \ entries).*\n"
      operationId: "getEnvironmentShareClaimers"
      tags:
      - "Environment Shares"
      parameters:
      - in: "path"
        name: "id"
        description: "Environment-share id."
        required: true
        schema:
          type: "string"
      - $ref: "#/components/parameters/pageKey"
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/pageSize"
      - $ref: "#/components/parameters/adminAccessQueryParam"
      responses:
        "200":
          $ref: "#/components/responses/EnvironmentShareClaimerList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ShareNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/GeneralError"
  /direct-shares:
    parameters:
    - $ref: "#/components/parameters/adminAccessQueryParam"
    post:
      summary: "Create a direct-share."
      security:
      - ssoAuth:
        - "document:direct-shares:write"
      - ssoBearerAuth: []
      description: "**Required scope:** document:direct-shares:write<br/><br/>Create\
        \ a direct-share for a document. This is only possible for documents you own,\
        \ as well as for reshareable documents owned by other users to which you have\
        \ write access. The share can be used to grant access to a specific set of\
        \ users and/or groups, via [addRecipients](#/Direct%20Shares/addUserShareRecipients).\n\
        \nYou can optionally add users and/or groups which will directly be registered\
        \ as recipients of the share. The users and groups are specified via their\
        \ sso-ids. The maximum number of recipients is 1000.\n\nThe validity of the\
        \ SSO-users and SSO-groups isn't verified. It's technically possible, albeit\
        \ pointless, to add non-existing users and groups.\n\nThe share can be created\
        \ with either `read` or `read-write` access.\n\nA document can have maximally\
        \ one direct-share per access type, therefore it's impossible to create multiple\
        \ `read`-shares or multiple `read-write`-shares for a single document.\n\n\
        This means, that you can create one `read`-share for a document, and this\
        \ single `read`-share can be used to give read-access to an arbitrary number\
        \ of users (and/or groups). The same applies to a `read-write`-share."
      operationId: "createDirectShare"
      tags:
      - "Direct Shares"
      parameters:
      - $ref: "#/components/parameters/sendNotificationQueryParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDirectShare"
        required: true
      responses:
        "201":
          description: "A new share for the specified document has been created."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectShare"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DocumentNotFound"
        "409":
          $ref: "#/components/responses/ShareAlreadyExists"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/GeneralError"
    get:
      summary: "List all direct-shares accessible to you."
      security:
      - ssoAuth:
        - "document:direct-shares:read"
      - ssoBearerAuth: []
      description: "**Required scope:** document:direct-shares:read<br/><br/>List\
        \ all direct-shares accessible to you.\nShares accessible to you include those\
        \ of your own documents, as well as those of reshareable documents owned by\
        \ other users to which you have write access. If you are only concerned with\
        \ a specific document's shares, or a specific share, you can use the `filter`\
        \ parameter to narrow down the result set. If you attempt to retrieve shares\
        \ which are not accessible to you the result set will be empty.\n\n*Note,\
        \ that at the moment we offer a naive pagination, and therefore interim mutations\
        \ can lead to result inconsistencies (such as duplicates, missing entries).*"
      operationId: "listDirectShares"
      tags:
      - "Direct Shares"
      parameters:
      - in: "query"
        name: "filter"
        description: "The filter query, as explained [here](https://dt-url.net/platform-services-filtering).\
          \ Filtering is only possible on the `documentId` property, and only with\
          \ the equals operator. Via this you can effectively retrieve the direct-shares\
          \ of a specific document. If this parameter is omitted, all direct-shares\
          \ accessible to you will be returned."
        required: false
        schema:
          type: "string"
      - $ref: "#/components/parameters/pageKey"
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/pageSize"
      - $ref: "#/components/parameters/adminAccessQueryParam"
      responses:
        "200":
          description: "A list of direct-shares accessible to you."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectShareList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/GeneralError"
  /direct-shares/{id}:
    parameters:
    - $ref: "#/components/parameters/shareIdParam"
    - $ref: "#/components/parameters/adminAccessQueryParam"
    get:
      summary: "Retrieve a direct-share."
      security:
      - ssoAuth:
        - "document:direct-shares:read"
      - ssoBearerAuth: []
      description: "**Required scope:** document:direct-shares:read<br/><br/>Retrieve\
        \ a direct-share via its id.\nThe share must be accessible to you. Shares\
        \ accessible to you include those of your own documents, as well as those\
        \ of reshareable documents owned by other users to which you have write access."
      operationId: "getDirectShare"
      tags:
      - "Direct Shares"
      responses:
        "200":
          $ref: "#/components/responses/DirectShare"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ShareNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/GeneralError"
    delete:
      summary: "Delete a direct-share."
      security:
      - ssoAuth:
        - "document:direct-shares:delete"
      - ssoBearerAuth: []
      description: "**Required scope:** document:direct-shares:delete<br/><br/>Delete\
        \ the share. This will *not* delete the share's document.\n\nYou can only\
        \ delete shares which are accessible to you. Shares accessible to you include\
        \ those of your own documents, as well as those of reshareable documents owned\
        \ by other users to which you have write access.\n\nThis operation effectively\
        \ revokes the access of all the share's recipients.\n\nBe aware that deleting\
        \ a share doesn't necessarily prevent a user from accessing a document, as\
        \ the user might still have access via another share (of the same document).\
        \ E.g., if a user has 'read' and 'read-write' access (via one 'read' and another\
        \ 'read-write' share), and the 'read' share gets deleted, access is still\
        \ granted to the user via the other 'read-write' share."
      operationId: "deleteDirectShare"
      tags:
      - "Direct Shares"
      responses:
        "204":
          description: "The share has been deleted."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ShareNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/GeneralError"
  /direct-shares/{id}/recipients:
    parameters:
    - $ref: "#/components/parameters/shareIdParam"
    - $ref: "#/components/parameters/adminAccessQueryParam"
    - $ref: "#/components/parameters/pageKey"
    - $ref: "#/components/parameters/page"
    - $ref: "#/components/parameters/pageSize"
    get:
      summary: "List the recipients of a direct-share."
      security:
      - ssoAuth:
        - "document:direct-shares:read"
      - ssoBearerAuth: []
      description: "**Required scope:** document:direct-shares:read<br/><br/>Retrieve\
        \ a share's recipients. If there are groups among the recipients, the groups\
        \ always appear before the users.\n\nYou can only retrieve the recipients\
        \ for shares which are accessible to you. Shares accessible to you include\
        \ those of your own documents, as well as those of reshareable documents owned\
        \ by other users to which you have write access."
      operationId: "getDirectShareRecipients"
      tags:
      - "Direct Shares"
      responses:
        "200":
          $ref: "#/components/responses/DirectShareRecipientList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ShareNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/GeneralError"
  /direct-shares/{id}/recipients/add:
    parameters:
    - $ref: "#/components/parameters/shareIdParam"
    - $ref: "#/components/parameters/sendNotificationQueryParam"
    - $ref: "#/components/parameters/adminAccessQueryParam"
    post:
      summary: "Add recipients to a direct-share."
      security:
      - ssoAuth:
        - "document:direct-shares:write"
      - ssoBearerAuth: []
      description: "**Required scope:** document:direct-shares:write<br/><br/>Add\
        \ one or multiple SSO-users and/or SSO-groups to this share. The affected\
        \ users immediately gain access to the document.\n\nYou can only add recipients\
        \ to shares which are accessible to you. Shares accessible to you include\
        \ those of your own documents, as well as those of reshareable documents owned\
        \ by other users to which you have write access.\nThe maximum number of recipients\
        \ is 1000.\n\nThe validity of the SSO-users and SSO-groups isn't verified.\
        \ It's technically possible, albeit pointless, to add non-existing users and\
        \ groups.\n\nAlready added users or groups are ignored."
      operationId: "addDirectShareRecipients"
      tags:
      - "Direct Shares"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddDirectShareRecipients"
        required: true
      responses:
        "204":
          description: "The recipients have been added."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ShareNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/GeneralError"
  /direct-shares/{id}/recipients/remove:
    parameters:
    - $ref: "#/components/parameters/shareIdParam"
    - $ref: "#/components/parameters/adminAccessQueryParam"
    post:
      summary: "Remove recipients from a share."
      security:
      - ssoAuth:
        - "document:direct-shares:write"
      - ssoBearerAuth: []
      description: "**Required scope:** document:direct-shares:write<br/><br/>Remove\
        \ one or multiple recipients from the share. The affected users immediately\
        \ lose access to the document.\n\nYou can only remove recipients from shares\
        \ which are accessible to you. Shares accessible to you include those of your\
        \ own documents, as well as those of reshareable documents owned by other\
        \ users to which you have write access.\nThe maximum number of recipients\
        \ is 1000.\n\nNon-existing users or groups are ignored."
      operationId: "removeDirectShareRecipients"
      tags:
      - "Direct Shares"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveDirectShareRecipients"
        required: true
      responses:
        "204":
          description: "The recipients have been removed."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ShareNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/GeneralError"
  /trash/documents:
    get:
      parameters:
      - $ref: "#/components/parameters/listTrashedDocumentsFilterParam"
      - $ref: "#/components/parameters/pageKey"
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/pageSize"
      - $ref: "#/components/parameters/adminAccessQueryParam"
      summary: "List your deleted documents."
      security:
      - ssoAuth:
        - "document:trash.documents:read"
      - ssoBearerAuth: []
      description: "**Required scope:** document:trash.documents:read<br/><br/>Lists\
        \ all documents, owned by you, which currently reside in the trash.\n\nNote\
        \ that documents in the trash are irreversibly deleted after 30 days.\n\n\
        *Note that at the moment we offer a naive pagination, and therefore interim\
        \ document mutations and/or an\n    insufficient sort clause, if provided,\
        \ can lead to result inconsistencies (such as duplicates, missing entries).*\n"
      operationId: "listTrashedDocuments"
      tags:
      - "Trash"
      responses:
        "200":
          $ref: "#/components/responses/ListTrashDocumentsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/GeneralError"
  /trash/documents/{id}:
    get:
      parameters:
      - $ref: "#/components/parameters/documentIdParam"
      - $ref: "#/components/parameters/adminAccessQueryParam"
      summary: "Inspect the deleted document."
      security:
      - ssoAuth:
        - "document:trash.documents:read"
      - ssoBearerAuth: []
      description: "**Required scope:** document:trash.documents:read<br/><br/>Inspect\
        \ the deleted document's metadata.\nOnly the document owner is permitted to\
        \ do this."
      operationId: "inspectTrashedDocument"
      tags:
      - "Trash"
      responses:
        "200":
          $ref: "#/components/responses/InspectTrashDocumentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/TrashedDocumentNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/GeneralError"
    delete:
      parameters:
      - $ref: "#/components/parameters/documentIdParam"
      - $ref: "#/components/parameters/adminAccessQueryParam"
      summary: "Irreversibly destroy the document."
      security:
      - ssoAuth:
        - "document:trash.documents:delete"
      - ssoBearerAuth: []
      description: "**Required scope:** document:trash.documents:delete<br/><br/>This\
        \ operation irreversibly destroys the document.\nOnly the document owner is\
        \ permitted to do this."
      operationId: "deleteTrashedDocument"
      tags:
      - "Trash"
      responses:
        "204":
          description: "The document has been permanently deleted."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/TrashedDocumentNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/GeneralError"
  /trash/documents/{id}/restore:
    post:
      parameters:
      - $ref: "#/components/parameters/documentIdParam"
      - $ref: "#/components/parameters/adminAccessQueryParam"
      summary: "Restore the deleted document."
      security:
      - ssoAuth:
        - "document:trash.documents:restore"
      - ssoBearerAuth: []
      description: "**Required scope:** document:trash.documents:restore<br/><br/>This\
        \ operation restores the document from the trash.\nAll users who had access\
        \ before the deletion regain their access to the document.\nOnly the document\
        \ owner is permitted to do this."
      operationId: "restoreTrashedDocument"
      tags:
      - "Trash"
      responses:
        "204":
          description: "The document has been restored."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/TrashedDocumentNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/GeneralError"
  /documents:delete:
    post:
      parameters:
      - $ref: "#/components/parameters/adminAccessQueryParam"
      summary: "Bulk-delete multiple documents"
      security:
      - ssoAuth:
        - "document:documents:delete"
      - ssoBearerAuth: []
      description: "**Required scope:** document:documents:delete<br/><br/>Move the\
        \ documents with the given ids into the trash. They are no longer accessible\
        \ until they're restored from the trash. <p>The number of provided document\
        \ ids is limited to 100.</p>"
      operationId: "bulkDeleteDocument"
      tags:
      - "Documents"
      requestBody:
        $ref: "#/components/requestBodies/BulkDeleteRequest"
      responses:
        "200":
          $ref: "#/components/responses/BulkDeleteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/GeneralError"
components:
  parameters:
    fileNameParam:
      in: "query"
      name: "filename"
      description: "The optional `filename` query parameter can be passed to give\
        \ the file that's being downloaded a user-provided name and file extension\
        \ for downloading purposes. This name will be sent back to the client via\
        \ the Content-Disposition HTTP header. The passed `filename` will be trimmed\
        \ so that it doesn't contain any space characters around the name. When the\
        \ `filename` isn't specified, then the name of the document is used as file\
        \ name and no extension is added, since the service isn't aware of file extensions."
      schema:
        type: "string"
      required: false
    optimisticLockingVersionParam:
      in: "query"
      name: "optimistic-locking-version"
      description: "To protect users from accidental overrides, the current version\
        \ of the document must match the optimistic locking version parameter - otherwise,\
        \ this request will fail and the entity is left unchanged."
      schema:
        type: "string"
      required: true
    filter:
      in: "query"
      name: "filter"
      description: "\nThe filter parameter, as explained [here](https://dt-url.net/platform-services-filtering).\n\
        \nIf this parameter is omitted, no filtering is applied and all documents\
        \ available to you will be returned.\n\nFiltering by string type parameters\
        \ (`name`, `type`) when using one of the operators `contains`, `starts-with`\
        \ and `ends-with` is **case insensitive**.\n\nFiltering by `id` using the\
        \ operators `contains`, `starts-with` and `ends-with` is only supported in\
        \ case of user-given document ids.\n\nWhen using the equals operator or the\
        \ not-equals operator, filtering is **case sensitive**.\n\nThe following fields\
        \ are legal filtering parameters - any other field names will result in a\
        \ HTTP 400 response:\n\n`id`, `name`, `type`, `version`, `owner`, `modificationInfo.createdTime`,\
        \ `modificationInfo.createdBy`, `modificationInfo.lastModifiedTime`, `modificationInfo.lastModifiedBy`,\
        \ `originAppId`, `originExtensionId`, `isPrivate`, `labels`\n\nThe following\
        \ constraints apply:\n\n* Parameter names are **case-sensitive**.\n\n* Maximum\
        \ nesting depth (via brackets) is 3.\n\n* Maximum length is 1024 characters.\n\
        \n* The `labels` field only supports the `contains` operator, which checks\
        \ whether the document has a specific label assigned.\n  This is an **exact\
        \ element match** against the labels array. It's not a substring search.\n\
        \  For example, `labels contains 'foo'` matches a document with the label\
        \ `'foo'`, but **not** a document with the label `'foobar'`.\n  To find labels\
        \ by partial name (substring), use the `listLabels` operation.\n\nExamples:\n\
        \n* `name = 'my-document-name'`\n\n* `name == 'my-document-name'`\n\n* `(name\
        \ starts-with 'awesome' or type != 'dashboard') and version >= 5`\n\n* `modificationInfo.lastModifiedTime\
        \ >= '2022-07-01T00:10:05.000Z' and not (name contains 'new')`\n\n* `originAppId\
        \ exists`\n\n* `originExtensionId exists`\n\n* `type in ('dashboard', 'notebook')\
        \ and name contains 'report'`\n\n* `isPrivate = true`\n\n* `labels contains\
        \ 'my-label'`\n\n* `labels contains 'my-label' and labels contains 'other-label'`\n"
      required: false
      schema:
        type: "string"
    sort:
      in: "query"
      name: "sort"
      description: "The sort parameter, as explained [here](https://dt-url.net/platform-services-filtering)\n\
        \nIf this parameter is omitted, the documents are sorted by their ids.\n\n\
        Sorting by string types (`name`, `type`) is done in a case insensitive manner.\n\
        \nThe following fields are legal sorting parameters - any other sorting parameters\
        \ will result in a HTTP 400 response:\n* `name`,  `type`,  `version`, `owner`,\
        \ `modificationInfo.createdTime`, `modificationInfo.createdBy`, `modificationInfo.lastModifiedTime`,`modificationInfo.lastModifiedBy`,`originAppId`,\
        \ `userContext.lastAccessedTime`\n\nThe following constraints apply:\n\n*\
        \ Maximum number of sorting parameters is 5. Exceeding this limit will result\
        \ in a HTTP 400 response.\n\n* Note that blanks are *not* ignored and will\
        \ result in a HTTP 400 response.\n\nExamples:\n\n* `name`\n\n* `name,-type,modificationInfo.lastModifiedTime`\n"
      required: false
      schema:
        type: "string"
    pageKey:
      in: "query"
      name: "page-key"
      description: "The page key is used to query results from the next page.\nYou\
        \ get a `nextPageKey` parameter in the return value of this method to use\
        \ here.\nIf this parameter is omitted, the first page will be returned.\n"
      required: false
      schema:
        type: "string"
    page:
      in: "query"
      name: "page"
      description: "The page parameter is used to directly access a specific page.\n\
        The value of the page parameter, if specified, has to be a value greater than\
        \ zero.\nIf the value of the page parameter exceeds the highest available\
        \ page on the backend, an empty page is returned.\n"
      required: false
      schema:
        type: "integer"
    pageSize:
      in: "query"
      name: "page-size"
      description: "The page size which defines the requested number of result entries.\
        \ You can request a maximum of 1000 result entries.\nIf this parameter is\
        \ omitted, the default value of 20 will be used.\n"
      required: false
      schema:
        type: "integer"
    listTrashedDocumentsFilterParam:
      in: "query"
      name: "filter"
      required: false
      schema:
        type: "string"
      description: "The filter parameter, as explained [here](https://dt-url.net/platform-services-filtering).\n\
        \nIf this parameter is omitted, no filtering is applied and all your deleted\
        \ documents will be returned.\n\nFiltering by string type parameters when\
        \ using one of the operators `contains`, `starts-with` and `ends-with` is\
        \ **case insensitive**.\n\nFiltering by `id` using the operators `contains`,\
        \ `starts-with` and `ends-with` is only supported in case of user-given document\
        \ ids.\n\nWhen using the equals operator or the not-equals operator, filtering\
        \ is **case sensitive**.\n\nThe following fields are legal filtering parameters\
        \ - any other field names will result in a HTTP 400 response:\n\n`id`, `name`,\
        \ `type`, `deletionInfo.deletedTime`, `deletionInfo.deletedBy`\n\nThe following\
        \ constraints apply:\n\n* Parameter names are **case-sensitive**.\n\n* Maximum\
        \ nesting depth (via brackets) is 3.\n\n* Maximum length is 1024 characters.\n"
    snapshotVersionQueryParam:
      in: "query"
      name: "snapshot-version"
      description: "Snapshot version, to be used if you want to access a snapshot\
        \ of the document.\n"
      required: false
      schema:
        type: "integer"
    createSnapshotQueryParam:
      in: "query"
      name: "create-snapshot"
      description: "Indicates whether a new snapshot of the document should be created\
        \ before the update is applied.\n"
      required: false
      schema:
        type: "boolean"
        default: false
    adminAccessQueryParam:
      in: "query"
      name: "admin-access"
      description: "Indicates whether the operation should be performed with elevated\
        \ permissions - additionally requires **document:documents:admin**.\n\nIf\
        \ provided, the user effectively operates as owner of all documents. This\
        \ isn't supported for ready-made documents.\n"
      required: false
      schema:
        type: "boolean"
        default: false
    sendNotificationQueryParam:
      in: "query"
      name: "send-notification"
      description: "Indicates whether a notification shall be sent to share recipients\
