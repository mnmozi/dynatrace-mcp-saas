openapi: "3.0.3"
info:
  version: "1.47.1"
  title: "Document"
  x-service-category: "Document"
  x-summary: "Create, update, list and organize documents, as well as manage their\
    \ access permissions."
  description: "# Overviews\n\nThis API allows you to create and manage documents,\
    \ as well as manage access to them.\n\nHave a look at the [service documentation](https://dt-url.net/platform-services-document-service)\
    \ to familiarize yourself with its key concepts.\n\nNote, that the document's\
    \ content isn't inspected by the document-store, therefore it can be entirely\
    \ schemaless. If your content adheres to a schema, it's your responsibility to\
    \ enforce that.\n\nInformation about authorization can be found [here](https://dt-url.net/platform-services-authentication).\n\
    \n\n# Access Management\n\nThere are 2 different permission mechanisms. Most operations\
    \ involve both mechanisms.\n\n## Endpoint Permissions\nIAM permissions (e.g. `document:documents:read`)\
    \ guard endpoints. If the user doesn't have the permission required by an endpoint,\
    \ the request gets rejected.\n\nThese permissions can not be modified via the\
    \ doc-store API.\n\n## Document Permissions\nThese permissions guard individual\
    \ documents. They are modelled in the service itself, independent of IAM permissions.\n\
    \nThey can be modified via the API, e.g. by using the sharing endpoints.\n\nTherefore,\
    \ a user needs to have access both in the DT IAM layer (by having specific IAM\
    \ permissions) as well as access to the specific documents (e.g. by being document\
    \ owner).\n\n## Sharing\n\nBy default, documents are only accessible to their\
    \ owner. There are 3 ways of sharing documents.\n\nDocuments can be made **public**\
    \ (via the updateDocument operation) by the owner. This immediately grants read\
    \ access to all users in the environment.\n\n**Environment-Shares** grant read\
    \ or read-write access to users of the same environment, but **users need to actively\
    \ claim** the share.\nThe owner effectively loses control over who exactly gains\
    \ access, as any user can claim the share and therefore receive access.\n\n**Direct-Shares**\
    \ immediately grant read or read-write access to **specific users and groups**.\
    \ The **owner is in total control of who exactly receives access**, and can also\
    \ revoke access retrospectively.\n\nBy default, every user with write-access to\
    \ a document is allowed to re-share it via direct-shares and environment-shares.\
    \ The owner can disable this by setting the `isReshareable` property to `false`\
    \ (via the updateDocument operation).\n\nThe sharing mechanisms are not mutually\
    \ exclusive - a document can be shared via multiple sharing mechanisms at the\
    \ same time.\n\n## Owner Transfer\n\nDocument ownership can be changed via the\
    \ transferDocumentOwner operation.\n\n\n# Document Locking\n\n## Optimistic Locking\n\
    \nOperations which modify a document generally use **mandatory** optimistic locking.\n\
    \nWhen such operations are executed, the user must provide the version upon which\
    \ they operate.\n\nIf the document version in the service doesn't match, because\
    \ the document has been modified in the meantime, then the operation gets rejected.\n\
    \n## Active Locking\n\nIn addition to the mandatory Optimistic Locking, there\
    \ is **optional Active Locking**.\n\nActive locking can be optionally utilized\
    \ to prevent conflicts caused by multiple users concurrently updating the same\
    \ document.\n\nA user can lock a document to prevent other users from updating\
    \ the document for some time.\n\nOnce the user is done updating the document,\
    \ they can release the lock and therefore enable updates by other users.\n\n\n\
    # Deletion and Restoration\n\nDeleted documents are moved to the **trash** and\
    \ permanently deleted after 30 days.\n\nThe Trash API can be used to manage deleted\
    \ documents.\n\nRestoring a deleted document makes the document accessible again\
    \ for the owner as well as all users who had previously received access via shares.\n\
    \n\n# Snapshots\n\nDocument snapshots allow to reset a document's content back\
    \ to an earlier state.\n\nSnapshots must be explicitly created when updating the\
    \ document. Multiple snapshots can be created per document.\n\nRestoring a snapshot\
    \ means that the document's content gets changed to the state it had when the\
    \ snapshot was originally created. It doesn't change access-related data like\
    \ the document's shares or ownership.\n\nSnapshot creation is rate-limited to\
    \ 5 snapshots per 60 seconds per document.\n\nThe maximum amount of snapshots\
    \ per document is 50. Additional snapshots result in the deletion of the oldest\
    \ existing snapshot.\n\nAll snapshots get automatically deleted after 30 days.\n\
    \n## Snapshot Permissions\n\nAll users with write access to a document may list,\
    \ read, create, or restore its snapshots.\n\nFor built-in (App-Shipped or Extension)\
    \ documents, listing snapshots returns an empty list rather than a 403, since\
    \ these documents don't support snapshots.\n\nOnly the document owner (or an admin)\
    \ may delete a snapshot.\n\n# Labels\n\nLabels allow the user to organize and\
    \ search their documents.\n\nLabels are optional, a document may have zero or\
    \ more. The maximum number of labels per document is 25 and the maximum length\
    \ of each label is 80 characters.\n\n# Document Identity\n\nEach document is assigned\
    \ a unique and immutable identifier (id) at the time of creation.\n\nThis identifier\
    \ may be supplied by the user. If the user doesn't provide one, the system will\
    \ generate it automatically.\n\nRegardless of its origin, the identifier is guaranteed\
    \ to be unique across all documents and is immutable.\n\n# Admin Access\n\nRegular\
    \ users can only access documents *owned by them* or *shared with them*.\n\nUsers\
    \ with the permission `document:documents:admin` can act with elevated permission\
    \ - they can access all users' documents of the current environment, regardless\
    \ of ownership.\n\nThe admin-access can be enabled on a per-request basis, by\
    \ setting the optional request parameter `admin-access` to `true.`\n\n# User Data\n\
    \nNo user data like names or email addresses are stored. Instead, SSO ids are\
    \ persisted.\n\nEvery user's last access to every document gets stored to allow\
    \ ordering of results so that least recently accessed documents appear first.\n\
    \n# System-owned Documents\n\nSome documents are created and maintained by the\
    \ system itself, instead of being user-owned.\n\n## Ready-made Documents\nApps\
    \ can contain documents which automatically become available to all users of the\
    \ environment when the app gets installed or updated.\nThe property `originAppId`\
    \ indicates app ownership.\n\n## Extension-shipped Documents\nExtensions can contain\
    \ documents which automatically become available to all users of the environment\
    \ when the extension gets installed or updated.\nThe property `originExtensionId`\
    \ indicates extension ownership.\n"
servers:
- url: "https://asn8731h.sprint.apps.dynatracelabs.com/platform/document/v1"
  x-api-gateway-url: "/platform/document/v1"
tags:
- name: "Documents"
  description: "CRUD operations for documents and snapshots."
- name: "Direct Shares"
  description: "Share documents directly with specific users and groups."
- name: "Environment Shares"
  description: "Share documents with the whole environment, via links."
- name: "Trash"
  description: "Restore or irrevocably destroy your deleted documents."
- name: "Document Locking"
  description: "Endpoints for document locking."
paths:
  /documents:
    post:
      summary: "Create a new document."
      description: "**Required scope:** document:documents:write<br/><br/>Create a\
        \ new document. You are the owner of the created document. The document isn't\
        \ accessible to other users.\n\nThe document's `name` and `type` must be provided.\
        \ These two properties can later be used for filtering purposes, when [listing\
        \ accessible documents](#/Documents/listDocuments).\n\nBe aware, that the\
        \ `type` isn't the same as the Content-Type of the document, but instead adds\
        \ user-defined semantics of which the document-store is entirely agnostic.\n\
        \nThe content size must not exceed **50 MB**."
      operationId: "createDocument"
      security:
      - ssoAuth:
        - "document:documents:write"
      - ssoBearerAuth: []
      tags:
      - "Documents"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: "object"
              properties:
                name:
                  description: "The name of this document. This name doesn't need\
                    \ to be unique and is *not* used as identifier. Maximum length\
                    \ is 128 characters."
                  type: "string"
                  default: ""
                type:
                  description: "The type of this document. This type is *not* the\
                    \ Content-Type of the document, but instead adds a user-defined\
                    \ semantic. Maximum length is 128 characters."
                  type: "string"
                  default: ""
                description:
                  description: "Optional description of this document. Maximum length\
                    \ is 256 characters."
                  type: "string"
                  default: ""
                content:
                  description: "The binary content of this document. Its exact type\
                    \ is taken from the `Content-Type` header, which is thus mandatory."
                  type: "string"
                  format: "binary"
                id:
                  description: "Optional. If provided, this will be the id of the\
                    \ document. If not provided, a system-generated id is used.\n\
                    The following constraints apply:\n - It must be unique in this\
                    \ environment\n - Allowed characters: `A-Z` `a-z` `0-9` `-`.\n\
                    \ - It must not be a UUID, however it can contain a UUID, so e.g.\
                    \ `my-e015739d-da78-4fe4-bef1-e95c2420bc25` is allowed, while\
                    \ `e015739d-da78-4fe4-bef1-e95c2420bc25` isn't allowed.\n - Maximum\
                    \ length is 100 characters.\n"
                  type: "string"
                  default: ""
                externalId:
                  description: "**Deprecated**. Use the `id` property instead.\n\n\
                    An optional user-provided id, in addition to the system-provided\
                    \ id. The following constraints apply:\n - It must be unique in\
                    \ this environment\n - Allowed characters: `A-Z` `a-z` `0-9` `-`.\n\
                    \ - It must not be a UUID, however it can contain a UUID, so e.g.\
                    \ `my-e015739d-da78-4fe4-bef1-e95c2420bc25` is allowed, while\
                    \ `e015739d-da78-4fe4-bef1-e95c2420bc25` isn't allowed.\n - Maximum\
                    \ length is 100 characters.\n"
                  type: "string"
                  deprecated: true
                  default: ""
              required:
              - "name"
              - "type"
              - "content"
        required: true
      responses:
        "201":
          $ref: "#/components/responses/DocumentCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ExternalIdAlreadyExists"
        "413":
          $ref: "#/components/responses/DocumentTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
        default:
          $ref: "#/components/responses/GeneralError"
    get:
      parameters:
      - $ref: "#/components/parameters/filter"
      - $ref: "#/components/parameters/sort"
      - $ref: "#/components/parameters/pageKey"
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/pageSize"
      - $ref: "#/components/parameters/adminAccessQueryParam"
      - name: "add-fields"
        in: "query"
        description: "Comma-separated list of field names that are added to the default\
          \ set of fields.\nYou can include the following additional fields:\n- `description`\n\
          - `userContext.lastAccessedTime`\n- `originExtensionId`\n- `shareInfo.isShared`\n\
          - `shareInfo.isSharedWithCurrentUser`\n- `labels`\n"
        required: false
        schema:
          type: "string"
      summary: "List all documents accessible to you."
      security:
      - ssoAuth:
        - "document:documents:read"
      - ssoBearerAuth: []
      description: "**Required scope:** document:documents:read<br/><br/>List the\
        \ metadata of all documents accessible to you.\n\n\nThis includes your own\
        \ documents, as well as other users' documents which have been shared with\
        \ you.\n\n\n*Note, that at the moment we offer a naive pagination, and therefore\
        \ interim document mutations and/or an\ninsufficient sort clause, if provided,\
        \ can lead to result inconsistencies (such as duplicates, missing entries).*\n"
      operationId: "listDocuments"
      tags:
      - "Documents"
      responses:
        "200":
          $ref: "#/components/responses/DocumentMetadataList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/GeneralError"
  /documents/{id}:
    get:
      parameters:
      - $ref: "#/components/parameters/documentIdParam"
      - $ref: "#/components/parameters/fileNameParam"
      - $ref: "#/components/parameters/snapshotVersionQueryParam"
      - $ref: "#/components/parameters/adminAccessQueryParam"
      - name: "add-fields"
        in: "query"
        description: "Comma-separated list of field names that are added to the default\
          \ set of fields.\nYou can include the following additional fields:\n- `userContext.lastAccessedTime`\n\
          - `modificationInfo.lastModifyingAppId`\n"
        required: false
        schema:
          type: "string"
      summary: "Retrieve metadata and content."
      security:
      - ssoAuth:
        - "document:documents:read"
      - ssoBearerAuth: []
      description: "**Required scope:** document:documents:read<br/><br/>Return metadata\
        \ and content in one multipart response.\n\nIf the `snapshot-version` param\
        \ is provided, the metadata and content of the specified snapshot gets returned\
        \ instead. This requires write-access to the document.\n\nThe document must\
        \ be accessible to you - therefore, you must either own it or you have received\
        \ access through sharing."
      operationId: "getDocument"
      tags:
      - "Documents"
      responses:
        "200":
          $ref: "#/components/responses/FullDocument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DocumentOrSnapshotNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/GeneralError"
    patch:
      parameters:
      - $ref: "#/components/parameters/documentIdParam"
      - $ref: "#/components/parameters/optimisticLockingVersionParam"
      - $ref: "#/components/parameters/createSnapshotQueryParam"
      - $ref: "#/components/parameters/adminAccessQueryParam"
      summary: "Update metadata and content. Optionally, create a snapshot."
      security:
      - ssoAuth:
        - "document:documents:write"
      - ssoBearerAuth: []
      description: "**Required scope:** document:documents:write<br/><br/>Update metadata\
        \ and/or the content of the document.\n\nName, type, and content must be non-empty.\
        \ Name, type, content, isPrivate and isReshareable are optional, but at least\
        \ one of them must be provided.\n\nThe document must be accessible to you\
        \ - therefore, you must either own it or you have received access through\
        \ sharing.\n\nAs part of this operation, you can optionally create a snapshot\
        \ of the document before the update is applied.\nIn that case, if the document\
        \ has more than 50 snapshots, its oldest snapshot gets automatically deleted.\n\
        A maximum of 5 snapshots can be created per document within a 60-second period.\n"
      operationId: "updateDocument"
      tags:
      - "Documents"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: "object"
              properties:
                name:
                  description: "The name of this document. This name doesn't need\
                    \ to be unique and is *not* used as identifier.\n\nMaximum length\
                    \ is 128 characters.\nOptional - if not provided, no change happens.\n"
                  type: "string"
                  default: ""
                type:
                  description: "The type of this document. This type is *not* the\
                    \ Content-Type of the document, but instead adds a user-defined\
                    \ semantic.\n\nMaximum length is 128 characters.\nOptional - if\
                    \ not provided, no change happens.\n"
                  type: "string"
                  default: ""
                description:
                  description: "Description of this document.\n\nMaximum length is\
                    \ 256 characters.\nOptional - if not provided, no change happens.\n"
                  type: "string"
                  default: ""
                content:
                  description: "The binary content of this document. Its exact type\
                    \ is taken from the `Content-Type` header, which is thus mandatory.\n\
                    Optional - if not provided, no change happens.\n"
                  type: "string"
                  format: "binary"
                snapshotDescription:
                  description: "An optional user-provided description of the snapshot's\
                    \ content or the changes it introduced.\n\nThis description gets\
                    \ ignored if the query-param `create-snapshot` isn't set to true.\n\
                    \nMaximum length is 128 characters.\n"
                  type: "string"
                  default: ""
                labels:
                  type: "array"
                  items:
                    type: "string"
                  description: "An optional set of user-defined labels.\n\nThe maximum\
                    \ length of each label is 80 characters and the maximum number\
                    \ of labels is 25.\n\nAllowed characters: `A-Z` `a-z` `0-9` `:`\
                    \ `.` `;` `_` `#` `-` `!` `?` `/` `\\` `|` `@` `&` `<` `>` ` `\
                    \ (space)\n\nOptional - if not provided, no change happens.\n"
                  default: null
                isPrivate:
                  description: "Controls whether this document should be public. Public\
                    \ documents can be read by every user of the environment.\nThis\
                    \ can only be changed by the document owner.\nOptional - if not\
                    \ provided, no change happens.\n"
                  type: "boolean"
                  default: null
                isReshareable:
                  description: "Controls whether users who receive write access via\
                    \ shares may re-share the document with other users.\nThis can\
                    \ only be changed by the document owner.\nOptional - if not provided,\
                    \ no change happens.\n"
                  type: "boolean"
                  default: null
        required: true
      responses:
        "200":
          $ref: "#/components/responses/UpdateDocumentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/SnapshotCreationRateLimitExceeded"
        "404":
          $ref: "#/components/responses/DocumentNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/DocumentTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
        default:
          $ref: "#/components/responses/GeneralError"
    delete:
      parameters:
      - $ref: "#/components/parameters/documentIdParam"
      - $ref: "#/components/parameters/optimisticLockingVersionParam"
      - $ref: "#/components/parameters/adminAccessQueryParam"
      summary: "Delete the document"
      security:
      - ssoAuth:
        - "document:documents:delete"
      - ssoBearerAuth: []
      description: "**Required scope:** document:documents:delete<br/><br/>Move the\
        \ document into the trash. It is no longer accessible until it's restored\
        \ from the trash.\n\n[Optimistic locking](https://dt-url.net/platform-services-locking)\
        \ is enforced via the `optimistic-locking-version` parameter.\n\nYou must\
        \ own the document to delete it."
      operationId: "deleteDocument"
      tags:
      - "Documents"
      responses:
        "204":
          $ref: "#/components/responses/DocumentDeleted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DocumentNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/GeneralError"
  /documents/{id}/metadata:
    get:
      parameters:
      - $ref: "#/components/parameters/documentIdOrExternalIdParam"
      - $ref: "#/components/parameters/snapshotVersionQueryParam"
      - $ref: "#/components/parameters/adminAccessQueryParam"
      - name: "add-fields"
        in: "query"
        description: "Comma-separated list of field names that are added to the default\
          \ set of fields.\nYou can include the following additional fields:\n- `userContext.lastAccessedTime`\n\
          - `modificationInfo.lastModifyingAppId`\n"
        required: false
        schema:
          type: "string"
      summary: "Retrieve document metadata."
      security:
      - ssoAuth:
        - "document:documents:read"
      - ssoBearerAuth: []
      description: "**Required scope:** document:documents:read<br/><br/>Retrieve\
        \ a document's metadata.\n\nThe document must be accessible to you - therefore,\
        \ you must either own it or you have received access through sharing.\n\n\
        If the `snapshot-version` param is provided, the metadata of the specified\
        \ snapshot gets returned instead. This requires write-access to the document."
      operationId: "getDocumentMetadata"
      tags:
      - "Documents"
      responses:
        "200":
          $ref: "#/components/responses/DocumentMetadata"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DocumentOrSnapshotNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/GeneralError"
    patch:
      deprecated: true
      parameters:
      - $ref: "#/components/parameters/documentIdParam"
      - $ref: "#/components/parameters/optimisticLockingVersionParam"
      - $ref: "#/components/parameters/adminAccessQueryParam"
      summary: "Update document metadata"
      security:
      - ssoAuth:
        - "document:documents:write"
      - ssoBearerAuth: []
      description: "**Required scope:** document:documents:write<br/><br/>Deprecated\
        \ - the preferred way to update a document is the [updateDocument](#/Documents/updateDocument)\
        \ operation.\n\nPartially update a document's user-defined metadata. At least\
        \ one property must be updated, otherwise the operation fails.\n\nThe document's\
        \ content isn't affected by this operation.\n\n[Optimistic locking](https://dt-url.net/platform-services-locking)\
        \ is enforced via the `optimistic-locking-version` parameter.\n\nThe document\
        \ must be accessible to you - therefore, you must either own it or you have\
        \ received access through sharing."
      operationId: "updateDocumentMetadata"
      tags:
      - "Documents"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: "object"
              properties:
                name:
                  description: "Document name."
                  type: "string"
                  default: ""
                type:
                  description: "Document type."
                  type: "string"
                  default: ""
      responses:
        "200":
          $ref: "#/components/responses/DocumentUpdated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DocumentNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/GeneralError"
  /documents/{id}/content:
    get:
      parameters:
      - $ref: "#/components/parameters/documentIdParam"
      - $ref: "#/components/parameters/fileNameParam"
      - $ref: "#/components/parameters/snapshotVersionQueryParam"
      - $ref: "#/components/parameters/adminAccessQueryParam"
      summary: "Download document content"
      security:
      - ssoAuth:
        - "document:documents:read"
      - ssoBearerAuth: []
      description: "**Required scope:** document:documents:read<br/><br/>Download\
        \ latest document content.\n\nIf the `snapshot-version` param is provided,\
        \ the content of the specified snapshot gets returned instead. This requires\
        \ write-access to the document.\n\nThe document must be accessible to you\
        \ - therefore, you must either own it or you have received access through\
        \ sharing.\n\nThe response's `Content-Type` header has the same value that\
        \ has been used during the upload."
      operationId: "downloadDocumentContent"
      tags:
      - "Documents"
      responses:
        "200":
          $ref: "#/components/responses/DocumentContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DocumentOrSnapshotNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/GeneralError"
    put:
      summary: "Update document content"
      security:
      - ssoAuth:
        - "document:documents:write"
      - ssoBearerAuth: []
      description: "**Required scope:** document:documents:write<br/><br/>Update a\
        \ document's content, by completely replacing it.\n\nThe document must be\
        \ accessible to you - therefore, you must either own it or you have received\
        \ access through sharing.\n\n[Optimistic locking](https://dt-url.net/platform-services-locking)\
        \ is enforced via the `optimistic-locking-version` parameter.\n\nThe content\
        \ size must be greater than 0 and must not exceed `50 MB`.\n\nThe `Content-Type`\
        \ header must be set for the multipart part; it will be used as the (new)\
        \ content type of the document. Illegal (non-mime-type) content types result\
        \ in a `400 - Bad Request` error.\n\nThe `Content-Disposition` header must\
        \ be set for the multipart part;"
      operationId: "updateDocumentContent"
      tags:
      - "Documents"
      parameters:
      - $ref: "#/components/parameters/documentIdParam"
      - $ref: "#/components/parameters/optimisticLockingVersionParam"
      - $ref: "#/components/parameters/adminAccessQueryParam"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: "object"
              properties:
                content:
                  type: "string"
                  format: "binary"
              required:
              - "content"
      responses:
        "200":
          $ref: "#/components/responses/DocumentContentUpdated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DocumentNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/DocumentTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
        default:
          $ref: "#/components/responses/GeneralError"
  /documents/{id}/snapshots:
    parameters:
    - $ref: "#/components/parameters/documentIdParam"
    - $ref: "#/components/parameters/adminAccessQueryParam"
    - $ref: "#/components/parameters/pageKey"
    - $ref: "#/components/parameters/page"
    - $ref: "#/components/parameters/pageSize"
    get:
      summary: "List all snapshots of the document"
      security:
      - ssoAuth:
        - "document:documents:read"
      - ssoBearerAuth: []
      description: "**Required scope:** document:documents:read<br/><br/>Returns metadata\
        \ of all snapshots of the document, in descending order of the snapshot version.\
        \ Requires write-access to the document. For built-in documents, this endpoint\
        \ returns an empty list rather than a 403, since built-in documents don't\
        \ support snapshots.\n\nYou can apply pagination via the `pageKey` and `pageSize`\
        \ parameters.\n\n*Note, that at the moment we offer a naive pagination, and\
        \ therefore interim mutations can lead to result inconsistencies (such as\
        \ duplicates, missing entries).*"
      operationId: "listSnapshots"
      tags:
      - "Documents"
      responses:
        "200":
          $ref: "#/components/responses/SnapshotListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DocumentNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/GeneralError"
  /documents/{id}/snapshots/{snapshot-version}:
    parameters:
    - $ref: "#/components/parameters/documentIdParam"
    - $ref: "#/components/parameters/snapshotVersionPathParam"
    - $ref: "#/components/parameters/adminAccessQueryParam"
    get:
      summary: "Retrieve snapshot metadata."
      security:
      - ssoAuth:
        - "document:documents:read"
      - ssoBearerAuth: []
      description: "**Required scope:** document:documents:read<br/><br/>Retrieve\
        \ snapshot metadata. Requires write-access to the document.\n\nThis doesn't\
        \ return data of the snapshotted document, instead it returns data about the\
        \ snapshot itself.\n"
      operationId: "getSnapshotMetadata"
      tags:
      - "Documents"
      responses:
        "200":
          $ref: "#/components/responses/GetSnapshotMetadataResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SnapshotNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/GeneralError"
    delete:
      summary: "Delete the snapshot."
      security:
      - ssoAuth:
        - "document:documents:write"
      - ssoBearerAuth: []
      description: "**Required scope:** document:documents:write<br/><br/>Irrevocably\
        \ delete the snapshot. Only the document owner may do this.\n\nThis operation\
        \ doesn't affect the current state of the document.\n\nInstead, it prevents\
        \ that the document may ever be restored to the state it had when the snapshot\
        \ was created.\n"
      operationId: "deleteSnapshot"
      tags:
      - "Documents"
      responses:
        "204":
          description: "The snapshot has been deleted."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SnapshotNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/GeneralError"
  /documents/{id}/snapshots/{snapshot-version}:restore:
    parameters:
    - $ref: "#/components/parameters/documentIdParam"
    - $ref: "#/components/parameters/snapshotVersionPathParam"
    - $ref: "#/components/parameters/adminAccessQueryParam"
    post:
      summary: "Restore the snapshot."
      security:
      - ssoAuth:
        - "document:documents:write"
      - ssoBearerAuth: []
      description: "**Required scope:** document:documents:write<br/><br/>Reset the\
        \ document to the state it had when the snapshot was created. Requires write-access\
        \ to the document.\n\nIf no snapshot of the current document state exists,\
        \ then a new snapshot is created\nbefore restoring the selected snapshot.\n\
        If the document has more than 50 snapshots, its oldest snapshot gets automatically\
        \ deleted.\n\nThis operation doesn't change ownership or access/sharing data.\n"
      operationId: "restoreSnapshot"
      tags:
      - "Documents"
      responses:
        "200":
          $ref: "#/components/responses/RestoreSnapshotResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DocumentOrSnapshotNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/GeneralError"
  /documents/{id}:inspect-lock:
    get:
      parameters:
      - $ref: "#/components/parameters/documentIdParam"
      summary: "Inspect whether the document is locked."
      security:
      - ssoAuth:
        - "document:documents:read"
      - ssoBearerAuth: []
      description: "**Required scope:** document:documents:read<br/><br/>Inspect whether\
        \ the document is locked.\n\nThis provides the information about whether the\
        \ document is locked and the user that currently owns the lock."
      operationId: "inspectLock"
      tags:
      - "Document Locking"
      responses:
        "200":
          $ref: "#/components/responses/InspectLockResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DocumentNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/GeneralError"
  /documents/{id}:acquire-lock:
    parameters:
    - $ref: "#/components/parameters/documentIdParam"
    post:
      summary: "Acquire the lock on the document."
      security:
      - ssoAuth:
        - "document:documents:write"
      - ssoBearerAuth: []
      description: "**Required scope:** document:documents:write<br/><br/>Acquire\
        \ the lock on the document. A user can lock a maximum of five documents at\
        \ any given time. Once the lock is acquired by the user, other users cannot\
        \ make any updates to the document.\n\nThe user acquiring the lock can optionally\
        \ specify the duration for which the lock can be attained. However, the specified\
        \ duration must not exceed the maximum allowed duration of 15 minutes. If\
        \ not specified, the lock is acquired for 10 minutes.\n\nIf the user who has\
        \ currently locked the document attempts to acquire the lock for the same\
        \ document again, the duration of the lock gets extended by the specified\
        \ duration or by a default duration of 10 minutes, if not specified.\n\nThe\
        \ other users would not be allowed to acquire the lock on an already locked\
        \ document."
      operationId: "acquireLock"
      tags:
      - "Document Locking"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcquireLock"
      responses:
        "200":
          description: "The lock has been acquired by the user."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquireLockResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DocumentNotFound"
        "409":
          $ref: "#/components/responses/DocumentAlreadyLocked"
        "429":
          $ref: "#/components/responses/LockedDocumentsLimitReached"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/GeneralError"
  /documents/{id}:release-lock:
    parameters:
    - $ref: "#/components/parameters/documentIdParam"
    post:
      summary: "Release the lock on the document."
      security:
      - ssoAuth:
        - "document:documents:write"
      - ssoBearerAuth: []
      description: "**Required scope:** document:documents:write<br/><br/>Release\
        \ the lock on the document.\nThe lock on the document can be released only\
        \ by the user who owns it."
      operationId: "releaseLock"
      tags:
      - "Document Locking"
      responses:
        "200":
          description: "The lock on the document has been released."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DocumentNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/GeneralError"
  /documents/{id}:transfer-owner:
    parameters:
    - $ref: "#/components/parameters/documentIdParam"
    - $ref: "#/components/parameters/sendNotificationQueryParam"
