          \ for manual testing purposes via swagger."
      - name: "limit"
        required: false
        in: "query"
        description: "Number of results to return per page."
        schema:
          type: "integer"
      - in: "query"
        name: "notificationType"
        schema:
          type: "string"
        description: "String that defines the type of a notification in context of\
          \ an app. Allows to differentiate between multiple types of notifications\
          \ in context of one app."
      - name: "offset"
        required: false
        in: "query"
        description: "The initial index from which to return the results."
        schema:
          type: "integer"
      - name: "ordering"
        required: false
        in: "query"
        description: "Which field to use when ordering the results."
        schema:
          type: "string"
      - in: "query"
        name: "resourceId"
        schema:
          type: "string"
        description: "Unique identifier of resource to notify on. Used to determine\
          \ if there is a notification registered for a resource in context of the\
          \ app and notification type for a user."
      - name: "search"
        required: false
        in: "query"
        description: "A search term."
        schema:
          type: "string"
      tags:
      - "resource-notifications"
      security:
      - client_credentials:
        - "notification:notifications:read"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedResourceNotificationList"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** notification:notifications:read"
    post:
      operationId: "createResourceNotification"
      tags:
      - "resource-notifications"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceNotificationRequest"
        required: true
      security:
      - client_credentials:
        - "notification:notifications:write"
      - ssoBearerAuth: []
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceNotification"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** notification:notifications:write"
  /resource-notifications/{notificationType}/{resourceId}:
    delete:
      operationId: "deleteResourceNotificationByTypeAndResource"
      parameters:
      - in: "query"
        name: "appId"
        schema:
          type: "string"
        description: "Application id associated with the notification. Optional, by\
          \ default automatically inferred from the request header. Only relevant\
          \ for manual testing purposes via swagger."
      - in: "path"
        name: "notificationType"
        schema:
