          \ an app. Allows to differentiate between multiple types of notifications\
          \ in context of one app."
        required: true
      - in: "path"
        name: "resourceId"
        schema:
          type: "string"
        description: "Unique identifier of resource to notify on. Used to determine\
          \ if there is a notification registered for a resource in context of the\
          \ app and notification type for a user."
        required: true
      tags:
      - "resource-notifications"
      security:
      - client_credentials:
        - "notification:notifications:write"
      - ssoBearerAuth: []
      responses:
