openapi: "3.0.3"
info:
  title: "Notification v2"
  version: "1.4376.1"
  description: "Manage resource/event notifications with the Notification Service\
    \ API."
  x-service-category: "Notification"
  x-summary: "Manage resource/event notifications with the Notification Service API."
paths:
  /event-notifications:
    get:
      operationId: "getEventNotifications"
      parameters:
      - in: "query"
        name: "appId"
        schema:
          type: "string"
        description: "Application id associated with the notification. Optional, by\
          \ default automatically inferred from the request header. Only relevant\
          \ for manual testing purposes via swagger."
      - name: "limit"
        required: false
        in: "query"
        description: "Number of results to return per page."
        schema:
          type: "integer"
      - in: "query"
        name: "notificationType"
        schema:
          type: "string"
        description: "String that defines the type of a notification in context of\
          \ an app. Allows to differentiate between multiple types of notifications\
          \ in context of one app."
      - name: "offset"
        required: false
        in: "query"
        description: "The initial index from which to return the results."
        schema:
          type: "integer"
      - name: "ordering"
        required: false
        in: "query"
        description: "Which field to use when ordering the results."
        schema:
          type: "string"
      - in: "query"
        name: "owner"
        schema:
          type: "string"
      - in: "query"
        name: "resourceId"
        schema:
          type: "string"
        description: "Unique identifier of resource to notify on. Used to determine\
          \ if there is a notification registered for a resource in context of the\
          \ app and notification type for a user."
      - name: "search"
        required: false
        in: "query"
        description: "A search term."
        schema:
          type: "string"
      tags:
      - "event-notifications"
      security:
      - client_credentials:
        - "notification:notifications:read"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedEventNotificationList"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** notification:notifications:read"
    post:
      operationId: "createEventNotification"
      tags:
      - "event-notifications"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventNotificationRequest"
        required: true
      security:
      - client_credentials:
        - "notification:notifications:write"
      - ssoBearerAuth: []
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventNotification"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** notification:notifications:write"
  /event-notifications/{id}:
    get:
      operationId: "getEventNotification"
      parameters:
      - in: "path"
        name: "id"
        schema:
          type: "string"
          format: "uuid"
        description: "A UUID string identifying this self notification."
        required: true
      tags:
      - "event-notifications"
      security:
      - client_credentials:
        - "notification:notifications:read"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventNotification"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** notification:notifications:read"
    put:
      operationId: "updateEventNotification"
      parameters:
      - in: "path"
        name: "id"
        schema:
          type: "string"
          format: "uuid"
        description: "A UUID string identifying this self notification."
        required: true
      tags:
      - "event-notifications"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventNotificationUpdate"
        required: true
      security:
      - client_credentials:
        - "notification:notifications:write"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventNotification"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** notification:notifications:write"
    patch:
      operationId: "patchEventNotification"
      parameters:
      - in: "path"
        name: "id"
        schema:
          type: "string"
          format: "uuid"
        description: "A UUID string identifying this self notification."
        required: true
      tags:
      - "event-notifications"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventNotificationUpdate"
        required: true
      security:
      - client_credentials:
        - "notification:notifications:write"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventNotification"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** notification:notifications:write"
    delete:
      operationId: "deleteEventNotification"
      parameters:
      - in: "path"
        name: "id"
        schema:
          type: "string"
          format: "uuid"
        description: "A UUID string identifying this self notification."
        required: true
      tags:
      - "event-notifications"
      security:
      - client_credentials:
        - "notification:notifications:write"
      - ssoBearerAuth: []
      responses:
        "204":
          description: "No response body"
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** notification:notifications:write"
  /resource-notifications:
    get:
      operationId: "getResourceNotifications"
      parameters:
      - in: "query"
        name: "appId"
        schema:
          type: "string"
        description: "Application id associated with the notification. Optional, by\
