components:
  schemas:
    DavisEventConfig:
      additionalProperties: false
      properties:
        entityTagsMatch:
          anyOf:
          - $ref: "#/components/schemas/EntityTagsMatch"
          nullable: true
        entityTags:
          anyOf:
          - $ref: "#/components/schemas/EntityTags"
          nullable: true
        onProblemClose:
          default: false
          deprecated: true
          description: "Trigger on Davis event open only or also on close. Deprecated\
            \ — use triggerOn instead."
          type: "boolean"
        triggerOn:
          description: "Event state to trigger on. \"open\" (active only), \"open-and-close\"\
            \ (both phases), or \"close\" (closure only). When unset, falls back to\
            \ onProblemClose for backward compatibility."
          nullable: true
          anyOf:
          - $ref: "#/components/schemas/TriggerOn"
        names:
          items:
            $ref: "#/components/schemas/DavisEventName"
          nullable: true
          type: "array"
          uniqueItems: true
        types:
          deprecated: true
          items:
            type: "string"
          nullable: true
          type: "array"
          uniqueItems: true
        customFilter:
          default: ""
          description: "Additional DQL matcher expression to further filter events\
            \ to match."
          nullable: true
          type: "string"
        maintenanceWindowTriggerBehavior:
          default: "always"
          anyOf:
          - $ref: "#/components/schemas/MaintenanceWindowTriggerBehaviorType"
      title: "DavisEventConfig"
      type: "object"
    DavisEventName:
      additionalProperties: false
      properties:
        match:
          $ref: "#/components/schemas/DavisEventNameMatch"
        name:
          type: "string"
      required:
      - "match"
      - "name"
      title: "DavisEventName"
      type: "object"
    DavisEventNameMatch:
      title: "DavisEventNameMatch"
      type: "string"
      enum:
      - "equals"
      - "contains"
      description: "Davis event name must equal or contain the string provided."
    DavisEventTriggerConfig:
      additionalProperties: false
      example:
        type: "davis-event"
        value:
          entityTags:
            environment:
            - "production"
            service:
            - "database"
          entityTagsMatch: "all"
          maintenanceWindowTriggerBehavior: "always"
          names:
          - match: "equals"
            name: "CUSTOM_ALERT"
          triggerOn: "open"
      properties:
        type:
          $ref: "#/components/schemas/DavisEventTriggerConfigType"
        value:
          $ref: "#/components/schemas/DavisEventConfig"
      required:
      - "type"
      - "value"
      title: "DavisEventTriggerConfig"
      type: "object"
    DavisEventTriggerConfigType:
      enum:
      - "davis-event"
      type: "string"
    DavisProblemCategories:
      additionalProperties: false
      properties:
        monitoringUnavailable:
          default: false
          type: "boolean"
        availability:
          default: false
          type: "boolean"
        error:
          default: false
          type: "boolean"
        slowdown:
          default: false
          type: "boolean"
        resource:
          default: false
          type: "boolean"
        custom:
          default: false
          type: "boolean"
        info:
          default: false
          type: "boolean"
      title: "DavisProblemCategories"
      type: "object"
    DavisProblemConfig:
      additionalProperties: false
      properties:
        entityTagsMatch:
          anyOf:
          - $ref: "#/components/schemas/EntityTagsMatch"
          nullable: true
        entityTags:
          anyOf:
          - $ref: "#/components/schemas/EntityTags"
          nullable: true
        onProblemClose:
          default: false
          deprecated: true
          description: "Trigger on Davis problem open only or also on close. Deprecated\
            \ — use triggerOn instead."
          type: "boolean"
        triggerOn:
          description: "Problem state to trigger on. \"open\" (active only), \"open-and-close\"\
            \ (both phases), or \"close\" (closure only). When unset, falls back to\
            \ onProblemClose for backward compatibility."
          nullable: true
          anyOf:
          - $ref: "#/components/schemas/TriggerOn"
        categories:
          $ref: "#/components/schemas/DavisProblemCategories"
        customFilter:
          default: ""
          description: "Additional DQL matcher expression to further filter events\
            \ to match."
          nullable: true
          type: "string"
        analysisReady:
          default: false
          description: "Run only after first root cause analysis run completed."
          type: "boolean"
        severityThreshold:
          description: "Triggers only for problems whose severity is this value or\
            \ more severe. Lower numbers are more severe (1 = critical, 5 = informational),\
            \ so 3 matches severities 1, 2, and 3."
          maximum: 5
          minimum: 1
          nullable: true
          type: "integer"
        triggerOnUpdateFields:
          description: "Problem event fields tracked for value changes. Changes to\
            \ any selected field cause re-triggering."
          items:
            $ref: "#/components/schemas/TriggerOnUpdateFields"
          type: "array"
          uniqueItems: true
        problemOpenDuration:
          description: "Minimum problem duration in minutes before the trigger fires."
          enum:
          - 5
          - 10
          - 15
          - 30
          - 60
          - 120
          - 240
          - 1440
          - 10080
          nullable: true
          type: "integer"
      required:
      - "categories"
      title: "DavisProblemConfig"
      type: "object"
    DavisProblemTriggerConfig:
      additionalProperties: false
      example:
        type: "davis-problem"
        value:
          analysisReady: false
          categories:
            availability: false
            custom: false
            error: true
            info: false
            monitoringUnavailable: false
            resource: false
            slowdown: false
          entityTags:
            environment:
            - "production"
          entityTagsMatch: "all"
          severityThreshold: 3
          triggerOn: "open"
          triggerOnUpdateFields:
          - "event.severity"
          - "smartscape.affected_entities"
      properties:
        type:
          $ref: "#/components/schemas/DavisProblemTriggerConfigType"
        value:
          $ref: "#/components/schemas/DavisProblemConfig"
      required:
      - "type"
      - "value"
      title: "DavisProblemTriggerConfig"
      type: "object"
    DavisProblemTriggerConfigType:
      enum:
      - "davis-problem"
      type: "string"
    EntityTags:
      additionalProperties:
        anyOf:
        - type: "string"
        - items:
            type: "string"
          type: "array"
      description: "Entity tags to match by key and (optional) values. For example\
        \ {\"foo\": [], \"bar\": [\"a\", \"b\", \"c\"]}"
      title: "EntityTags"
      type: "object"
    EntityTagsMatch:
      title: "EntityTagsMatch"
      type: "string"
      enum:
      - "all"
      - "any"
      description: "Event must match all or any of the entity tags."
    Error:
      properties:
        message:
          type: "string"
        code:
          type: "integer"
        details:
          $ref: "#/components/schemas/ErrorDetails"
      required:
      - "message"
      - "code"
      title: "Error"
      type: "object"
    ErrorDetails:
      additionalProperties: true
      properties:
        errorCode:
          type: "string"
        errorRef:
          type: "string"
      title: "ErrorDetails"
      type: "object"
    ErrorEnvelope:
      properties:
        error:
          $ref: "#/components/schemas/Error"
      required:
      - "error"
      title: "ErrorEnvelope"
      type: "object"
    EventNotification:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        title:
          type: "string"
        resourceId:
          type: "string"
          description: "Unique identifier of resource to notify on. Used to determine\
            \ if there is a notification registered for a resource in context of the\
            \ app and notification type for a user."
          maxLength: 120
        notificationType:
          type: "string"
          description: "String that defines the type of a notification in context\
            \ of an app. Allows to differentiate between multiple types of notifications\
            \ in context of one app."
          maxLength: 50
        triggerConfiguration:
          $ref: "#/components/schemas/EventTriggerConfig"
        modificationInfo:
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/ModificationInfo"
        input:
          description: "Input object consisting of subject and content. Supports automation\
            \ expressions https://dt-url.net/workflows-expression-reference and markdown\
            \ syntax. A template provided with an app ({notification_type}.notification-template.json)\
            \ will take precedence over the input provided here."
          anyOf:
          - $ref: "#/components/schemas/EventNotificationInput"
        appId:
          type: "string"
          description: "App id for registered notification. Optional, by default automatically\
            \ inferred from the request. Only relevant for manual testing purposes\
            \ via swagger."
          maxLength: 100
        owner:
          type: "string"
          format: "uuid"
          readOnly: true
      required:
      - "modificationInfo"
      - "notificationType"
      - "owner"
      - "resourceId"
      - "triggerConfiguration"
      - "id"
    EventNotificationInput:
      properties:
        subject:
          nullable: true
          type: "string"
        content:
          nullable: true
          type: "string"
      title: "EventNotificationInput"
      type: "object"
    EventNotificationRequest:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        title:
          type: "string"
          minLength: 1
        resourceId:
          type: "string"
          minLength: 1
          description: "Unique identifier of resource to notify on. Used to determine\
            \ if there is a notification registered for a resource in context of the\
            \ app and notification type for a user."
          maxLength: 120
        notificationType:
          type: "string"
          minLength: 1
          description: "String that defines the type of a notification in context\
            \ of an app. Allows to differentiate between multiple types of notifications\
            \ in context of one app."
          maxLength: 50
        triggerConfiguration:
          $ref: "#/components/schemas/EventTriggerConfig"
        input:
          description: "Input object consisting of subject and content. Supports automation\
            \ expressions https://dt-url.net/workflows-expression-reference and markdown\
            \ syntax. A template provided with an app ({notification_type}.notification-template.json)\
            \ will take precedence over the input provided here."
          anyOf:
          - $ref: "#/components/schemas/EventNotificationInput"
        appId:
          type: "string"
          minLength: 1
          description: "App id for registered notification. Optional, by default automatically\
            \ inferred from the request. Only relevant for manual testing purposes\
            \ via swagger."
          maxLength: 100
      required:
      - "notificationType"
      - "resourceId"
      - "triggerConfiguration"
    EventNotificationUpdate:
      type: "object"
      properties:
        title:
          type: "string"
          minLength: 1
        resourceId:
          type: "string"
          minLength: 1
          description: "Unique identifier of resource to notify on. Used to determine\
            \ if there is a notification registered for a resource in context of the\
            \ app and notification type for a user."
          maxLength: 120
        notificationType:
          type: "string"
          minLength: 1
          description: "String that defines the type of a notification in context\
            \ of an app. Allows to differentiate between multiple types of notifications\
            \ in context of one app."
          maxLength: 50
        triggerConfiguration:
          $ref: "#/components/schemas/EventTriggerConfig"
        input:
          description: "Input object consisting of subject and content. Supports automation\
            \ expressions https://dt-url.net/workflows-expression-reference and markdown\
            \ syntax. A template provided with an app ({notification_type}.notification-template.json)\
            \ will take precedence over the input provided here."
          anyOf:
          - $ref: "#/components/schemas/EventNotificationInput"
        appId:
          type: "string"
          minLength: 1
          description: "App id for registered notification. Optional, by default automatically\
            \ inferred from the request. Only relevant for manual testing purposes\
            \ via swagger."
          maxLength: 100
    EventQuery:
