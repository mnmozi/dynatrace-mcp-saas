      title: "DavisEventNameMatch"
      type: "string"
      enum:
      - "equals"
      - "contains"
      description: "Davis event name must equal or contain the string provided."
    DavisEventTriggerConfig:
      additionalProperties: false
      example:
        type: "davis-event"
        value:
          entityTags:
            environment:
            - "production"
            service:
            - "database"
          entityTagsMatch: "all"
          maintenanceWindowTriggerBehavior: "always"
          names:
          - match: "equals"
            name: "CUSTOM_ALERT"
          triggerOn: "open"
      properties:
        type:
          $ref: "#/components/schemas/DavisEventTriggerConfigType"
        value:
          $ref: "#/components/schemas/DavisEventConfig"
      required:
      - "type"
      - "value"
      title: "DavisEventTriggerConfig"
      type: "object"
    DavisEventTriggerConfigType:
      enum:
      - "davis-event"
      type: "string"
    DavisProblemCategories:
      additionalProperties: false
      properties:
        monitoringUnavailable:
          default: false
          type: "boolean"
        availability:
          default: false
          type: "boolean"
        error:
          default: false
          type: "boolean"
        slowdown:
          default: false
          type: "boolean"
        resource:
          default: false
          type: "boolean"
        custom:
          default: false
          type: "boolean"
        info:
          default: false
          type: "boolean"
      title: "DavisProblemCategories"
      type: "object"
    DavisProblemConfig:
      additionalProperties: false
      properties:
        entityTagsMatch:
          anyOf:
          - $ref: "#/components/schemas/EntityTagsMatch"
          nullable: true
        entityTags:
          anyOf:
          - $ref: "#/components/schemas/EntityTags"
          nullable: true
        onProblemClose:
          default: false
          deprecated: true
          description: "Trigger on Davis problem open only or also on close. Deprecated\
            \ — use triggerOn instead."
          type: "boolean"
        triggerOn:
          description: "Problem state to trigger on. \"open\" (active only), \"open-and-close\"\
            \ (both phases), or \"close\" (closure only). When unset, falls back to\
            \ onProblemClose for backward compatibility."
          nullable: true
          anyOf:
          - $ref: "#/components/schemas/TriggerOn"
        categories:
          $ref: "#/components/schemas/DavisProblemCategories"
        customFilter:
          default: ""
          description: "Additional DQL matcher expression to further filter events\
            \ to match."
          nullable: true
          type: "string"
        analysisReady:
          default: false
          description: "Run only after first root cause analysis run completed."
          type: "boolean"
        severityThreshold:
          description: "Triggers only for problems whose severity is this value or\
            \ more severe. Lower numbers are more severe (1 = critical, 5 = informational),\
            \ so 3 matches severities 1, 2, and 3."
          maximum: 5
          minimum: 1
          nullable: true
          type: "integer"
        triggerOnUpdateFields:
          description: "Problem event fields tracked for value changes. Changes to\
            \ any selected field cause re-triggering."
          items:
            $ref: "#/components/schemas/TriggerOnUpdateFields"
          type: "array"
          uniqueItems: true
        problemOpenDuration:
          description: "Minimum problem duration in minutes before the trigger fires."
          enum:
          - 5
          - 10
          - 15
          - 30
          - 60
          - 120
          - 240
          - 1440
          - 10080
          nullable: true
          type: "integer"
      required:
      - "categories"
      title: "DavisProblemConfig"
      type: "object"
