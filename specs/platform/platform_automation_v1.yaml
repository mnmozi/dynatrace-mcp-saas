    Trigger:
      type: "object"
      properties:
        schedule:
          nullable: true
          anyOf:
          - $ref: "#/components/schemas/Schedule"
        eventTrigger:
          nullable: true
          anyOf:
          - $ref: "#/components/schemas/EventTrigger"
    TriggerExport:
      type: "object"
      properties:
        schedule:
          nullable: true
          anyOf:
          - $ref: "#/components/schemas/ScheduleExport"
        eventTrigger:
          nullable: true
          anyOf:
          - $ref: "#/components/schemas/EventTriggerExport"
    TriggerManualDetail:
      properties:
        userId:
          format: "uuid4"
          nullable: true
          type: "string"
      title: "TriggerManualDetail"
      type: "object"
    TriggerOn:
      enum:
      - "open"
      - "open-and-close"
      - "close"
      type: "string"
    TriggerOnUpdateFields:
      enum:
      - "dt.davis.affected_users_count"
      - "dt.davis.impact_level"
      - "event.category"
      - "event.severity"
      - "root_cause_entity_id"
      - "smartscape.affected_entities"
      type: "string"
    TriggerRequest:
      type: "object"
      properties:
        schedule:
          nullable: true
          anyOf:
          - $ref: "#/components/schemas/ScheduleRequest"
        eventTrigger:
          nullable: true
          anyOf:
          - $ref: "#/components/schemas/EventTriggerRequest"
    TriggerSubType:
      title: "TriggerSubType"
      type: "string"
      enum:
      - "CUSTOM"
      - "DAVIS_PROBLEM"
      - "DAVIS_EVENT"
      - "FIXED_INTERVAL"
      - "TIME_OF_DAY"
      - "CRON"
      - "ONCE"
    TriggerSubTypeDetail:
      properties:
        subType:
          anyOf:
          - $ref: "#/components/schemas/TriggerSubType"
          nullable: true
      title: "TriggerSubTypeDetail"
      type: "object"
    TriggerType:
      title: "TriggerType"
      type: "string"
      enum:
      - "Manual"
      - "Schedule"
      - "Event"
      - "Workflow"
    TriggerTypeDetail:
      anyOf:
      - $ref: "#/components/schemas/TriggerSubTypeDetail"
      - $ref: "#/components/schemas/TriggerWorkflowDetail"
      - $ref: "#/components/schemas/TriggerManualDetail"
      title: "TriggerTypeDetail"
    TriggerWorkflowDetail:
      properties:
        workflowTitle:
          nullable: true
          type: "string"
      title: "TriggerWorkflowDetail"
      type: "object"
    UserSettings:
      properties:
        groups:
          items:
            type: "string"
          type: "array"
      required:
      - "groups"
      title: "UserSettings"
      type: "object"
    ValidationMethod:
      title: "ValidationMethod"
      type: "string"
      enum:
      - "slack"
      - "static"
      - "hmac-sha256"
    VersionResponse:
      properties:
        version:
          type: "string"
      required:
      - "version"
      title: "VersionResponse"
      type: "object"
    WebhookHandler:
      type: "object"
      properties:
        connectionId:
          type: "string"
          readOnly: true
          description: "The connection ID that this webhook corresponds to."
        webhookUrl:
          type: "string"
          readOnly: true
        active:
          type: "boolean"
        validationMethod:
          $ref: "#/components/schemas/ValidationMethod"
        eventSignatureHeader:
          type: "string"
        slackSigningSecret:
          type: "string"
          nullable: true
        staticSecret:
          type: "string"
          nullable: true
        hmacSignaturePrefix:
          type: "string"
          nullable: true
        hmacSignatureEncoding:
          $ref: "#/components/schemas/HmacSignatureEncoding"
        hmacSecret:
          type: "string"
          nullable: true
      required:
      - "active"
      - "connectionId"
      - "eventSignatureHeader"
      - "validationMethod"
      - "webhookUrl"
    WebhookHandlerList:
      type: "object"
      properties:
        connectionId:
          type: "string"
          readOnly: true
          description: "The connection ID that this webhook corresponds to."
        webhookUrl:
          type: "string"
          readOnly: true
        active:
          type: "boolean"
      required:
      - "active"
      - "connectionId"
      - "webhookUrl"
    WebhookHandlerWrite:
      type: "object"
      properties:
        active:
          type: "boolean"
        validationMethod:
          $ref: "#/components/schemas/ValidationMethod"
        eventSignatureHeader:
          type: "string"
        slackSigningSecret:
          type: "string"
