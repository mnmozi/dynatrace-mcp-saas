openapi: "3.0.3"
info:
  title: "Automation"
  version: "1.4376.3"
  description: "Manage and run workflows with the AutomationEngine API."
  x-service-category: "AutomationEngine"
  x-summary: "Manage and run workflows with the AutomationEngine API."
paths:
  /action-executions/{id}:
    get:
      operationId: "getActionExecution"
      parameters:
      - in: "query"
        name: "adminAccess"
        schema:
          type: "boolean"
          default: false
        description: "Allow access to all workflows/executions - additionally requires\
          \ **automation:workflows:admin**"
      - in: "path"
        name: "id"
        schema:
          type: "string"
          format: "uuid"
        description: "A UUID string identifying this action execution."
        required: true
      tags:
      - "action-executions"
      security:
      - client_credentials:
        - "automation:workflows:read"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionExecution"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** automation:workflows:read"
  /action-executions/{id}/log:
    get:
      operationId: "getActionExecutionLog"
      description: "**Required scope:** automation:workflows:read<br/><br/>Returns\
        \ the log output of a specific ActionExecution."
      parameters:
      - in: "query"
        name: "adminAccess"
        schema:
          type: "boolean"
          default: false
        description: "Allow access to all workflows/executions - additionally requires\
          \ **automation:workflows:admin**"
      - in: "path"
        name: "id"
        schema:
          type: "string"
          format: "uuid"
        description: "A UUID string identifying this action execution."
        required: true
      tags:
      - "action-executions"
      security:
      - client_credentials:
        - "automation:workflows:read"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: "string"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
  /actions-sample-result/{actionIdentifier}:
    get:
      operationId: "getActionSampleResult"
      parameters:
      - in: "path"
        name: "actionIdentifier"
        schema:
          type: "string"
        required: true
      tags:
      - "actions-sample-result"
      security:
      - client_credentials:
        - "automation:workflows:read"
      - ssoBearerAuth: []
      deprecated: true
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** automation:workflows:read"
  /business-calendars:
    get:
      operationId: "getBusinessCalendars"
      parameters:
      - name: "limit"
        required: false
        in: "query"
        description: "Number of results to return per page."
        schema:
          type: "integer"
      - name: "offset"
        required: false
        in: "query"
        description: "The initial index from which to return the results."
        schema:
          type: "integer"
      - name: "ordering"
        required: false
        in: "query"
        description: "Which field to use when ordering the results."
        schema:
          type: "string"
      - name: "search"
        required: false
        in: "query"
        description: "A search term."
        schema:
          type: "string"
      tags:
      - "business-calendars"
      security:
      - client_credentials:
        - "automation:calendars:read"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedBusinessCalendarResponseList"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** automation:calendars:read"
    post:
      operationId: "createBusinessCalendar"
      tags:
      - "business-calendars"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessCalendarCreate"
        required: true
      security:
      - client_credentials:
        - "automation:calendars:write"
      - ssoBearerAuth: []
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessCalendarResponse"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** automation:calendars:write"
  /business-calendars/{id}:
    get:
      operationId: "getBusinessCalendar"
      parameters:
      - in: "path"
        name: "id"
        schema:
          type: "string"
          format: "uuid"
        description: "A UUID string identifying this business calendar."
        required: true
      tags:
      - "business-calendars"
      security:
      - client_credentials:
        - "automation:calendars:read"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessCalendarResponse"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** automation:calendars:read"
    put:
      operationId: "updateBusinessCalendar"
      parameters:
      - in: "path"
        name: "id"
        schema:
          type: "string"
          format: "uuid"
        description: "A UUID string identifying this business calendar."
        required: true
      tags:
      - "business-calendars"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessCalendarUpdate"
        required: true
      security:
      - client_credentials:
        - "automation:calendars:write"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessCalendarResponse"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** automation:calendars:write"
    patch:
      operationId: "patchBusinessCalendar"
      parameters:
      - in: "path"
        name: "id"
        schema:
          type: "string"
          format: "uuid"
        description: "A UUID string identifying this business calendar."
        required: true
      tags:
      - "business-calendars"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessCalendarUpdate"
        required: true
      security:
      - client_credentials:
        - "automation:calendars:write"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessCalendarResponse"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** automation:calendars:write"
    delete:
      operationId: "deleteBusinessCalendar"
      parameters:
      - in: "path"
        name: "id"
        schema:
          type: "string"
          format: "uuid"
        description: "A UUID string identifying this business calendar."
        required: true
      tags:
      - "business-calendars"
      security:
      - client_credentials:
        - "automation:calendars:write"
      - ssoBearerAuth: []
      responses:
        "204":
          description: "No response body"
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** automation:calendars:write"
  /business-calendars/{id}/duplicate:
    post:
      operationId: "duplicateBusinessCalendar"
      parameters:
      - in: "path"
        name: "id"
        schema:
          type: "string"
          format: "uuid"
        description: "A UUID string identifying this business calendar."
        required: true
      tags:
      - "business-calendars"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DuplicationRequest"
        required: true
      security:
      - client_credentials:
        - "automation:calendars:write"
      - ssoBearerAuth: []
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessCalendarResponse"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** automation:calendars:write"
  /business-calendars/{id}/history:
    get:
      operationId: "getBusinessCalendarHistoryRecords"
      parameters:
      - in: "query"
        name: "all"
        schema:
          type: "boolean"
          default: false
        description: "When false, the latest historical record is not returned."
        deprecated: true
      - in: "path"
        name: "id"
        schema:
          type: "string"
          format: "uuid"
        description: "A UUID string identifying this business calendar."
        required: true
      tags:
      - "business-calendars"
      security:
      - client_credentials:
        - "automation:calendars:read"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedChangeHistory"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** automation:calendars:read"
  /business-calendars/{id}/history/{version}:
    get:
      operationId: "getBusinessCalendarHistoryRecord"
      parameters:
      - in: "path"
        name: "id"
        schema:
          type: "string"
          format: "uuid"
        description: "A UUID string identifying this business calendar."
        required: true
      - in: "path"
        name: "version"
        schema:
          type: "string"
          pattern: "^[\\d]+$"
        required: true
      tags:
      - "business-calendars"
      security:
      - client_credentials:
        - "automation:calendars:read"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessCalendarResponse"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** automation:calendars:read"
  /business-calendars/{id}/history/{version}/restore:
    post:
      operationId: "restoreBusinessCalendarHistoryRecord"
      parameters:
      - in: "path"
        name: "id"
        schema:
          type: "string"
          format: "uuid"
        description: "A UUID string identifying this business calendar."
        required: true
      - in: "path"
        name: "version"
        schema:
          type: "string"
          pattern: "^[\\d]+$"
        required: true
      tags:
      - "business-calendars"
      security:
      - client_credentials:
        - "automation:calendars:write"
      - ssoBearerAuth: []
      responses:
        "200":
          description: "No response body"
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** automation:calendars:write"
  /event-triggers/filter-preview:
    post:
      operationId: "previewFilter"
      tags:
      - "event-triggers"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventTriggerPreviewRequest"
        required: true
      security:
      - client_credentials:
        - "automation:workflows:read"
      - ssoBearerAuth: []
      deprecated: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventTriggerPreviewResponse"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** automation:workflows:read"
  /executions:
    get:
      operationId: "getExecutions"
      description: "**Required scope:** automation:workflows:read<br/><br/>Get list\
        \ of executions (executions of draft and simple workflows aren't included\
        \ in the response)."
      parameters:
      - in: "query"
        name: "adminAccess"
        schema:
          type: "boolean"
          default: false
        description: "Allow access to all workflows/executions - additionally requires\
          \ **automation:workflows:admin**"
      - name: "limit"
        required: false
        in: "query"
        description: "Number of results to return per page."
        schema:
          type: "integer"
      - name: "offset"
        required: false
        in: "query"
        description: "The initial index from which to return the results."
        schema:
          type: "integer"
      - name: "ordering"
        required: false
        in: "query"
        description: "Which field to use when ordering the results."
        schema:
          type: "string"
      - in: "query"
        name: "parentExecution"
        schema:
          type: "string"
          format: "uuid"
      - in: "query"
        name: "parentWorkflow"
        schema:
          type: "string"
          format: "uuid"
      - in: "query"
        name: "schedule"
        schema:
          type: "array"
          items:
            type: "string"
            format: "uuid"
        description: "Multiple values may be separated by commas."
        explode: false
        style: "form"
      - name: "search"
        required: false
        in: "query"
        description: "A search term."
        schema:
          type: "string"
      - in: "query"
        name: "startedAt__gte"
        schema:
          type: "string"
          format: "date-time"
      - in: "query"
        name: "startedAt__lte"
        schema:
          type: "string"
          format: "date-time"
      - in: "query"
        name: "state"
        schema:
          type: "array"
          items:
            type: "string"
        description: "Multiple values may be separated by commas."
        explode: false
        style: "form"
      - in: "query"
        name: "subworkflowOfTask"
        schema:
          type: "string"
        description: "Filter executions by `parentExecution/task`."
      - in: "query"
        name: "trigger"
        schema:
          type: "string"
      - in: "query"
        name: "triggerType"
        schema:
          type: "string"
      - in: "query"
        name: "user"
        schema:
          type: "array"
          items:
            type: "string"
            format: "uuid"
        description: "Multiple values may be separated by commas."
        explode: false
        style: "form"
      - in: "query"
        name: "workflow"
        schema:
          type: "array"
          items:
            type: "string"
            format: "uuid"
        description: "Multiple values may be separated by commas."
        explode: false
        style: "form"
      tags:
      - "executions"
      security:
      - client_credentials:
        - "automation:workflows:read"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedExecutionList"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
  /executions/{executionId}/tasks:
    get:
      operationId: "getTaskExecutions"
      parameters:
      - in: "query"
        name: "adminAccess"
        schema:
          type: "boolean"
          default: false
        description: "Allow access to all workflows/executions - additionally requires\
          \ **automation:workflows:admin**"
      - in: "path"
        name: "executionId"
        schema:
          type: "string"
          format: "uuid"
        required: true
      tags:
      - "executions"
      security:
      - client_credentials:
        - "automation:workflows:read"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskExecutions"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** automation:workflows:read"
  /executions/{executionId}/tasks/{id}:
    get:
      operationId: "getTaskExecution"
      parameters:
      - in: "query"
        name: "adminAccess"
        schema:
          type: "boolean"
          default: false
        description: "Allow access to all workflows/executions - additionally requires\
          \ **automation:workflows:admin**"
      - in: "path"
        name: "executionId"
        schema:
          type: "string"
          format: "uuid"
        required: true
      - in: "path"
        name: "id"
        schema:
          type: "string"
        description: "Task name"
        required: true
      tags:
      - "executions"
      security:
      - client_credentials:
        - "automation:workflows:read"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskExecution"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** automation:workflows:read"
  /executions/{executionId}/tasks/{id}/cancel:
    post:
      operationId: "cancelTaskExecution"
      description: "**Required scope:** automation:workflows:run<br/><br/>Cancels\
        \ task execution.\nCanceling action executions cause the task to be cancelled,\
        \ which\ncauses the workflow to be canceled."
      parameters:
      - in: "query"
        name: "adminAccess"
        schema:
          type: "boolean"
          default: false
        description: "Allow access to all workflows/executions - additionally requires\
          \ **automation:workflows:admin**"
      - in: "path"
        name: "executionId"
        schema:
          type: "string"
          format: "uuid"
        required: true
      - in: "path"
        name: "id"
        schema:
          type: "string"
        description: "Task name"
        required: true
      tags:
      - "executions"
      security:
      - client_credentials:
        - "automation:workflows:run"
      - ssoBearerAuth: []
      responses:
        "200":
          description: "No response body"
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
  /executions/{executionId}/tasks/{id}/input:
    get:
      operationId: "getTaskExecutionInput"
      description: "**Required scope:** automation:workflows:read<br/><br/>Returns\
        \ merged inputs from all ActionExecutions belonging to the TaskExecution."
      parameters:
      - in: "query"
        name: "adminAccess"
        schema:
          type: "boolean"
          default: false
        description: "Allow access to all workflows/executions - additionally requires\
          \ **automation:workflows:admin**"
      - in: "path"
        name: "executionId"
        schema:
          type: "string"
          format: "uuid"
        required: true
      - in: "path"
        name: "id"
        schema:
          type: "string"
        description: "Task name"
        required: true
      tags:
      - "executions"
      security:
      - client_credentials:
        - "automation:workflows:read"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
  /executions/{executionId}/tasks/{id}/log:
    get:
      operationId: "getTaskExecutionLog"
      description: "**Required scope:** automation:workflows:read<br/><br/>Returns\
        \ the log output of a specific task.\nThis can be large as its the STDOUT\
        \ of the Action\nas defined by the user."
      parameters:
      - in: "query"
        name: "adminAccess"
        schema:
          type: "boolean"
          default: false
        description: "Allow access to all workflows/executions - additionally requires\
          \ **automation:workflows:admin**"
      - in: "path"
        name: "executionId"
        schema:
          type: "string"
          format: "uuid"
        required: true
      - in: "path"
        name: "id"
        schema:
          type: "string"
        description: "Task name"
        required: true
      tags:
      - "executions"
      security:
      - client_credentials:
        - "automation:workflows:read"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: "string"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
  /executions/{executionId}/tasks/{id}/result:
    get:
      operationId: "getTaskExecutionResult"
      description: "**Required scope:** automation:workflows:read<br/><br/>Returns\
        \ merged results from all ActionExecutions belonging to the TaskExecution."
      parameters:
      - in: "query"
        name: "adminAccess"
        schema:
          type: "boolean"
          default: false
        description: "Allow access to all workflows/executions - additionally requires\
          \ **automation:workflows:admin**"
      - in: "path"
        name: "executionId"
        schema:
          type: "string"
          format: "uuid"
        required: true
      - in: "path"
        name: "id"
        schema:
          type: "string"
        description: "Task name"
        required: true
      tags:
      - "executions"
      security:
      - client_credentials:
        - "automation:workflows:read"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
  /executions/{executionId}/transitions:
    get:
      operationId: "getTransitions"
      parameters:
      - in: "query"
        name: "adminAccess"
        schema:
          type: "boolean"
          default: false
        description: "Allow access to all workflows/executions - additionally requires\
          \ **automation:workflows:admin**"
      - in: "path"
        name: "executionId"
        schema:
          type: "string"
          format: "uuid"
        required: true
      tags:
      - "executions"
      security:
      - client_credentials:
        - "automation:workflows:read"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTransitions"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** automation:workflows:read"
  /executions/{id}:
    get:
      operationId: "getExecution"
      description: "**Required scope:** automation:workflows:read<br/><br/>Get execution"
      parameters:
      - in: "query"
        name: "adminAccess"
        schema:
          type: "boolean"
          default: false
        description: "Allow access to all workflows/executions - additionally requires\
          \ **automation:workflows:admin**"
      - in: "path"
        name: "id"
        schema:
          type: "string"
          format: "uuid"
        description: "A UUID string identifying this execution."
        required: true
      tags:
      - "executions"
      security:
      - client_credentials:
        - "automation:workflows:read"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Execution"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
