          nullable: true
        entityTags:
          anyOf:
          - $ref: "#/components/schemas/EntityTags"
          nullable: true
        onProblemClose:
          default: false
          deprecated: true
          description: "Trigger on Davis event open only or also on close. Deprecated\
            \ — use triggerOn instead."
          type: "boolean"
        triggerOn:
          description: "Event state to trigger on. \"open\" (active only), \"open-and-close\"\
            \ (both phases), or \"close\" (closure only). When unset, falls back to\
            \ onProblemClose for backward compatibility."
          nullable: true
          anyOf:
          - $ref: "#/components/schemas/TriggerOn"
        names:
          items:
            $ref: "#/components/schemas/DavisEventName"
          nullable: true
          type: "array"
          uniqueItems: true
        types:
          deprecated: true
          items:
            type: "string"
          nullable: true
          type: "array"
          uniqueItems: true
        customFilter:
          default: ""
          description: "Additional DQL matcher expression to further filter events\
            \ to match."
          nullable: true
          type: "string"
        maintenanceWindowTriggerBehavior:
          default: "always"
          anyOf:
          - $ref: "#/components/schemas/MaintenanceWindowTriggerBehaviorType"
      title: "DavisEventConfig"
      type: "object"
    DavisEventName:
      additionalProperties: false
      properties:
        match:
          $ref: "#/components/schemas/DavisEventNameMatch"
        name:
          type: "string"
      required:
      - "match"
      - "name"
      title: "DavisEventName"
      type: "object"
