components:
  schemas:
    ActionExecution:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        taskExe:
          type: "string"
          format: "uuid"
          description: "Parent task execution"
        state:
          $ref: "#/components/schemas/ActionExecutionState"
        stateInfo:
          type: "string"
          nullable: true
        input:
          type: "object"
          additionalProperties: {}
        result: {}
        startedAt:
          type: "string"
          format: "date-time"
          nullable: true
        endedAt:
          type: "string"
          format: "date-time"
          nullable: true
        runtime:
          type: "integer"
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        actionExecutionId:
          type: "string"
          nullable: true
          maxLength: 50
        attempt:
          type: "integer"
          maximum: 2147483647
          minimum: -2147483648
        loopItem:
          type: "object"
          additionalProperties: {}
        action:
          type: "string"
          maxLength: 200
      required:
      - "action"
      - "taskExe"
      - "id"
    ActionExecutionState:
