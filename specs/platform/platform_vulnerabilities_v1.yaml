  /vulnerabilities/{id}:
    get:
      summary: "Get details of a vulnerability"
      description: "**Required scope:** vulnerability-service:vulnerabilities:read<br/><br/>This\
        \ endpoint allows users to query details about a single vulnerability.\nNote\
