openapi: "3.0.0"
info:
  version: "1.7.1"
  title: "Vulnerabilities"
  description: "APIs that manage vulnerability related information."
  x-service-category: "Vulnerabilities"
  x-summary: "APIs that manage vulnerability related information."
servers:
- url: "https://asn8731h.sprint.apps.dynatracelabs.com/platform/vulnerabilities/v1"
  x-api-gateway-url: "/platform/vulnerabilities/v1"
paths:
  /vulnerabilities:
    get:
      summary: "List vulnerabilities"
      description: "**Required scope:** vulnerability-service:vulnerabilities:read<br/><br/>This\
        \ endpoint allows users to query vulnerabilities.\nNote that users also need\
        \ permissions to read security events (see `storage:security.events:read`,\
        \ `storage:events:read`\nand `storage:buckets:read`).\n"
      operationId: "listVulnerabilities"
      tags:
      - "Vulnerabilities"
      parameters:
      - $ref: "#/components/parameters/vulnerabilitiesFilter"
      - $ref: "#/components/parameters/vulnerabilitiesSort"
      - $ref: "#/components/parameters/startTimeQueryParameter"
      - $ref: "#/components/parameters/endTimeQueryParameter"
      security:
      - ssoAuth:
        - "vulnerability-service:vulnerabilities:read"
      - ssoBearerAuth: []
      responses:
        "200":
          description: "An array of vulnerabilities"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vulnerabilities"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /vulnerabilities:segment:
    post:
      summary: "List vulnerabilities with a segment filter"
      description: "**Required scope:** vulnerability-service:vulnerabilities:read<br/><br/>This\
        \ endpoint allows users to query vulnerabilities.\nNote that users also need\
        \ permissions to read security events (see `storage:security.events:read`,\
        \ `storage:events:read`\nand `storage:buckets:read`).\n"
      operationId: "listVulnerabilitiesWithSegments"
      tags:
      - "Vulnerabilities"
      parameters:
      - $ref: "#/components/parameters/vulnerabilitiesFilter"
      - $ref: "#/components/parameters/vulnerabilitiesSort"
      - $ref: "#/components/parameters/startTimeQueryParameter"
      - $ref: "#/components/parameters/endTimeQueryParameter"
      security:
      - ssoAuth:
        - "vulnerability-service:vulnerabilities:read"
      - ssoBearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SegmentRequestBody"
        description: "The JSON body of the request containing the filter segments."
      responses:
